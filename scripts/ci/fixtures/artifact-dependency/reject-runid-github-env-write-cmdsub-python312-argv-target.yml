# SPDX-License-Identifier: MIT
# Fixture: `python3.12 -c` — the version-suffixed interpreter
# spelling (issue #345, re-lens 1 NIT-1). The version-suffix
# mechanism was previously pinned only by a synthetic probe;
# runtime-malicious (rc=0, current run last).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(python3.12 -c 'import sys; open(sys.argv[1],"a").write("SOURCE_RUN_ID=${{ github.run_id }}\n")' "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
