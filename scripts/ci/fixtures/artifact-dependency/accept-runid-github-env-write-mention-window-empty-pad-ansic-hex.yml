# Fixture (boundary accept): the `$'\x00'` NUL spelling is a measured
# survivor of the bounded elision and stays accepted while runtime-FLIPping
# (issue #350, item 8 boundary).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          eval echo SOURCE_RUN_ID=${{ github.run_id }} '>>' \$GITHUB_$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'$'\x00'ENV
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
