# Fixture: OVER-REFUSAL PIN, D5 (issue #345, fold round 2). A
# recognized shell invoked with an unreadable variable operand
# (`bash "$script"`) is fail-closed because the word may be the
# command flag; the runtime is benign (the script does not
# exist). Same class as `bash script.sh "$arg"`.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(bash "$script")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
