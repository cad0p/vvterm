# Fixture (boundary accept): a process-substitution script operand; the
# program is opaque and the operand is not an argv file target (issue
# #350, item 5).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          python3 <(printf 'import os\nn="".join(chr(c) for c in [71,73,84,72,85,66,95,69,78,86])\nk="".join(chr(c) for c in [83,79,85,82,67,69,95,82,85,78,95,73,68])\nopen(os.environ[n],"a").write(k+"=${{ github.run_id }}\\n")')
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
