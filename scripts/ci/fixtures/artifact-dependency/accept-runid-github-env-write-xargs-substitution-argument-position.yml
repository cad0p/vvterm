# SPDX-License-Identifier: MIT
# Fixture (accept control, residual): an `xargs` word inside a
# substitution in an *argument* position (`echo $(xargs …)`) runs
# with the shell's stdin, but it is not the command position the
# carrier model reads; the substitution scan never assigns it the
# pipeline's feed. Measured ACCEPT, runtime FLIP, a named residual
# (issue #350f fold round 4).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" | echo $(xargs -I{} cp payload {})
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
