# SPDX-License-Identifier: MIT
# Fixture: `github-token: ${{ secrets.SOME_UNSET }}` (round-5 R5-MINOR-2). An
# unset secret evaluates to the empty string, so the token is empty at runtime
# and the cross-run exclusion cannot be proven; only the exact
# `${{ secrets.GITHUB_TOKEN }}` form is provably non-empty.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.SOME_UNSET }}
