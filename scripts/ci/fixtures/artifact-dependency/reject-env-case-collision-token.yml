# Fixture: a case-colliding job `env:` mapping. The gate's exact-case lookup
# resolves GH_TOKEN (present), but a Windows runner's `OrdinalIgnoreCase`
# env context is last-wins, so `gh_token: ""` wins and the runtime token is
# empty: the action ignores `run-id:` and the download is same-run. The
# winning-assignment predicate refuses instead of excluding (issue #341).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      gh_token: ""
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
