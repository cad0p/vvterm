# Fixture: the direct `with.github-token:` spelled `NULL` — a YAML core null
# spelling, empty at runtime (#334 BLOCKER-2). A fix that only resolves the
# lowercase `null` spelling leaves this silent.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: NULL
