# SPDX-License-Identifier: MIT
# Fixture: the env-write payload `X=$( ... >> "$n")` hidden write
# (issue #345, shape `t2-payload-word-hidden-write` = battery f06).
# The segment already has an env redirect, so the reference check was
# skipped and the payload word never inspected.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          m=1; n="$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf '%s\n' "X=$(printf '%s\n' "SOURCE_""RUN_ID=${{ github.run_id }}" >> "$n")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
