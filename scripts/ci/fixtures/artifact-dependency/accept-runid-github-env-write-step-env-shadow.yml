# SPDX-License-Identifier: MIT
# Fixture: the download step's own `env:` assigns the written name, and a
# step's own `env:` wins over a `$GITHUB_ENV` write — the write cannot
# flip it, so the exclusion stands (lens-2 NIT-1; issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Resolve run context
        run: |
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
