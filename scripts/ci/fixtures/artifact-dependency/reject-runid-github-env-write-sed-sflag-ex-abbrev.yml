# SPDX-License-Identifier: MIT
# Fixture: the `--e=` abbreviation spelling (issue #350d named
# variant). base ACCEPT -> head REFUSE, runtime FLIP under GNU sed
# 4.10 (FreeBSD sed rejects the option).
name: reject-runid-github-env-write-sed-sflag-ex-abbrev
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          sed -n --e="s/.*/&/w${arr[0]}" payload
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
