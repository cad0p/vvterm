# SPDX-License-Identifier: MIT
# Fixture (over-refusal pin): the array-element argv target with no write
# at all — `arr` is never filled, so the target mention alone puts `arr`
# in the relevance set and the occurrence backstop refuses. Base ACCEPT;
# runtime cross-run (`cp payload ""` fails, the env file is untouched);
# benign, 0 real-tree witnesses (issue #350, item 1 over-refusal class;
# fold round 1 MINOR-1).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          cp payload "${arr[0]}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
