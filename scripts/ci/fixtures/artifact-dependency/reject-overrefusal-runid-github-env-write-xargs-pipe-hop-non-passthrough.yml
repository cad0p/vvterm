# SPDX-License-Identifier: MIT
# Fixture (over-refusal pin): the redirect-only middle command
# (`2<<< "pad"`) emits nothing, so the operand cannot reach the
# second `xargs`; the pipe-chain walk assumes the operand flows
# through every hop and refuses a valid bash shape (issue #350f
# fold round 4; base ACCEPT, runtime NOFLIP).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" |
          2<<< "pad" | xargs -I{} cp payload {}
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
