# Fixture: a `uses:` value written as a folded block scalar (lens-1 B2).
# GitHub resolves it to actions/download-artifact@v8; the gate must refuse
# the `>-` header rather than treat the step as artifact-free.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: >-
          actions/download-artifact@v8
        with:
          name: vvterm-build
