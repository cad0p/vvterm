# SPDX-License-Identifier: MIT
# Fixture: a cross-run `run-id:` whose `env.NAME` is assigned only on ANOTHER
# job (round-5 R5-MINOR-1). The consumer cannot see that assignment, so the
# run-id is empty at runtime and the download falls back to the current run:
# a cross-run handoff cannot be proven, and the gate must refuse rather than
# keep the exclusion. (Pre-fix this was a silent pass: the file-global index
# found the out-of-scope assignment and excluded the download.)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  helper:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - run: echo hi
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
