# Fixture: OVER-REFUSAL PIN, php long-option inline-program
# widening (issue #345, fold round 4). The trailing argv word is
# an unset shell variable used as a value, not a path, so the
# runtime is benign; the fail-closed resolver refuses it. Same
# class as the short-spelling pins.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(php --run 'echo 1;' "$MESSAGE")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
