# Fixture: the padded window: a command substitution supplies the gap (the `$(...)` elision branch)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          LONGPADLONGPADLONGPADLONGPADLONGPADLONGPADLONGPADLONGPADLONGPAD=_
          eval "echo SOURCE_RUN_ID=${{ github.run_id }} >> \$GITHUB$(printf %s "${LONGPADLONGPADLONGPADLONGPADLONGPADLONGPADLONGPADLONGPADLONGPAD}")ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
