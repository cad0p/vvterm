# SPDX-License-Identifier: MIT
# Fixture (accept control, residual): the split string is assembled
# at runtime (`env -S "$CMD …"` with `CMD: xargs` from the job
# env:), so the gate cannot know the command and accepts; runtime
# FLIP, a named residual (issue #350f fold round 1, F1 residual).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
      CMD: xargs
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" |
          env -S "$CMD -I{} cp payload {}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
