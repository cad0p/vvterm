# Fixture: the LITERAL runner root + set_env_* glob; base ACCEPT -> v3 REFUSE.
# Runtime: FLIP (the glob matches the step's rotated env file).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
      - name: flip
        run: |
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" >> /home/runner/work/_temp/_runner_file_commands/set_env_*
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
