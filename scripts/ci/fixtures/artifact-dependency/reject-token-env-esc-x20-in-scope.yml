# Fixture: a "\x20" escape is a space at runtime, so the token input is ECMAScript-empty and the download is same-run: the decoder must decode the escape, not read the text `x20` (silent pass)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: "\x20"
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
