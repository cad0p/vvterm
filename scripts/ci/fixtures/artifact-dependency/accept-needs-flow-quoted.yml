# Fixture: a quoted flow item is a real edge (`needs: ["build"]`) and must stay accepted — the escape check refuses only unsupported escapes, never a legal quoted scalar (impl lens-2 NIT 2)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    needs: ["build"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
