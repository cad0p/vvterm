# SPDX-License-Identifier: MIT
# Fixture: OVER-REFUSAL PIN, shape `a7-unquoted-subshell-assembled`
# (malformed no-trailing-newline value class, issue #345).
# `printf '%s'` writes no trailing newline, so the env file does not
# end on a clean cross-run value; the gate refuses fail-closed
# rather than reading an ambiguous last value.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          m=1; n="$GITHUB_ENV"
          x=$(printf '%s' "SOURCE_""RUN_ID=42424242" >> "$n")
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
