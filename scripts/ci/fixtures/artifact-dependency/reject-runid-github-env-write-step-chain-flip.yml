# SPDX-License-Identifier: MIT
# Fixture: the genuine chain flip. A STEP-level `env:` link
# (`A: ${{ env.B }}`) is re-evaluated against the post-write environment,
# so a same-job write of `B` really does flip `env.A` to the current run
# (lens-2 MAJOR-1; issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      B: ${{ github.event.workflow_run.id }}
    steps:
      - name: Resolve run context
        run: |
          echo "B=${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        env:
          A: ${{ env.B }}
        with:
          name: vvterm-build
          run-id: ${{ env.A }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
