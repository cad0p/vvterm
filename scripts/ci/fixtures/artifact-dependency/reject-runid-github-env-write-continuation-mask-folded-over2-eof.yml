# Fixture: a `>2` folded scalar with the verb at the explicit content indent and the target at EOF (fix15 shape)
# #350 item 12; base ACCEPT -> shipped REFUSE, runtime FLIP.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: >2
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"; printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload; printf '%s\n' "$(printenv "${x}${y}")" > pf; read -a arr < pf;
          cp payload \
            "${arr[0]}" \
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
