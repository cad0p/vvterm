# SPDX-License-Identifier: MIT
# Fixture: the set_env_* glob resolved by a command substitution; base ACCEPT -> head REFUSE, runtime FLIP
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
      - name: flip
        run: |
          f=$(ls "$RUNNER_TEMP/_runner_file_commands/set_env_"* | head -1)
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" >> "$f"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
