# SPDX-License-Identifier: MIT
# Fixture: a literal-integer `run-id:` without `github-token:`
# (round-4 R4-NIT-2). actions/download-artifact ignores `run-id:` when the
# token is empty, so this is a same-run download and its `needs:` path is
# required; the literal-integer branch must consult the token like the
# expression branch does.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: 12345
