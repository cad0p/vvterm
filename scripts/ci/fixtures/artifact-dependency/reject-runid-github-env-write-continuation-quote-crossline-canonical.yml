# SPDX-License-Identifier: MIT
# Fixture: a single quote opened on the previous line masks the closing line's trailing
# backslash: the canonical cross-line-quote witness (cp last operand)
# #350 item 12 fold round 1 lens-1 BLOCKER-1; base ACCEPT -> folded REFUSE,
# runtime FLIP.
name: reject-runid-github-env-write-continuation-quote-crossline-canonical
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          echo 'a \
          b' ; cp payload \
          "${arr[0]}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
