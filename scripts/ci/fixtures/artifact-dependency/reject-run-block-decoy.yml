# Fixture: a `run: |` body containing a `needs: build` decoy. Block scalars
# are opaque; the decoy must not satisfy the edge (plan §4.5).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
      - run: |
          echo "decoy"
          needs: build
