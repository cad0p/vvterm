# SPDX-License-Identifier: MIT
# Fixture (accept control): the benign twin of the single-quote-join reject
# — the same BSD `$a\` two-line append with a literal file target; joining
# the single-quoted script must not refuse it (issue #350, item 7
# boundary).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'x\n' > payload
          sed -i '' '$a\
          SOURCE_RUN_ID=${{ github.run_id }}' payload
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
