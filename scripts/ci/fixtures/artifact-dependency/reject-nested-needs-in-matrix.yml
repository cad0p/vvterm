# SPDX-License-Identifier: MIT
# Fixture: a `needs: build` nested inside strategy.matrix.include must not
# count as a job-level edge (recheck fx16). The downloader is really edgeless.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
