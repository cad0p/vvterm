# SPDX-License-Identifier: MIT
# Fixture: `bash -ec "..."` carrier (issue #345, fold round 1 F1).
# A short-option cluster that contains `c` carries a command
# string exactly as the bare `-c` does, so the carrier check must
# recognize the cluster; runtime-malicious (rc=0, current run
# last).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(bash -ec "printf '%s\n' SOURCE_RUN_ID=${{ github.run_id }} >> \$${x}${y}")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
