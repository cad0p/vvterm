# SPDX-License-Identifier: MIT
# Fixture: OVER-REFUSAL PIN, shape `fz-o6-i4` (subshell name-writing
# mechanism class, issue #345; see also `fz-o6-i5` `mapfile` and
# `fz-o6-i7` `printf -v`). `read` inside a `$( ... )` body is
# subshell-local and writes `x`, so the runtime is benign; the gate
# refuses fail-closed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          m=1; n="$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf '%s\n' "x=$(read SOURCE_RUN_ID <<< ${{ github.run_id }} && printf x >> "$GITHUB_ENV")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
