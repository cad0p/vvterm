# SPDX-License-Identifier: MIT
# Fixture: the alias target is assigned on a later line after a closed
# multi-line `$( … )`, so the redirect to `$n` resolves to the env file. The
# fold-5 depth tracker marked the alias assignment subshell-local and
# refused (issue #342, fold-6 BLOCKER-1; non-vacuous, the download keeps the
# exclusion).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          x="$(
            echo hi
          )"
          m=1; n="$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$n"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
