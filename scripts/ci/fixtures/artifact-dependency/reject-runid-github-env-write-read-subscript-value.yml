# SPDX-License-Identifier: MIT
# Fixture: `read "CI_RUN_ID[0]"` writes element 0 through the modelled `read`
# mechanism, whose operand parser silently drops the bracketed word
# (issue #342, F3/MAJOR-5; fail-open at base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          CI_RUN_ID="${{ github.event.workflow_run.id }}"
          read "CI_RUN_ID[0]" <<< 42424242
          echo "SOURCE_RUN_ID=$CI_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
