# SPDX-License-Identifier: MIT
# Fixture: a command substitution holding a multi-command list whose second
# command writes the env file. A `;` inside the substitution is not a
# top-level separator, so the loose alias skip folded the whole thing into
# one word; the RHS is not a pure env-file spelling, so the reference
# refusal fires (issue #342, BLOCKER-1).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          x=$(n=1; echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
