# SPDX-License-Identifier: MIT
# Fixture: `dd of="$GITHUB_ENV"` inside a substitution whose
# enclosing segment redirects to the env file (issue #345, fold
# round 1 F2), the `dd` spelling of the deferral hole;
# runtime-malicious (the truncating `dd` write is the file's whole
# content).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          echo "N=$(printf '%s\n' "SOURCE_RUN_ID=${{ github.run_id }}" | dd of="$GITHUB_ENV" status=none)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
