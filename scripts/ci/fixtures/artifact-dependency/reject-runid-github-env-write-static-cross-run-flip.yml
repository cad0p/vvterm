# SPDX-License-Identifier: MIT
# Fixture: a statically cross-run `env:` assignment whose runtime value a
# same-job `$GITHUB_ENV` write flips to the current run — the exclusion
# must not survive (issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Resolve run context
        run: |
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
