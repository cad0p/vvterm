# SPDX-License-Identifier: MIT
# Fixture: the written value is a command substitution, so the runtime
# value cannot be classified — refusing rather than guessing (issue
# #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          echo "SOURCE_RUN_ID=$(gh api repos/${{ github.repository }}/actions/runs --jq '.workflow_runs[0].id')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
