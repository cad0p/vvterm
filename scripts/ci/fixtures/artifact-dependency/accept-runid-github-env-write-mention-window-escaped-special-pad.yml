# Fixture: the `(?<!\\)` guard: escaped `\$@` pads are literal text for the later eval and must not be elided (fold lens-2 MINOR-1)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          eval "echo X >> \$GITHUB_\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@\$@ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
