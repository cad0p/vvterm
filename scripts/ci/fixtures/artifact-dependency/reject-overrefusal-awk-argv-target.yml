# Fixture: OVER-REFUSAL PIN, A6 shape `t03-awk-argv` (issue #345).
# `awk -v p="${x}${y}"` assembles the relative filename `GITHUB_ENV`,
# not the env-file path, so the runtime is benign-as-stored; the A6
# argv widening refuses fail-closed.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(awk -v p="${x}${y}" 'BEGIN{print "SOURCE_RUN_ID=${{ github.run_id }}" >> p}')
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
