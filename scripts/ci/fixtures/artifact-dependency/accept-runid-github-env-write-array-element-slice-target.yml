# SPDX-License-Identifier: MIT
# Fixture (accept control, boundary): the array slice spelling
# `"${arr[@]:0}"` is not a pure reference — `_LOCAL_REFERENCE_RE` requires
# `}` immediately after `[...]`, so `arr` never joins the relevance set.
# Widening the subscript pattern to an offset suffix is a matcher change
# deferred as a residual (issue #350, item 1 boundary class; fold round 1
# MAJOR-3: base ACCEPT, shipped ACCEPT, runtime FLIP).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          cp payload "${arr[@]:0}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
