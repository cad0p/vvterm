# SPDX-License-Identifier: MIT
# Fixture: a `$(…)` pad whose interior double-quoted string carries an escaped quote (`\"`) defeats the regex elision's first-`[^()]*`-fragment match; the balanced scanner must flatten it whole (fold round 4, escape spelling of re-lens 3 BLOCKER-1)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          eval "echo SOURCE_RUN_ID=${{ github.run_id }} >> \$GITHUB_$( : "x\" )" ; printf '' # (AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          )ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
