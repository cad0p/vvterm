# Fixture: a quoted `"uses":` downloader with no edge (plan lens 2 M2/fx12).
# A parser that only matches bare unquoted keys is blind to it and passes.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - "uses": actions/download-artifact@v8
        "with":
          "name": vvterm-build
