# SPDX-License-Identifier: MIT
# Fixture: `node --eval='prog'` — the `--flag=value` long spelling
# of the inline program (issue #345, fold round 2 D3b);
# runtime-malicious (rc=0, current run last).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(node --eval='require("fs").appendFileSync(process.argv[1], "SOURCE_RUN_ID=${{ github.run_id }}\n")' "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
