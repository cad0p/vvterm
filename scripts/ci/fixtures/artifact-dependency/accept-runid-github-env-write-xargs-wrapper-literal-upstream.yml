# SPDX-License-Identifier: MIT
# Fixture (accept control): the real-tree witness with a wrapper
# (`name="$(echo "$raw" | env xargs)"`); the substitution-body
# site drops the `$`-word catch and the wrapper walk must not
# over-refuse it (issue #350f boundary pin).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          name="$(echo "$raw" | env xargs)"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
