# SPDX-License-Identifier: MIT
# Fixture: the same exported-alias `bash -c` carrier with `export n` on its
# own line, so no assignment or redirect on the carrier line reveals the
# write (issue #342, R4; fail-open at base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          m=1; n="$GITHUB_ENV"
          export n
          bash -c 'echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n"'
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
