# SPDX-License-Identifier: MIT
# Fixture: accept boundary / battery control: the runner path spelling only in a comment (read by the mention test; ignored by the artifact pass) plus a harmless scratch write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
      - name: flip
        run: |
          echo "hello" >> /tmp/scratch # mentions $RUNNER_TEMP/_runner_file_commands/set_env_1234
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
