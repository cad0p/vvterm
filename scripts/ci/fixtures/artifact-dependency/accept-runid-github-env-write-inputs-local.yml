# SPDX-License-Identifier: MIT
# Fixture: the real dispatch branch — a shell local traced to an
# `inputs.*` value, guarded non-empty; the value classifies cross-run and
# the exclusion stands (issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          set -euo pipefail
          CI_RUN_ID="${{ inputs.ci_run_id }}"
          [[ -n "$CI_RUN_ID" ]] || { echo "::error::mode=publish requires ci_run_id"; exit 1; }
          echo "SOURCE_RUN_ID=${CI_RUN_ID}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
