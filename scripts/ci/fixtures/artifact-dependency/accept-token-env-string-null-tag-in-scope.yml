# SPDX-License-Identifier: MIT
# Control: an in-scope `env:` value spelled `!!str null` is the string
# `null` at runtime — the string tag pins the scalar to text — so the token
# is non-empty and the case is GREEN. This is the env-path sibling of the
# direct `accept-token-direct-string-null.yml` control.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!str null
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
