# Fixture (#403, N16): a `cd` on the opening line of a `$()`/backtick whose
# delegation closes on a later bare physical line. In a real tree with a
# `sub/`, the substitution's `cd` makes bash resolve the relative
# `scripts/ci/shell-evil.sh` against `sub` and run the
# `sub/scripts/ci/shell-evil.sh` copy — the gate only ever proves the root
# copy — so this runtime-proven fail-open stays a named residual (#403, N16)
# and is pinned ACCEPT; a future code fix must update this case deliberately
# (the #350 boundary-accept idiom). Two spellings: `$()` and backtick.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          x=$(cd sub
          bash scripts/ci/shell-evil.sh)
      - run: |
          x=`cd sub
          bash scripts/ci/shell-evil.sh`
