# SPDX-License-Identifier: MIT
# Fixture: `ruby -e'prog'` — the inline program glued to the flag
# word (issue #345, fold round 2 D3b); runtime-malicious (rc=0,
# current run last).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(ruby -e'File.open(ARGV[0],"a"){|f| f.puts "SOURCE_RUN_ID=${{ github.run_id }}"}' "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
