# SPDX-License-Identifier: MIT
# Fixture: one unrelated extractable write plus a missed same-run write.
# A body-level count is launderable by the unrelated write; per-line
# accounting refuses the `tee` line (the measured BLOCKER; issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          echo "PR=1" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.run_id }}" | tee -a "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
