# SPDX-License-Identifier: MIT
# Fixture: a backslash-continuation chain that runs to the end of the run
# body still joins the target (bash joins a trailing backslash to EOF).
# The fold round 3 MAJOR-1 defect: `_joined_continuation_segments`
# discarded the whole partial join when the walk ran past the last body
# line, so the escape-aware predicate's newly-pending final line made a
# fold1-REFUSE shape head-ACCEPT (base ACCEPT, pre 3ae9f3fc ACCEPT, fold1
# 025e958b REFUSE, head 846a9392 ACCEPT, fixed REFUSE; runtime FLIP).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" | tee -a \
          "${arr[0]}" \ #x \
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
