# SPDX-License-Identifier: MIT
# Fixture: a static `env:` assignment that resolves to a recognized cross-run
# expression stays EXCLUDED and GREEN (lens-1 B3 control) — the resolution
# only turns the exclusion off for a value that is the current run.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
