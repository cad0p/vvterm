# SPDX-License-Identifier: MIT
# Fixture: `python3 -uc 'prog'` — the inline-program flag inside a
# short-option cluster (issue #345, fold round 2 D3b). The
# program is the next word because `c` ends the cluster; the
# trailing argv target is classified; runtime-malicious (rc=0,
# current run last).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(python3 -uc 'import sys; open(sys.argv[1],"a").write("SOURCE_RUN_ID=${{ github.run_id }}\n")' "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
