# SPDX-License-Identifier: MIT
# Fixture: the `<<<` here-string tokenizes as the operator pair `<<` +
# `<`, and the non-stdin fd-2 prefix leaves the pipeline feed intact;
# the consumer places the pair and its here-string token, so the walk
# resolves `xargs` and the carrier refuses (issue #350f fold round 3;
# base ACCEPT, runtime FLIP).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" |
          2<<< "pad" xargs -I{} cp payload {}
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
