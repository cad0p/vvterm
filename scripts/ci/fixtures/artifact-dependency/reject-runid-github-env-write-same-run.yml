# SPDX-License-Identifier: MIT
# Fixture: the core #342 flip. A preceding same-job step writes the
# env-resolved run-id name to `$GITHUB_ENV` with the CURRENT run's id, so
# at runtime the download is same-run and needs no cross-run exclusion —
# the gate must refuse rather than keep the exclusion (issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
