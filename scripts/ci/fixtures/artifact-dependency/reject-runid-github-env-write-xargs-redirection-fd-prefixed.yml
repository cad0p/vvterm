# SPDX-License-Identifier: MIT
# Fixture: the fd-prefixed redirect form (`2> /dev/null xargs …`, a
# non-stdin fd) resolves past the redirect (issue #350f fold round
# 1, F3; base ACCEPT, runtime FLIP). The adjacency rule keeps
# `sleep & > file` a separate command; `2<`/`3<` are the same
# non-stdin branch.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" |
          2> /dev/null xargs -I{} cp payload {}
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
