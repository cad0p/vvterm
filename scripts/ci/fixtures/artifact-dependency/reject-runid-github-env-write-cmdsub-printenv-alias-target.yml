# SPDX-License-Identifier: MIT
# Fixture: `n=$(printenv "${x}${y}")` then `>> "$n"` (issue #345,
# shape `h17-crossline-assembled-alias`). Runtime proof: the env file
# ends on the current run id.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          n=$(printenv "${x}${y}")
          w=$(printf '%s\n' "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
