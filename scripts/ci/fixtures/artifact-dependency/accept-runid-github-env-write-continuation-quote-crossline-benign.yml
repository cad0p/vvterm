# SPDX-License-Identifier: MIT
# Fixture: a cross-line single-quoted string with no env-file write (relative `cp`
# target): the benign control
# #350 item 12 fold round 1 accept pin; base ACCEPT -> folded ACCEPT, runtime
# cross-run.
name: accept-runid-github-env-write-continuation-quote-crossline-benign
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          echo 'a \
          b' ; cp payload \
          target
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
