# Fixture: a tag-then-anchor on a `uses:` value hides the escape from the old leading-quote check: the published parser resolves this to actions/download-artifact@v8, a real download with no needs: edge
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: !!str &a "actions/download-\x61rtifact@v8"
        with:
          name: vvterm-build
