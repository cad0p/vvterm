# SPDX-License-Identifier: MIT
# Fixture: the cross-model `$` + backslash-newline + `$'…'` spelling
# (issue #350d family F): the item-12 bash-faithful join drops the
# backslash-newline pair, the ANSI-C lexer closes the string, and the
# cp tail refuses. base ACCEPT -> head REFUSE, runtime FLIP.
name: reject-runid-github-env-write-ansic-cross-model-continuation
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          echo $\
          'a\'' ; cp payload "${arr[0]}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
