# Fixture: a backtick substitution that performs the env-file write. The
# whole backtick expression is one token, so the loose alias skip hid the
# write; a backtick RHS is not a pure env-file spelling, so the reference
# refusal fires (issue #342, BLOCKER-1).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          x=`echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"`
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
