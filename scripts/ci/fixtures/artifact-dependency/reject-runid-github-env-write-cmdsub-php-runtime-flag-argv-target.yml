# SPDX-License-Identifier: MIT
# Fixture: a recognized interpreter's inline-program flag assembled
# at runtime (`F=-r; php $F …`) is fail-closed: the flag word is
# not literal, so the invocation cannot be proven not to carry an
# inline program (issue #345, fold round 5); runtime-malicious.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          F=-r; w=$(php $F 'file_put_contents($argv[1], "SOURCE_RUN_ID=${{ github.run_id }}\n", FILE_APPEND);' -- "$(printenv "${x}${y}")" < /dev/null)
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
