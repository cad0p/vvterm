# SPDX-License-Identifier: MIT
# Fixture: a realistic multi-line `SHA="$( … )"` command substitution closes
# before the cross-run write, so the assignment after it is parent-shell and
# the value is still provably cross-run. The fold-5 depth tracker never
# closed and refused this legitimate workflow (issue #342, fold-6
# BLOCKER-1; non-vacuous, the download keeps the exclusion).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          SHA="$(
            git rev-parse HEAD
          )"
          SOURCE_RUN_ID="${{ github.event.workflow_run.id }}"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
