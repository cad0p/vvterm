# Fixture: `sh <<'EOF'` payload alias (issue #345, shape
# `k02-sh-quoted-alias`). Same closure as `k01` with `sh`.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          m=1
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          sh <<'EOF'
          n="$GITHUB_ENV"
          x=$(printf '%s\n' "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n")
          EOF
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
