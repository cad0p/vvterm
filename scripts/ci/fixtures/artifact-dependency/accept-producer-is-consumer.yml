# Fixture: producer == consumer is allowed (a job cannot `needs:` itself;
# steps within a job are ordered, plan M3).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
          path: build.tar.gz
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
