# SPDX-License-Identifier: MIT
# Fixture: a >64 raw run that walks into a heredoc payload (raw span over
# the analysis bound, bash span under) — the raw-arm-only shape
# #350e pins the predicate's raw arm; base ACCEPT -> shipped REFUSE, runtime cross-run.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          cat <<EOF \
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          a\
          EOF
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
