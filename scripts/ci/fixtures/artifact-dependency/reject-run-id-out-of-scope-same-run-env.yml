# Fixture: a same-run `run-id:` whose `env.NAME` is assigned only on ANOTHER
# job (round-5 R5-MINOR-1). The assignment is invisible to the consumer step,
# so the value proves nothing and the gate refuses. Pinned separately from the
# cross-run variant because the pre-fix verdict differed: the file-global index
# read this one as same-run and applied the rule (accidentally correct), while
# the cross-run variant silently excluded the download.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  helper:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.run_id }}
    steps:
      - run: echo hi
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
