# SPDX-License-Identifier: MIT
# Fixture: the assignment spelling of the cross-line substitution body
# (the former accept boundary pin; #350d closes it). Returns the #350
# item 1 boundary class to the reject set: base ACCEPT -> head REFUSE,
# runtime FLIP.
name: reject-runid-github-env-write-array-element-cmdsub-assign-continuation
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          w=$(cp payload \
          "${arr[0]}")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
