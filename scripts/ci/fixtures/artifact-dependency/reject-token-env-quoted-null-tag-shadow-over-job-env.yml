# Fixture: a QUOTED null spelling on a null-tagged step `env:` value
# (`!!null 'null'`) that shadows a non-empty job-level `GH_TOKEN` (round-8
# R8-BLOCKER-1). The step's own assignment is the most specific scope and it
# is the empty string at runtime, so the job literal is NOT visible and the
# cross-run exclusion cannot be proven — the `needs:` path is required. A
# gate that reads the quoted argument as a present token resolves the job
# literal instead and silently excludes the download (the round-7 rc=0). The
# bare-key twin is `reject-step-env-bare-null-shadow-over-job-env.yml` and the
# unquoted twin is `reject-step-env-null-tag-shadow-over-job-env.yml`.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: "ghp_job_literal"
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!null 'null'
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
