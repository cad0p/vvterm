# SPDX-License-Identifier: MIT
# Fixture: the single-quote split-string variant (`x'args'`
# decoded by GNU env to `xargs`) refuses through the same
# quote removal (issue #350f fold round 1, F1; base ACCEPT,
# runtime FLIP). The backslash variants (`x\args`, `\170args`)
# are rc-125 NOFLIP controls on GNU env.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" |
          env -S "x'args' -I{} cp payload {}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
