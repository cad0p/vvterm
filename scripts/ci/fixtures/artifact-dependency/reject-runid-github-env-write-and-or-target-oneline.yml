# SPDX-License-Identifier: MIT
# Fixture: an assignment reached only through `&&`/`||` is conditional. The
# `true && n="$GITHUB_ENV"` branch runs and the `||` fallback is dead code,
# so the redirect target at runtime is the env path; the old trace read the
# last indexed `n=/tmp/foo` and kept the exclusion (issue #342, R1; fail-open
# at base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          m=1; true && n="$GITHUB_ENV" || n=/tmp/foo
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
