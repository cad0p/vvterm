# SPDX-License-Identifier: MIT
# ACCEPT control: an interpreter's trailing argv word that is a
# literal non-env path stays accepted (issue #345, fold round 1
# F4) — the failing-closed boundary is unresolved/assembled/env
# targets, not a literal path argument; runtime-benign.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(python3 -c "print(1)" /tmp/data)
          z=$(perl -e 'print 1' /tmp/report.txt)
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
