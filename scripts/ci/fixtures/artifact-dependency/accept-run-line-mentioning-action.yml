# SPDX-License-Identifier: MIT
# Fixture: an artifact-action token that is data, not a step — a single-line
# `run:` body and an `env:` scalar value — is blanked before reconciliation,
# so it must not red (lens-1 m1 control). The download has its `needs:` edge.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    needs: build
    runs-on: ubuntu-latest
    env:
      GATE_REF: "actions/download-artifact@v8"
    steps:
      - run: echo "the gate downloads with actions/download-artifact@v8"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
