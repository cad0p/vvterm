# SPDX-License-Identifier: MIT
# Fixture: a "\uFEFF" escape is the BOM, which ECMAScript trims but Python str.strip() keeps — the one predicate divergence the trim set must mirror (family B cross-over)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: "\uFEFF"
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
