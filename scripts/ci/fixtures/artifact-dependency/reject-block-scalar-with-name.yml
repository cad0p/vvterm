# Fixture: a `with.name:` value written as a folded block scalar (lens-1 B2).
# The artifact name is what resolves the producer, so the header is refused.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: >-
            vvterm-build
