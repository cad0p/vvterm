# SPDX-License-Identifier: MIT
# Fixture: OVER-REFUSAL PIN, A6 shape `t20-dd-of` (issue #345).
# `dd of="${x}${y}"` writes the relative filename `GITHUB_ENV`,
# benign-as-stored (`oflag=append` is GNU-only); the A6 argv widening
# refuses fail-closed.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(printf '%s\n' SOURCE_RUN_ID=${{ github.run_id }} | dd of="${x}${y}" conv=notrunc oflag=append)
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
