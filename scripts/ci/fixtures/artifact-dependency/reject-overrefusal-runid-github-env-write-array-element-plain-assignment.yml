# SPDX-License-Identifier: MIT
# Fixture (over-refusal pin): a plain `arr[0]=…` assignment followed by the
# array-element argv target; the base name becomes relevant, so the
# out-of-statement assignment occurrence refuses. Benign at runtime,
# 0 real-tree witnesses (issue #350, item 1 over-refusal class).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          arr[0]=/tmp/benign
          cp payload "${arr[0]}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
