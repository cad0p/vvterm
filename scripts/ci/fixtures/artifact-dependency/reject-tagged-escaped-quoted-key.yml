# Fixture: a `!!str`-tagged, escaped quoted KEY on the `uses` line (round-4
# R4-MAJOR-1). GitHub resolves the key to `uses` and the value to
# `actions/download-artifact@v8`, so this is a real downloader; the quoted-key
# escape check must run after the string tag is stripped.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - !!str "u\u0073es": !!str "actions/download-\u0061rtifact@v8"
        with:
          name: vvterm-build
