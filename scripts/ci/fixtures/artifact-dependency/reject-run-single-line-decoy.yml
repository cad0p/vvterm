# Fixture: a single-line `run:` scalar containing a `needs: build` literal.
# The gate is structural, not a text matcher; the decoy must not satisfy the
# edge (CF-10).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
      - run: echo 'needs: build'
