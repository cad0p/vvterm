# SPDX-License-Identifier: MIT
# Fixture: an in-scope `env:` value spelled with a bare `!!int` tag and no
# argument — the tag resolves to the empty string at runtime (#334
# BLOCKER-1). A fix that only handles a quoted argument leaves this silent.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!int
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
