# SPDX-License-Identifier: MIT
# Fixture (over-refusal pin): the here-string spelling now resolves
# `xargs` and refuses on a mention-bearing upstream exactly like its
# already-refusing `2>`/`>`/`env`/plain siblings; `xargs` with no
# command argument runs the default `echo`, so the runtime cannot
# flip (issue #350f fold round 3; base ACCEPT, runtime NOFLIP, the
# family-wide benign-xargs-command class).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" |
          2<<< "pad" xargs
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
