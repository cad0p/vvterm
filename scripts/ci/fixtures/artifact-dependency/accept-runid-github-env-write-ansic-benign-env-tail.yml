# SPDX-License-Identifier: MIT
# Fixture (boundary accept): the benign ANSI-C removal witness. The
# old swallow made the base gate refuse the modelled `NAME=1` env
# write without an extractable payload; the escape-aware lexer accepts
# it. base REFUSE -> head ACCEPT, runtime NOFLIP.
name: accept-runid-github-env-write-ansic-benign-env-tail
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          echo $'a\'' ; printf 'NAME=1\n' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
