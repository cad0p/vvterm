# Fixture: legal YAML double-quoted escapes in non-semantic `name:` scalars
# (round-2 C-MINOR-2 accept control). Job and step names are labels; the
# escape refusal must not fire on values outside `uses`/`needs`/`with.*`.
# Psych parses every scalar below (café, ESC[0m, CR, NBSP, solidus).
jobs:
  build:
    name: "caf\u00e9"
    runs-on: ubuntu-latest
    steps:
      - name: "\x1b[0m setup"
        run: echo setup
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    name: "a\rb"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "a\/b \N"
        run: echo helper
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
