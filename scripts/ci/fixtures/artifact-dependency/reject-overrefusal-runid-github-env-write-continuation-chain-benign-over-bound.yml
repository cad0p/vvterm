# SPDX-License-Identifier: MIT
# Fixture: a benign 65-physical-line chain over the analysis bound
# #350e over-refuses a benign over-bound chain; base ACCEPT -> shipped REFUSE, runtime cross-run.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          cp payload \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          \
          target >/dev/null
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
