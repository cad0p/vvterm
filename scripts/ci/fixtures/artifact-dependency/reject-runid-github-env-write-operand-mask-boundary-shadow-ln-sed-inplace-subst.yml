# SPDX-License-Identifier: MIT
# Fixture: a leading `ln` must not shadow the later in-place `sed`; the base pass re-classifies sed's `$(echo x)` file operand.
# #350 items 13/14a/16 operand-mask fold; fold round 2 BLOCKER-1 shadow pin;
# base REFUSE -> fold REFUSE (regression pin).
name: reject-runid-github-env-write-operand-mask-boundary-shadow-ln-sed-inplace-subst
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          ln payload sed -i s/x/y/ "$(echo x)" /dev/null
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
