# SPDX-License-Identifier: MIT
# Fixture: `exec 3<>"$n"` opens the env file read-write on fd 3 and the
# next line writes the same-run payload through `>&3`. The `<>` operator was
# invisible to the redirect grammar, so the write passed (issue #342, R2;
# fail-open at base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          m=1; n="$GITHUB_ENV"
          exec 3<>"$n"
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >&3
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
