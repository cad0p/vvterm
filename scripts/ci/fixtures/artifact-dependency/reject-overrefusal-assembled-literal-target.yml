# Fixture: OVER-REFUSAL PIN, shape `h10-assembled-literal-pieces`
# (assembled-literal-target class, issue #345; see also `h20`).
# `${p1}${p2}` assembles the literal name `$GITHUB_ENV` as a
# relative filename, not the env-file path; the gate refuses
# fail-closed.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          p1='$GITHUB'
          p2='_ENV'
          echo "SOURCE_RUN_ID=11111111" >> "$GITHUB_ENV"
          x=$(printf '%s\n' SOURCE_RUN_ID=${{ github.run_id }} >> "${p1}${p2}")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
