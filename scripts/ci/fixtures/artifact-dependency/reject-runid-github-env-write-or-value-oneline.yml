# Fixture: the value trace has the same `||` hole. The first assignment
# succeeds, so `CI_RUN_ID=42424242` is the value written to `$GITHUB_ENV`
# while the gate classified the cross-run dead-code branch (issue #342, R1;
# fail-open at base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          CI_RUN_ID=42424242 || CI_RUN_ID="${{ github.event.workflow_run.id }}"
          echo "SOURCE_RUN_ID=${CI_RUN_ID}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
