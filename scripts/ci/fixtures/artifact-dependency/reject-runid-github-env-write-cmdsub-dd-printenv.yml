# SPDX-License-Identifier: MIT
# Fixture: `dd of="$(printenv "${x}${y}")"` argv target (issue
# #345, A6 shape `t23-dd-printenv`). Same argv target rule;
# runtime-malicious (rc=0, current run last).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(printf '%s\n' "SOURCE_RUN_ID=${{ github.run_id }}" | dd of="$(printenv "${x}${y}")" conv=notrunc)
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
