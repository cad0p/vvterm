# SPDX-License-Identifier: MIT
# Fixture: an unterminated multi-line quoted scalar (plan lens 2 B2/fx14).
# Psych folds the continuation lines into env.BANNER, so there is no job-level
# needs edge at all; a line-based parser that reads `needs: build` on the
# continuation line fabricates one and passes.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  debug-test:
    runs-on: ubuntu-latest
    env:
      BANNER: "line1
    needs: build
    line3"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
