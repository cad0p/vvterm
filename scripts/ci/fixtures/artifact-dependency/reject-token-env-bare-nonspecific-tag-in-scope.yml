# SPDX-License-Identifier: MIT
# Fixture: an in-scope `env:` value spelled with a bare `!` (the YAML
# non-specific tag) and no argument — the runtime value is the empty string,
# so the download cannot exclude (#334 BLOCKER-1). A fix that only handles
# `!!`-prefixed tags leaves this silent.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
