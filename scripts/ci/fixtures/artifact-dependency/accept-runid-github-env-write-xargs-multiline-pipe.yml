# SPDX-License-Identifier: MIT
# Fixture (accept control, boundary): a multi-line pipeline (trailing `|`)
# hides the upstream from the per-line carrier walk; joining a trailing
# `|` is a new mechanism deferred as a residual (issue #350, item 2
# boundary class).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf '%s\n' "$(printenv "${x}${y}")" |
          xargs -I{} cp payload {}
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
