# SPDX-License-Identifier: MIT
# Fixture: the python3 sibling (`F=-c; python3 $F …`) of the
# runtime-assembled interpreter inline-program flag; the flag word
# is not literal, so the invocation cannot be proven not to carry
# an inline program (issue #345, fold round 5); runtime-malicious.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          F=-c; w=$(python3 $F 'import sys; open(sys.argv[1],"a").write("SOURCE_RUN_ID=${{ github.run_id }}\n")' "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
