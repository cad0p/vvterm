# Fixture (#399 fold round 3, N11): the substitution's own shell has already
# `cd`ed when the candidate runs, so the tokenizer's whole-substitution word
# cannot clear it. Three spellings: `;`, `&&`, and the backtick form.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          x=$(cd sub; bash scripts/ci/shell-evil.sh)
      - run: |
          x=$(cd sub && bash scripts/ci/shell-evil.sh)
      - run: |
          x=`cd sub; bash scripts/ci/shell-evil.sh`
