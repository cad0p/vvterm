# Fixture: quoted keys decode everywhere — `"uses"`, `"with"`, `"name"` — and
# a quoted `"needs"` edge is honored (plan M2).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    "needs": build
    runs-on: ubuntu-latest
    steps:
      - "uses": actions/download-artifact@v8
        "with":
          "name": vvterm-build
