# Fixture: `run-id: ${{ github.run_id || env.FALLBACK }}` (recheck NEW-1/fx61).
# The expression always evaluates to the current run, so the rule applies.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.run_id || env.FALLBACK }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
