# SPDX-License-Identifier: MIT
# Fixture: an in-scope `env:` value spelled `!!null "~"` (round-8
# R8-BLOCKER-1). The double-quoted tilde decodes to the null spelling `~`,
# which the null tag coerces to the empty string, so the token cannot prove a
# cross-run handoff and the `needs:` path is required. A gate that compares
# the raw argument text against the null spellings reads `"~"` as content and
# silently excludes the download (the round-7 rc=0). The single-quoted twin is
# `reject-token-env-quoted-null-tag-in-scope.yml`.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!null "~"
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
