# SPDX-License-Identifier: MIT
# Fixture: a ref-less unmodelled `uses:` spelling (round-4 R4-NIT-3). The
# value carries an artifact token but no `-artifact@ref` shape, so only the
# reconciliation's `uses:`-key check can catch it; a parser that misses the
# step must refuse, never pass.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: download-artifact
