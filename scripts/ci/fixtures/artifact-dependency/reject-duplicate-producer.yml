# Fixture: two jobs upload the same literal name. upload-artifact v4 requires
# artifact names to be unique per run, so the producer is ambiguous — refuse
# with both sites named (plan §4.2).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
