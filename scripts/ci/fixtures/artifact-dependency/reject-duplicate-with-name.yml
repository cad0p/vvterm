# Fixture: a duplicate `with.name` (recheck fx51). GitHub's duplicate-key
# semantics are unverified, so the gate refuses with both sites named.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          name: other-artifact
