# SPDX-License-Identifier: MIT
# Fixture: `eval "$CMD"` with CMD from the job env (issue #345, A6 shape
# `t16-env-var-eval`). Fail-closed carrier operands: the gate refusal is
# independent; runtime-malicious only when the probe injects CMD, not as stored.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(eval "$CMD")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
