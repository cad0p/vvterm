# SPDX-License-Identifier: MIT
# Fixture: the carrier sits in a later `;;`-separated `case` branch
# (`x) cat;; y) xargs …`), whose pattern matches at runtime; the
# branch scan reads each branch's body like the branch-blind
# `if`/`do` bodies (issue #350f fold round 4; base ACCEPT, runtime
# FLIP).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" | case y in x) cat;; y) xargs -I{} cp payload {};; esac
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
