# SPDX-License-Identifier: MIT
# Fixture: `x=GITHUB_` / `y=ENV` + `$(printenv "${x}${y}")`
# redirect target (issue #345, shape `h16-crossline-assembled-
# printenv`). The assembled target resolves through the outer trace.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(printf '%s\n' "SOURCE_RUN_ID=${{ github.run_id }}" >> "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
