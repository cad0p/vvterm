# SPDX-License-Identifier: MIT
# Fixture: the same collision with the exact-case key LAST, so the Windows
# last-wins winner IS GH_TOKEN and the runtime value is the statically
# resolved one: the cross-run exclusion stands (issue #341, E8).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      gh_token: ""
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
