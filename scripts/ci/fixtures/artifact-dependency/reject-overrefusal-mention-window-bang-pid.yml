# SPDX-License-Identifier: MIT
# Fixture: with a background job `$!` is a non-empty pid, so the elided walk's refusal is a fail-closed over-refusal (fold lens-1 round 3 MINOR-2 cost)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          sleep 5 >/dev/null 2>&1 &
          eval "echo SOURCE_RUN_ID=${{ github.run_id }} >> \$GITHUB_$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!$!ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
