# SPDX-License-Identifier: MIT
# Fixture: the mention is an alias assignment; the sed target names an assembled path (issue #346.2)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
      v: SOURCE
      r: _RUN_
      i: ID
    steps:
      - name: probe
        run: |
          n="$GITHUB_ENV"
          w=$(sed -i '' "s/.*/$v$r$i=${{ github.run_id }}/" "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
