# SPDX-License-Identifier: MIT
# Fixture: the env path reaches the redirect target only through a mid-line
# reassignment (`m=1; n="$GITHUB_ENV"`). The trace must index every
# statement-position assignment, so `n`'s reaching assignment at the write is
# the env spelling — not the stale earlier `n=/tmp/foo` — and the same-run
# payload refuses (issue #342, F7).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          n=/tmp/foo
          m=1; n="$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
