# SPDX-License-Identifier: MIT
# Fixture: a "\n" escape is a line feed at runtime, so the token input is ECMAScript-empty and the download is same-run (silent pass). This pins the LF member of the hand-typed trim literal: dropping `\n` from it must red a case.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: "\n"
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
