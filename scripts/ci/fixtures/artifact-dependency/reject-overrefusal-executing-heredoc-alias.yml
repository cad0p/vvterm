# SPDX-License-Identifier: MIT
# Fixture: OVER-REFUSAL PIN, shape `h01-bash-heredoc-alias`
# (unquoted executing-heredoc class, issue #345; see also `h02b`,
# `q3`, versus the non-inherited-alias `k05`). The parent expands
# the substitution before the payload alias exists, so the runtime
# is benign; the gate refuses fail-closed.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          m=1
          echo "SOURCE_RUN_ID=11111111" >> "$GITHUB_ENV"
          bash <<EOF
          n="$GITHUB_ENV"
          x=$(printf '%s\n' "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n")
          EOF
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
