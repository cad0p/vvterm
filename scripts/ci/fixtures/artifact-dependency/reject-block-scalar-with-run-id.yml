# SPDX-License-Identifier: MIT
# Fixture: a block-scalar header as the value of `with.run-id` (round-2
# C-NIT-2). The header is not an inline run id and its body is blanked, so
# the gate must refuse the construct at the with-key line instead of
# reading `>-` as the run id.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: >-
            ${{ env.SOURCE_RUN_ID }}
