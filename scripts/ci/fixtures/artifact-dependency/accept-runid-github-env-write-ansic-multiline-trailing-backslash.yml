# SPDX-License-Identifier: MIT
# Fixture (boundary accept): the multi-line ANSI-C trailing-backslash
# shape. The `$'…'` region stays open across the physical line, so it
# is a different tokenizer state from item 17's same-line escaped
# quote and stays outside this fold: base ACCEPT -> head ACCEPT,
# runtime FLIP.
name: accept-runid-github-env-write-ansic-multiline-trailing-backslash
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          echo $'a\
          b' ; cp payload "${arr[0]}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
