# SPDX-License-Identifier: MIT
# Fixture: `source /dev/stdin <<'INNER'` defining only the alias,
# read after the payload (issue #345, shape
# `k04-source-quoted-alias-only`).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          m=1
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          source /dev/stdin <<'INNER'
          n="$GITHUB_ENV"
          INNER
          x=$(printf '%s\n' "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
