# SPDX-License-Identifier: MIT
# Fixture: a plain flow item containing a literal `"` must not swallow the next item. The published parser resolves `needs` to [build, a"b, a] while the subset decoder reads x61, so the fabricated x61->build edge must be refused — an item-boundary-only quote scan is what finds it (impl lens-1 MINOR 1)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  x61:
    needs: build
    runs-on: ubuntu-latest
  a:
    runs-on: ubuntu-latest
  consumer:
    runs-on: ubuntu-latest
    needs: [build, a"b, "\x61"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
