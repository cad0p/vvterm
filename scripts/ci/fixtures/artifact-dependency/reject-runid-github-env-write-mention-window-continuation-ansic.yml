# SPDX-License-Identifier: MIT
# Fixture: a `$` + backslash-newline + ANSI-C `'…'` spelling: bash removes the continuation before tokenisation, so the ` )` inside the ANSI-C string must not close the pad (fold round 6, A4)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          eval "echo SOURCE_RUN_ID=${{ github.run_id }} >> \$GITHUB_$( $\
          'a\' )AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA')ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
