# SPDX-License-Identifier: MIT
# Fixture: a `!!str`-tagged `uses` VALUE whose download is properly wired
# (round-4 R4-MAJOR-1 accept control). The string tag resolves to the same
# scalar GitHub reads, so the gate must parse the step and find its needs
# path — not blanket-refuse the tag.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: !!str actions/download-artifact@v8
        with:
          name: vvterm-build
