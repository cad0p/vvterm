# SPDX-License-Identifier: MIT
# Fixture: a one-word assignment whose RHS is a command substitution that
# performs the env-file write. The loose alias skip used to classify this as
# "the target-resolution mechanism" and pass; the RHS must be a pure
# env-file spelling, so the line falls through to the reference refusal
# (issue #342, BLOCKER-1).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          x=$(echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
