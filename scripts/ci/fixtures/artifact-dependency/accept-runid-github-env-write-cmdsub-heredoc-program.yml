# SPDX-License-Identifier: MIT
# Fixture (boundary accept): a heredoc inside a `$(…)` body; the shared
# `)`-depth walk does not consume the heredoc lexically (issue #350,
# item 11).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          eval "echo SOURCE_RUN_ID=${{ github.run_id }} >> \$GITHUB_$(: <<EOF
          )
          AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          EOF
          )ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
