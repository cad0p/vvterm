# SPDX-License-Identifier: MIT
# Fixture (accept control, boundary): the target word spans two physical
# lines with no backslash (a literal newline inside the double-quoted
# word), so neither the per-line walk nor the continuation pre-pass sees
# it. Joining a word across a literal newline is a new mechanism deferred
# as a residual (issue #350, item 1 boundary class; fold round 1 MAJOR-3:
# base ACCEPT, shipped ACCEPT, runtime FLIP).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          cp payload "${arr[
          0]}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
