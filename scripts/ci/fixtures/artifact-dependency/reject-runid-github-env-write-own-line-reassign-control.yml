# SPDX-License-Identifier: MIT
# Fixture (control): the same target hijack with the reassignment on its
# own line — refused before the multi-assignment index fix too. Pins that
# the (line, column) trace did not change the already-covered shape
# (issue #342, F7).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          n=/tmp/foo
          n="$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
