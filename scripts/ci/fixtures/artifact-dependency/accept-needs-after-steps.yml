# SPDX-License-Identifier: MIT
# Fixture: `needs:` after `steps:` is still a real edge (issue #316 acceptance).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
    needs: build
