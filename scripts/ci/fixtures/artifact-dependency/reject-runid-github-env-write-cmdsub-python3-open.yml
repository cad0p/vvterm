# SPDX-License-Identifier: MIT
# Fixture: `python3 -c "...open(os.environ[...]..."` (issue #345,
# A6 shape `t17-python3-open`). Interpreter programs are recognized
# by basename; runtime-malicious (rc=0, current run last).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(python3 -c "import os; open(os.environ['${x}${y}'],'a').write('SOURCE_RUN_ID=${{ github.run_id }}\n')")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
