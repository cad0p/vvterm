# SPDX-License-Identifier: MIT
# Fixture: an in-scope `env:` value spelled `!!null "\x6eull"` (round-8
# R8-BLOCKER-1). The hex escape decodes to `null`, the null tag coerces the
# decoded scalar to the empty string, and the token cannot prove a cross-run
# handoff — the `needs:` path is required. A gate that decodes the argument
# with a subset escape reader (the gate's shared reader leaves `\x` as
# literal text) never sees a null spelling and silently excludes the download
# (the round-7 rc=0). The non-null quoted control is
# `accept-token-env-quoted-nonnull-null-tag-in-scope.yml`.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!null "\x6eull"
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
