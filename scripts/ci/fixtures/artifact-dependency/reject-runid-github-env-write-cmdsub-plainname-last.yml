# SPDX-License-Identifier: MIT
# Fixture: the unquoted-subshell hidden write through a plain
# line-start alias (issue #345, shape `a11-unquoted-subshell-
# plainname-last` = battery f02). Same closure as `a8`, spelled
# with a plain name.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          m=1; n="$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          x=$(printf '%s\n' "SOURCE_RUN_ID=42424242" >> "$n")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
