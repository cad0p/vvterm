# Fixture: a "\u0020" escape is a space at runtime (4-digit hex path) — the same silent pass as the 2-digit form
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: "\u0020"
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
