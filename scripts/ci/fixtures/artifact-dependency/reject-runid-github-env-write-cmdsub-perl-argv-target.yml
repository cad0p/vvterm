# SPDX-License-Identifier: MIT
# Fixture: `perl -e` writes `$ARGV[0]`, passed as a
# `$(printenv ...)` argv word (issue #345, fold round 1 F4);
# runtime-malicious (rc=0, current run last).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(perl -e 'open(F,">>",$ARGV[0]); print F "SOURCE_RUN_ID=${{ github.run_id }}\n"' "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
