# SPDX-License-Identifier: MIT
# Fixture: a valid long option the table does not list
# (`env --ignore-environment xargs …`) refuses fail-closed with an
# `xargs` word unplaced (issue #350f fold round 1, lens-3 M5; base
# ACCEPT, runtime FLIP with GNU env 9.12).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" |
          env --ignore-environment xargs -I{} cp payload {}
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
