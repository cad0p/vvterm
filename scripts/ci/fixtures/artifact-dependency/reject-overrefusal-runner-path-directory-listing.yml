# SPDX-License-Identifier: MIT
# Fixture: NOFLIP cost — over-refusal boundary: listing the runner command directory (the cost of the directory widening)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
      - name: flip
        run: |
          ls "$RUNNER_TEMP/_runner_file_commands/" > /tmp/files.txt
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
