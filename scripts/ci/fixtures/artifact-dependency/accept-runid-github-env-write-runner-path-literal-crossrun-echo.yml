# SPDX-License-Identifier: MIT
# Fixture: a provably CROSS-RUN seed through the runner path (echo form); base ACCEPT -> v3 ACCEPT.
# The §5 counterfactual: the payload classifier must pass a cross-run value (symmetric with $GITHUB_ENV).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: seed-cross-run
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> /home/runner/work/_temp/_runner_file_commands/set_env_*
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
