# SPDX-License-Identifier: MIT
# Fixture: `n=/tmp/foo &` runs in a subshell, so the parent `n` keeps the
# `$GITHUB_ENV` value and the write lands in the env file while the
# dead-code trace read `other` (issue #342, F2; fail-open at base
# `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          m=1; n="$GITHUB_ENV"
          n=/tmp/foo &
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
