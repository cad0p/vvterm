# SPDX-License-Identifier: MIT
# Fixture: `tee` writes the env file without a redirect. The verb is
# outside the extractor's grammar, so per-line accounting refuses (issue
# #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          echo "SOURCE_RUN_ID=${{ github.run_id }}" | tee -a "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
