# SPDX-License-Identifier: MIT
# Fixture: the carrier sits in the *condition* of an `if` compound
# the pipe feeds (the `then` body position was closed in fold round
# 1); the condition command reads the pipeline's stdin, so the
# carrier refuses (issue #350f fold round 4; base ACCEPT, runtime
# FLIP).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" | if xargs -I{} cp payload {}; then :; fi
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
