# SPDX-License-Identifier: MIT
# Fixture: a `github-token:` resolved through an `env:` assignment on the
# CONSUMER's own job (round-5 R5-MINOR-1 positive control). The assignment is
# in the step's env chain and non-empty, so the cross-run exclusion stands and
# the case is GREEN — a blanket "ignore every env assignment" fix would red it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: "ghp_consumer_job_scope"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
