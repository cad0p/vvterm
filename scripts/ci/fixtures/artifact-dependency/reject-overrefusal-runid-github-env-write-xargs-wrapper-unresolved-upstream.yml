# SPDX-License-Identifier: MIT
# Fixture (over-refusal pin): an upstream word (`$RUNNER_TEMP`) the
# extractor cannot resolve behind a wrapper; benign at runtime, but
# the per-line carrier catch refuses rather than proving the word
# cannot carry the operand (issue #350f over-refusal class; base
# ACCEPT since the wrapper spelling was not resolved at base).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$RUNNER_TEMP/build.log" | env xargs -I{} touch {}
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
