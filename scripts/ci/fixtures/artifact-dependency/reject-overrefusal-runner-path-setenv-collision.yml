# Fixture: NOFLIP cost — over-refusal boundary: a benign scratch file whose name merely contains the case-insensitive `SET_ENV_` spelling (collision class; no runtime flip)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
      - name: flip
        run: |
          echo "notes" >> /tmp/RESET_ENV_NOTES
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
