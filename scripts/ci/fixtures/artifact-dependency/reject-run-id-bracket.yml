# Fixture: bracket-syntax `github['run_id']` is still the current run
# (recheck NEW-1). The expression is normalized before matching, so this
# cannot hide behind a spelling change.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github['run_id'] }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
