# SPDX-License-Identifier: MIT
# Fixture: `github-token: ${{ secrets.GITHUB_TOKEN && '' }}` (round-5
# R5-MINOR-2). An expression carrying an operator can evaluate to the empty
# string, so it is not provably non-empty and the cross-run exclusion must not
# apply.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN && '' }}
