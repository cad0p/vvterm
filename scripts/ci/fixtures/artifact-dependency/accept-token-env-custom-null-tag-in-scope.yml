# SPDX-License-Identifier: MIT
# Control: an in-scope `env:` value spelled `!foo null` resolves to the
# string `null` at runtime (an application tag does not coerce its argument
# to a YAML null), so the token is non-empty and the case is GREEN. The null
# tag is the one that coerces a null spelling to the empty string.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !foo null
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
