# SPDX-License-Identifier: MIT
# Fixture: a same-run payload written to `"$GITHUB_ENV_X"` — a DIFFERENT
# variable name, and the runner publishes the env-file path only as
# `GITHUB_ENV` / `%GITHUB_ENV%`, so the redirect cannot reach the env file
# and the cross-run exclusion stands. The env-file spelling is narrowed to
# the exact name (plus identifier characters is a different variable),
# issue #342, F9.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV_X"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
