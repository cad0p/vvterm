# SPDX-License-Identifier: MIT
# Fixture: a carrier command string that writes a traced name through a
# bare-name mechanism operand (`eval 'read CI_RUN_ID'`) is invisible
# to the carrier predicates; the detection-completeness rule refuses
# the name inside the string (issue #342, F3/BLOCKER-2; fail-open at
# base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          CI_RUN_ID="${{ github.event.workflow_run.id }}"
          eval 'read CI_RUN_ID' <<< 42424242
          echo "SOURCE_RUN_ID=$CI_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
