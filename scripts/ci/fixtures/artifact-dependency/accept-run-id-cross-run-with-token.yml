# SPDX-License-Identifier: MIT
# Fixture: a recognized cross-run `run-id:` carrying a non-empty
# `github-token:` is the one exclusion (round-2 C-MAJOR-1 control, the real
# ios-adhoc-pr.yml shape); no same-file producer is needed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
