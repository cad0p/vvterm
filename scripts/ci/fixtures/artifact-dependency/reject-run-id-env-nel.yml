# SPDX-License-Identifier: MIT
# Fixture: the second predicate site. A job-level env value decodes the
# YAML \\N escape to U+0085, so the resolved run-id is <NEL>123 and
# parseInt yields NaN: the static-assignment refusal must fire, not the
# cross-run exclusion (issue #338).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "\N123"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
