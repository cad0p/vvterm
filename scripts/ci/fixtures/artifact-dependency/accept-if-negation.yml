# SPDX-License-Identifier: MIT
# Fixture: `!`-leading conditions (round-4 R4-MAJOR-1 control). A blanket
# `!` refusal would red a legal negation; the tag-aware readers must stay
# scoped to the string tag and leave these values alone. The download itself
# has its needs path.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    needs: build
    if: !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        if: ${{ !cancelled() }}
        with:
          name: vvterm-build
      - name: quoted negation
        if: "!cancelled()"
        run: echo hi
