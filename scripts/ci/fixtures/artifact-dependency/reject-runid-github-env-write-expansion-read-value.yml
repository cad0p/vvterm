# SPDX-License-Identifier: MIT
# Fixture: an accepted-cost shape: a traced name read outside a modelled
# position (`echo "$CI_RUN_ID"`) refuses under the
# detection-completeness rule. Not a runtime fail-open — the write
# value is still cross-run — this pins the fail-closed cost (issue
# #342, F3).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          CI_RUN_ID="${{ github.event.workflow_run.id }}"
          echo "$CI_RUN_ID"
          echo "SOURCE_RUN_ID=$CI_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
