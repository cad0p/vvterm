# SPDX-License-Identifier: MIT
# Fixture: the pointed control for scope precedence (round-6 R6-MINOR-1): the
# job assigns a non-empty `GH_TOKEN` and the step overrides it with the empty
# string. The most specific scope wins, so the token is empty at runtime and
# the cross-run exclusion must not apply — the `needs:` path is required. A
# fix that picks the wrong scope (job over step) would accept this.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: "ghp_job_literal"
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: ""
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
