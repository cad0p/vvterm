# SPDX-License-Identifier: MIT
# Fixture: `>|word` is bash's noclobber-override FILE redirect (the `|` is
# not a pipe), so the mid-line alias `n="$GITHUB_ENV"` target is the env
# file. The old tokenizer split the segment at `|` and never saw the
# redirect target, so the same-run write passed (issue #342, BLOCKER-1;
# measured fail-open at base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          m=1; n="$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >|"$n"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
