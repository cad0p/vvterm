# SPDX-License-Identifier: MIT
# Fixture: the written value reads the same-run local at the write, then the
# local is reassigned to a cross-run literal after the write on the same line
# (`… >> "$GITHUB_ENV"; CI_RUN_ID=1234`). A line-only trace would take the
# trailing literal and waive the write; the (line, column) trace must treat
# the trailing reassignment as after-write and refuse (issue #342, F8).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          CI_RUN_ID="${{ github.run_id }}"
          echo "SOURCE_RUN_ID=${CI_RUN_ID}" >> "$GITHUB_ENV"; CI_RUN_ID=1234
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
