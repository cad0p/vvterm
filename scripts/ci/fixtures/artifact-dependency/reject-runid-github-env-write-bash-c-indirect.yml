# SPDX-License-Identifier: MIT
# Fixture: the write is performed by a child shell through positional
# indirection (`"${!1}"`), so no redirect target the extractor can
# resolve exists — the mention is accounted and refused (issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: blank the run id through a bash -c argv
        run: bash -c 'echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "${!1}"' _ "GITHUB_""ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
