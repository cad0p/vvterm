# Fixture: the verbatim long-form null tag with an explicit empty-string
# argument (`!<tag:yaml.org,2002:null> ""`), resolved through an in-scope
# `env:` assignment (round-7 R7-BLOCKER-1). Like `!!null` above, the tag is
# the empty string at runtime, so the token cannot prove a cross-run handoff
# and the `needs:` path is required. A gate that only special-cases the short
# `!!null` spelling silently excludes the download (the pre-fold rc=0).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !<tag:yaml.org,2002:null> ""
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
