# SPDX-License-Identifier: MIT
# Fixture: the positive control for the tagged block-scalar refusal (round-8
# R8-BLOCKER-1). `GH_TOKEN: !!null |` with a NON-EMPTY body: the body is the
# runtime value (`ghp_x`), the tag does not clear it, so the token is provably
# non-empty, the cross-run exclusion stands and the case is GREEN. A fix that
# reads only the tagged header, or that treats every null-tagged block scalar
# as empty, would red this control.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!null |
            ghp_x
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
