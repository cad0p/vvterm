# Fixture: a `needs:` block sequence at the key's own indent is valid YAML
# and a real edge (plan lens 2 m1: a fixed-column parser false-reds it).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    needs:
    - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
