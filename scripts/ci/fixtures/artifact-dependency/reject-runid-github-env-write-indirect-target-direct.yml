# SPDX-License-Identifier: MIT
# Fixture (control): the same `${!x}` indirection used directly as the
# redirect target. This shape is already refused at the base revision (the
# `unknown` target kind); the fixture pins that the assigned-name resolution
# added for BLOCKER-2 does not flip the direct-indirect shape green
# (issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          x=GITHUB_ENV
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "${!x}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
