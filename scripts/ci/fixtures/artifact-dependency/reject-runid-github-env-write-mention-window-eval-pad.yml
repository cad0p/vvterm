# Fixture: the #347 padded window: a 63-character job-local pad between the mention halves
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          PADDINGPADDINGPADDINGPADDINGPADDINGPADDINGPADDINGPADDINGPADDING=_
          eval "echo SOURCE_RUN_ID=${{ github.run_id }} >> \$GITHUB${PADDINGPADDINGPADDINGPADDINGPADDINGPADDINGPADDINGPADDINGPADDING}ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
