# SPDX-License-Identifier: MIT
# Fixture: a whitespace-only `github-token:` with a recognized cross-run
# `run-id:` (round-4 R4-MINOR-1). `@actions/core` trims the input and
# actions/download-artifact honors `run-id:` only when the token is set, so
# this is a same-run download and its `needs:` path is required.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: "   "
