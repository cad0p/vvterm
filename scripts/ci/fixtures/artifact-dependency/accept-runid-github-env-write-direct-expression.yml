# SPDX-License-Identifier: MIT
# Fixture: a DIRECT cross-run expression cannot be affected by an
# env-file write, so the rule is a no-op even with a same-run mention
# present (the gate control; issue #342).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
