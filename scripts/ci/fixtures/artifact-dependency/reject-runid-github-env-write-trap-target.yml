# SPDX-License-Identifier: MIT
# Fixture: `trap` stores a command string that writes the same-run payload
# to `"$n"` at EXIT. No redirect token exists on the trap line itself, so
# the extractor never saw the write and the exclusion was kept (issue #342,
# R4; fail-open at base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          m=1; n="$GITHUB_ENV"
          trap 'echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n"' EXIT
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
