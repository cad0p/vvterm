# SPDX-License-Identifier: MIT
# Fixture: `node -pe 'prog'` runs the next word (the trailing
# `-p`/`-e` cluster; every other cluster and attached spelling is
# a runtime `bad option`) (issue #345, fold round 3 F1).
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          x=GITHUB_
          y=ENV
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          w=$(node -pe 'require("fs").appendFileSync(process.argv[1], "SOURCE_RUN_ID=${{ github.run_id }}\n"); 1' "$(printenv "${x}${y}")")
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
