# SPDX-License-Identifier: MIT
# Fixture: `eval` runs a command string that writes the same-run payload to
# `"$n"`; the string is opaque to the statement-position assignment model,
# so the write passed (issue #342, R4; fail-open at base `81673bd5`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run context
        run: |
          m=1; n="$GITHUB_ENV"
          eval 'echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$n"'
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
