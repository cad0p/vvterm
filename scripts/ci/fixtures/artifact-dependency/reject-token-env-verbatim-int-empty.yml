# SPDX-License-Identifier: MIT
# Fixture: an in-scope `env:` value spelled with the verbatim non-string tag
# `!<tag:yaml.org,2002:int>` and an empty argument (#334 BLOCKER-1). A fix
# written as `tag.startswith("!!")` leaves this silent, so it is the
# `!!`-only partial fix's falsifier.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !<tag:yaml.org,2002:int> ""
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
