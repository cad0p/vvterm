# SPDX-License-Identifier: MIT
# Fixture: a `${…}` pad whose interior backtick region carries a `}`: the braced scanner treated the inner `}` as the expansion's close, so the pad was elided early and the halves stayed apart (fold round 6, A2)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          eval "echo SOURCE_RUN_ID=${{ github.run_id }} >> \$GITHUB_${x:-`: }AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA`}ENV"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
