# SPDX-License-Identifier: MIT
# Fixture: a mixed numeric/alternate-delimiter range whose second term is the double-quoted-source two-raw-backslash `\\%…%` spelling (`1,\\%zzz%w`) writes the env file (fold round 5, Y9/Z2)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
      v: SOURCE
      r: _RUN_
      i: ID
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf '%s%s%s=%s\n' "$v" "$r" "$i" "${{ github.run_id }}" >> payload
          sed -n "1,\\%zzz%w "$(printenv "${x}${y}")"" payload
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
