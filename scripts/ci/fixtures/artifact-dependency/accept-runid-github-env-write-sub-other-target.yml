# SPDX-License-Identifier: MIT
# Fixture: the `other`-target acceptance inside a substitution body
# (issue #345). A `$GITHUB_ENV` cross-run mention arms the run-id
# rule; the body's redirect classifies `other` (`/tmp/out`), so the
# gate accepts and keeps the cross-run exclusion. Falsifier:
# `if kind == "unknown"` -> `if kind in ("unknown", "other")` in
# the gate reds this fixture.
name: probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          x=$(printf '%s\n' hi >> /tmp/out)
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
