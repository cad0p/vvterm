# Fixture: a template-name download is unresolvable — refuse it even though a
# literal producer exists (plan M1/m5). Templated uploads are fine; templated
# downloads cannot be resolved to a producer.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build-${{ matrix.shard.name }}
