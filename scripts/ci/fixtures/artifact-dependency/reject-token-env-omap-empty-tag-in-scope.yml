# SPDX-License-Identifier: MIT
# Fixture: an in-scope `env:` value spelled `!!omap ""` — a non-scalar core
# tag whose empty argument resolves to the empty string (#334 BLOCKER-1). A
# fix that special-cases only the scalar core tags leaves this silent.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!omap ""
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
