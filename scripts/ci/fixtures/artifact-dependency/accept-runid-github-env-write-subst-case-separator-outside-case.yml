# SPDX-License-Identifier: MIT
# Fixture (boundary accept): the `;;` separator's one non-additive cell —
# a malformed `;;` outside `case`. The base segment walk ran past the
# separator and seeded `arr` from the orphan `"${arr[0]}"` operand, so
# the base gate REFUSEd at the `read` line; the head split ends `cp`'s
# segment at `payload`, so `arr` stays unseeded and the gate ACCEPTs.
# bash rejects `;;` outside `case` at parse time (exit 2; nothing
# executes), so the removal is safe. base REFUSE -> head ACCEPT,
# runtime NOFLIP.
name: accept-runid-github-env-write-subst-case-separator-outside-case
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" > pf
          read -a arr < pf
          cp payload ;; "${arr[0]}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
