# SPDX-License-Identifier: MIT
# Fixture: the positive control for the anchored null-tag arguments (round-8
# R8-BLOCKER-2). `GH_TOKEN: !!null &a ghp_x` is the literal string `ghp_x` at
# runtime — the anchor is a node property and the tag only coerces a null
# spelling — so the token is provably non-empty, the cross-run exclusion
# stands and the case is GREEN. A fix that strips the anchor but then treats
# the anchored value as empty (or refuses it) would red this control.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!null &a ghp_x
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
