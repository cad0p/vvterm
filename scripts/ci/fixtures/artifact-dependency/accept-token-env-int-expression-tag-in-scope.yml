# SPDX-License-Identifier: MIT
# Control: an in-scope `env:` value spelled `!!int "${{ github.token }}"`
# resolves to an expression the gate can prove non-empty (`github.token`), so
# the cross-run exclusion stands and the case is GREEN. A fix that resolves
# the tag argument but then refuses every expression would red this control.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!int "${{ github.token }}"
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
