# SPDX-License-Identifier: MIT
# Fixture: an in-scope `env:` value spelled `!foo ""` — an application tag
# with an empty resolved argument (#334 BLOCKER-1). A fix written as
# `tag.startswith("!!")` leaves this silent.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !foo ""
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
