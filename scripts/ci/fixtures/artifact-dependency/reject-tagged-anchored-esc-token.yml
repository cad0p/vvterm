# SPDX-License-Identifier: MIT
# Fixture: a tag-then-anchor on a with.github-token: value hides the escape: the runtime token is a single space, JS-empty, so the cross-run exclusion is unjustified
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: !!str &a "\x20"
