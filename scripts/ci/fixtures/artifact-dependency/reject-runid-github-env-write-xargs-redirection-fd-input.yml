# SPDX-License-Identifier: MIT
# Fixture (lens NIT): a non-stdin fd-input redirect (`2< /dev/null
# xargs …`) leaves the pipeline's stdin intact, so the walk consumes
# it like the `2>` branch (issue #350f fold round 2; base ACCEPT,
# runtime FLIP; `3<` and `2<&0` share the branch).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload
          printf '%s\n' "$(printenv "${x}${y}")" |
          2< /dev/null xargs -I{} cp payload {}
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
