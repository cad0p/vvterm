# SPDX-License-Identifier: MIT
# Fixture: the tokenizer joins the quoted concatenation `"$GITHUB_ENV"x`
# into one word (`$GITHUB_ENVx`), so the redirect target is read as the
# identifier-suffix spelling and refuses. The genuine risk is the
# unquoted/braced NAME `$GITHUB_ENVx` / `${GITHUB_ENVx}`: a preceding step
# can publish the env path under that name and the runner merges it before
# the flip. In bash the quoted concatenation expands to `<env-path>x` — a
# different file — and the measured runtime env file is unchanged, so this
# fixture pins a benign fail-closed false red of the tokenizer, not a
# runtime exploit (issue #342, BLOCKER-4 / MINOR-1; measured fail-open at
# base `81673bd5` and at fold-2 `d5429892`).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - name: resolve
        run: |
          echo "GITHUB_ENVx=$GITHUB_ENV" >> "$GITHUB_ENV"
      - name: flip
        run: |
          echo "SOURCE_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"x
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
