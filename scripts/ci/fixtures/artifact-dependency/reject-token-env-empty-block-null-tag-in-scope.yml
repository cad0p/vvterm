# SPDX-License-Identifier: MIT
# Fixture: an in-scope `env:` value spelled `!!null |` with an EMPTY body
# (round-8 R8-BLOCKER-1). The tag does not change a block scalar: the body is
# the runtime value, and an empty body is the empty string, so the token
# cannot prove a cross-run handoff and the `needs:` path is required. A gate
# that reads the tagged header text as the value silently excludes the
# download (the round-7 rc=0). The non-empty control is
# `accept-token-env-null-tag-nonempty-block-in-scope.yml` and the untagged
# twin is `reject-token-env-empty-block-scalar-in-scope.yml`.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        env:
          GH_TOKEN: !!null |
        with:
          name: vvterm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GH_TOKEN }}
