# Fixture: `artifact-ids:` is named explicitly and refused (plan m5), even
# though it could in principle select one artifact; the gate cannot resolve a
# literal name from an id.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 12345
