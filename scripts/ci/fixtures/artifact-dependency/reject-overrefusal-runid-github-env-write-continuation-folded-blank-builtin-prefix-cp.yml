# SPDX-License-Identifier: MIT
# Fixture: a folded scalar with a `builtin`-prefixed verb and a blank after the backslash (the guard-kept blank class)
# #350 item 12 over-refusal; base ACCEPT -> shipped REFUSE, runtime cross-run.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
  consumer:
    runs-on: ubuntu-latest
    env:
      x: GITHUB_
      y: ENV
    steps:
      - name: probe
        run: >
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"; printf 'SOURCE_RUN_ID=%s\n' "${{ github.run_id }}" > payload; printf '%s\n' "$(printenv "${x}${y}")" > pf; read -a arr < pf;
          builtin cp payload \

          "${arr[0]}"
      - uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
