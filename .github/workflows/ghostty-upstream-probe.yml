# Ghostty upstream probe — weekly probe of upstream ghostty main (issue #127, M4).
#
# Every Monday 06:00 UTC (or on workflow_dispatch) the `probe` job:
#   1. installs zig 0.16.0 (cached),
#   2. resolves the latest upstream ghostty main SHA,
#   3. no-ops when the vendored build is already on that SHA (unless
#      force_rebuild),
#   4. rebuilds Vendor/libghostty via scripts/build.sh (custom-io.patch,
#      writes Vendor/libghostty/VERSION),
#   5. pre-validates with the FULL VVTermTests unit suite (incl. the
#      behavioral probe tests GhosttyCustomIOProbeTests +
#      GhosttyOSCColorQueryTests) against the NEW binaries,
#   6. appends the rebuilt artifacts + regenerated terminfo + updated
#      scripts/patches/ghostty/BASE to the single EVERGREEN bump branch
#      chore/ghostty-upstream-bump (constant name, no sha suffix — renaming
#      would break the PR link) and updates its PR — created with the
#      vvterm-ghostty-bump GitHub App token, with auto-merge (re)enabled.
#      Every movement appends ONE API-verified commit to the same branch
#      (fast-forward PATCH) and edits the PR title/body to the new sha;
#      there is NEVER a second PR and never a close.
# Any failure before PR creation files an ALARM issue (deduped by title,
# label `ghostty-patch`). Failures at/after PR creation are NOT probe
# alarms — the evergreen PR + the canary issue own the outcome.
#
# The canary issue is the alarm/lead: open = the bump has not landed, and
# it auto-closes via the squash-subject closing keyword when the PR
# auto-merges. A red bump self-heals by the next run appending a newer
# build to the same PR.
#
# Why a GitHub App token for the PR (no PAT, no human, no bypass actor):
#   - A PR created with GITHUB_TOKEN runs its pull_request CI in an
#     approval-required state (one human click per bump) — rejected.
#   - A PR created with a GitHub App installation token is a first-class
#     actor: its pull_request workflows run AUTOMATICALLY, exactly like a
#     human PR. No approval, no click, no PAT.
#   - No direct pushes, no ruleset bypass actors: the bump goes through a
#     normal PR and the ruleset's required checks (build, unit-tests,
#     ui-tests-shard-0..3) are the merge gate via auto-merge.
#   - The app is scoped to this repo only (installed on cad0p/vvterm,
#     Contents + Pull requests read/write). Setup: see
#     scripts/patches/ghostty/README.md.
#
# Constraints honored:
#   - Single macOS job (probe): fits the repo's 5-concurrent-macOS-job CI
#     cap with zero queueing. NOT wired into vvterm-pr-ci.yml;
#     scheduled/dispatch-only.
#   - See scripts/patches/ghostty/README.md for the rebase runbook.

name: Ghostty Upstream Probe

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild + re-probe even when upstream SHA equals the vendored VERSION'
        type: boolean
        default: false
      create_bump_pr:
        description: 'Open (or reuse) a bump PR when the probe passes'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # DerivedData/SPM cache save + failure artifact upload
  issues: write    # alarm issues + the canary issue
  pull-requests: read  # PR reads via the default token; probe PR/ref operations use the app token (the job that needed PR write is gone)

concurrency:
  group: ghostty-upstream-probe
  cancel-in-progress: false
  # A second run (manual dispatch during a Monday run, or a Monday run
  # during a manual dispatch) queues instead of killing a mid-probe run.
  # When it eventually runs, the probe finds the evergreen bump branch
  # already pushed and fast-forwards it (no duplicates, no false alarms).

jobs:
  probe:
    runs-on: xcode-27
    # From-scratch ghostty ReleaseFast build + xcodebuild on a shared runner;
    # keep the budget generous so a slow runner never fakes an alarm week.
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    outputs:
      bump_pr_number: ${{ steps.bump-pr.outputs.bump_pr_number }}
      resolved_sha: ${{ steps.resolve-sha.outputs.resolved_sha }}

    steps:
      # Failing-step tracker: each fallible step records its own name in
      # $RUNNER_TEMP/ghostty-probe-step BEFORE doing work, so the alarm
      # step (if: failure()) can report which step failed in the title.
      - name: Track failing step (checkout)
        run: echo "checkout" > "$RUNNER_TEMP/ghostty-probe-step"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # No persisted GITHUB_TOKEN credentials: checkout writes an
          # http.<url>.extraheader into .git/config (and the runner may
          # inject a second one via GIT_CONFIG_* env). http.<url>.extraheader
          # is MULTI-VALUED, so a later push with the app token sends TWO
          # Authorization headers → HTTP 400 'Duplicate header'. With
          # persist-credentials: false, the app token in the push URL is the
          # single auth source (canonical fix — actions/checkout docs,
          # github/gh-aw#40280).

      - name: Track failing step (prepare xcode build)
        run: echo "prepare-xcode-build" > "$RUNNER_TEMP/ghostty-probe-step"

      - name: Prepare Xcode build (mtimes, caches, Metal toolchain)
        # Same composite as PR CI: restores source mtimes (fetch-depth 0),
        # caches DerivedData + SPM, clears stale PCMs, and downloads the
        # Metal toolchain the xcode-27 preview image lacks. Cache is
        # namespaced to this workflow (xcode27-probe-deriveddata-) so the
        # probe never reuses PR CI DerivedData built against older binaries.
        uses: ./.github/actions/prepare-xcode-build
        with:
          deriveddata-key-prefix: xcode27-probe-deriveddata
          deriveddata-restore-keys: xcode27-probe-deriveddata-

      - name: Cache zig 0.16.0
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install zig 0.16.0
        run: |
          set -euo pipefail
          echo "install-zig" > "$RUNNER_TEMP/ghostty-probe-step"
          ZIG_DIR="$RUNNER_TEMP/zig"
          if [[ ! -x "$ZIG_DIR/zig" ]]; then
            # xcode-27 runners are arm64 (macOS 26); aarch64 is the right
            # build. Fails loudly (set -e) if the download/extract fails.
            curl -fsSL --retry 3 --connect-timeout 30 \
              -o "$RUNNER_TEMP/zig.tar.xz" \
              "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz"
            mkdir -p "$ZIG_DIR"
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$ZIG_DIR" --strip-components=1
            rm -f "$RUNNER_TEMP/zig.tar.xz"
          fi
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          echo "zig $(zig version)"

      - name: Resolve upstream ghostty main SHA
        id: resolve-sha
        run: |
          set -euo pipefail
          echo "resolve-upstream-sha" > "$RUNNER_TEMP/ghostty-probe-step"
          RESOLVED_SHA="$(git ls-remote https://github.com/ghostty-org/ghostty.git refs/heads/main | cut -f1)"
          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to resolve upstream ghostty main SHA (got '$RESOLVED_SHA')"
            exit 1
          fi
          echo "Resolved upstream ghostty main: $RESOLVED_SHA"
          echo "resolved_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "RESOLVED_SHA=$RESOLVED_SHA" >> "$GITHUB_ENV"

      - name: No-op gate (vendored build already at upstream main)
        id: noop-gate
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          echo "noop-gate" > "$RUNNER_TEMP/ghostty-probe-step"
          VERSION="$(cat Vendor/libghostty/VERSION)"
          echo "Vendored VERSION : $VERSION"
          echo "Upstream main    : $RESOLVED_SHA"
          # Persisted for the bump-PR body (the build below overwrites VERSION).
          echo "OLD_VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$RESOLVED_SHA" == "$VERSION" && "$FORCE_REBUILD" != "true" ]]; then
            echo "No upstream change since the vendored build — no-op week. No build, no PR, no alarm."
            echo "noop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "noop=false" >> "$GITHUB_OUTPUT"

      - name: Build GhosttyKit @ ${{ steps.resolve-sha.outputs.resolved_sha }}
        if: ${{ steps.noop-gate.outputs.noop != 'true' }}
        run: |
          set -euo pipefail
          echo "build-ghosttykit" > "$RUNNER_TEMP/ghostty-probe-step"
          echo "zig $(zig version)"
          GHOSTTY_REF="$RESOLVED_SHA" ./scripts/build.sh ghostty 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "Vendor VERSION now: $(cat Vendor/libghostty/VERSION)"

      - name: Full unit suite against new binaries (probe pre-validation)
        if: ${{ steps.noop-gate.outputs.noop != 'true' }}
        run: |
          set -euo pipefail
          echo "unit-suite" > "$RUNNER_TEMP/ghostty-probe-step"
          # Probe pre-validation: the FULL VVTermTests suite — incl. the
          # behavioral custom-I/O probes (GhosttyCustomIOProbeTests +
          # GhosttyOSCColorQueryTests) — against the NEW binaries, before
          # the bump PR is opened. Mirrors vvterm-pr-ci.yml's unit-tests
          # job (same scheme, destination, resultBundle, parallel testing,
          # PCM-safe flags). The full PR CI on the bump PR is still the
          # merge gate.
          xcodebuild test \
            -scheme VVTermUnitTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ProbeResults.xcresult" \
            -parallel-testing-enabled \
            CODE_SIGNING_ALLOWED=NO \
            IgnoreFileSystemDeviceInodeChanges=YES \
            | tee "$RUNNER_TEMP/probe-test.log"

      - name: Track failing step (create app token)
        run: echo "create-app-token" > "$RUNNER_TEMP/ghostty-probe-step"

      - name: Create GitHub App token (vvterm-ghostty-bump)
        id: app-token
        # Same gate as the bump step: schedule (''), string 'true', or real
        # JSON boolean true (REST-API dispatch) must all enable the token.
        if: ${{ steps.noop-gate.outputs.noop != 'true' && (inputs.create_bump_pr == '' || inputs.create_bump_pr == 'true' || inputs.create_bump_pr == true) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GHOSTTY_BUMP_CLIENT_ID }}
          private-key: ${{ secrets.GHOSTTY_BUMP_PRIVATE_KEY }}

      # NOTE: on `schedule` events the `inputs` context is EMPTY (dispatch
      # defaults do not apply), so the gate must treat empty as true —
      # otherwise the weekly auto-bump would silently never run. For manual
      # validation runs pass create_bump_pr=false via the REST API with a
      # REAL JSON boolean (gh workflow run -f create_bump_pr=false is
      # unreliable — the input is dropped/coerced and the step runs).
      - name: Commit artifacts, push bump branch, create or reuse bump PR
        id: bump-pr
        if: ${{ steps.noop-gate.outputs.noop != 'true' && (inputs.create_bump_pr == '' || inputs.create_bump_pr == 'true' || inputs.create_bump_pr == true) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: |
            ## Ghostty upstream bump: ${SHA7}

            Weekly probe (issue #127): upstream ghostty main moved from `${OLD_VERSION}` to `${RESOLVED_SHA}` (`${SHA7}`).

            ### What changed in this PR
            - Rebuilt `Vendor/libghostty` from upstream main at `${RESOLVED_SHA}` with `scripts/patches/ghostty/custom-io.patch` applied (`GhosttyKit.xcframework`, `lib/`, `ios/`, `ios-simulator/`, `include/`, `VERSION`).
            - Regenerated `VVTerm/Resources/terminfo/`.
            - Updated `scripts/patches/ghostty/BASE` to `${RESOLVED_SHA}`.

            ### Gate
            - Created by the **vvterm-ghostty-bump GitHub App** (not GITHUB_TOKEN), so this PR's CI runs automatically — no approval needed.
            - The probe pre-validated these binaries: full `VVTermTests` unit suite (incl. the custom-I/O behavioral probes) passed before this PR was opened.
            - **Full PR CI (build + unit + UI shards incl. loopback SSH) is the merge gate**; auto-merge is enabled and merges on green.
            - The per-PR OTA build is posted by the ad-hoc pipeline for device validation before merge.
            - Probe run: ${RUN_URL}
          CANARY_BODY: |
            ## Ghostty upstream bump canary: ${SHA7}

            The probe is bumping the vendored ghostty core to `${RESOLVED_SHA}` (`${SHA7}`).

            **This issue tracks the LATEST in-flight bump** — its title is updated
            as the upstream SHA moves (at most one canary issue exists at a time).
            It **auto-closes when the bump PR merges** — the PR title carries
            `(closes #N)` which becomes the squash commit subject, and GitHub's
            commit-message closing-keyword channel closes this issue on the squash
            auto-merge.

            **If this issue stays open, the bump has NOT landed — investigate:**
            - Bump PR: look for `chore/ghostty-upstream-bump` (evergreen branch) under Pull requests — its title shows the current sha.
            - Probe run: ${RUN_URL}
            - Alarm issues (label `ghostty-patch`) may explain a pre-PR failure; if
              CI is green but the PR has not merged: merge it manually (auto-merge
              re-enables each run).
            - The shipped app is untouched either way: it runs the last good core
              until a bump merges.
        run: |
          set -euo pipefail
          echo "create-bump-pr" > "$RUNNER_TEMP/ghostty-probe-step"
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "inputs.create_bump_pr='${{ inputs.create_bump_pr }}'"
          SHA7="${RESOLVED_SHA:0:7}"
          BRANCH="chore/ghostty-upstream-bump"

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::App token is empty — check the GHOSTTY_BUMP_CLIENT_ID variable and GHOSTTY_BUMP_PRIVATE_KEY secret (see scripts/patches/ghostty/README.md)."
            exit 1
          fi

          # The PR_BODY env scalar carries ${...} placeholders; bash never
          # re-expands them, so substitute explicitly.
          PR_BODY="${PR_BODY//\$\{SHA7\}/$SHA7}"
          PR_BODY="${PR_BODY//\$\{OLD_VERSION\}/$OLD_VERSION}"
          PR_BODY="${PR_BODY//\$\{RESOLVED_SHA\}/$RESOLVED_SHA}"
          PR_BODY="${PR_BODY//\$\{RUN_URL\}/$RUN_URL}"
          CANARY_BODY="${CANARY_BODY//\$\{SHA7\}/$SHA7}"
          CANARY_BODY="${CANARY_BODY//\$\{RESOLVED_SHA\}/$RESOLVED_SHA}"
          CANARY_BODY="${CANARY_BODY//\$\{RUN_URL\}/$RUN_URL}"

          git config user.name "vvterm-ghostty-bump[bot]"
          git config user.email "vvterm-ghostty-bump[bot]@users.noreply.github.com"

          # Fresh parent for the create path (design NIT 5): the checkout
          # step fetched main hours ago and a long probe run can take 1-2h —
          # re-fetch keeps the create-path parent fresh.
          git fetch -q origin main
          MAIN_TIP="$(git rev-parse origin/main)"

          # Works whether a local branch of this name exists or not (fresh
          # runner per run — none does); the local branch is only a worktree
          # for the artifact commit, the server-side ref is the source of
          # truth. No local branch is created at all — the worktree stays on
          # the checkout's main tip; index-only ops (add/write-tree) below
          # don't care, and the ref write happens via the Git API.
          # BASE (patch base, read by scripts/build.sh by default) tracks
          # the resolved upstream SHA; VERSION was written by build.sh from
          # the same SHA. BSD sed on macOS: -i requires the '' extension arg.
          sed -i '' "s|.*|${RESOLVED_SHA}|" scripts/patches/ghostty/BASE
          git add Vendor/libghostty VVTerm/Resources/terminfo scripts/patches/ghostty/BASE

          if git diff --cached --quiet; then
            echo "::notice::No changes to commit (forced rebuild produced identical artifacts) — skipping bump PR."
            exit 0
          fi

          # --- Discover the evergreen bump state (alarm-invariant ordering) ---
          BRANCH_SHA="$(gh api "repos/${REPO}/git/refs/heads/${BRANCH}" --jq '.object.sha' 2>/dev/null || true)"
          # Create path: the ref does not exist and gh api 404s — on a
          # non-TTY runner the raw error body lands on stdout, so validate
          # the shape before trusting it as a parent sha.
          [[ "$BRANCH_SHA" =~ ^[0-9a-f]{40}$ ]] || BRANCH_SHA=""
          PR_NUMBER=""
          for _ in 1 2; do
            PR_JSON="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,state --jq '.[0] // empty' 2>/dev/null || true)"
            PR_NUMBER="$(jq -r '.number // empty' <<<"$PR_JSON")"
            [[ -n "$PR_NUMBER" ]] && break
            sleep 5
          done
          if [[ -n "$PR_NUMBER" ]]; then
            # Post-PR ownership: with an evergreen PR, any later failure in
            # this step warns/reds the run but must NEVER file a pre-PR alarm
            # (the open PR + canary issue are the signal).
            echo "probe-passed" > "$RUNNER_TEMP/ghostty-probe-ok"
            echo "Evergreen bump PR #${PR_NUMBER} exists — updating in place."
          fi

          # --- Verified commit via the Git API ---
          # gh-ruleset-main requires verified signatures (required_signatures)
          # and checks ALL commits in the PR range. A local `git commit` as
          # the app is unsigned → mergeability BLOCKED → auto-merge never
          # fires (observed 2026-08-13: PRs #159/#162 stalled, control #160
          # with a signed commit auto-merged). POST /git/commits with the
          # app token and NO custom author/committer/signature makes GitHub
          # sign the commit with its web-flow key and mark it Verified (the
          # dependabot mechanism — docs.github.com "Signature verification
          # for bots"), satisfying required_signatures.
          TREE="$(git write-tree)"
          # Update path: parent on the existing evergreen branch head (so the
          # new commit fast-forwards it); create path: fresh main tip.
          PARENT="${BRANCH_SHA:-$MAIN_TIP}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Upload the tree+blobs server-side (POST /git/commits validates
          # the tree exists; pushing a temp commit to a scratch ref is the
          # only practical way to upload the xcframework blobs). The scratch
          # commit is ALWAYS parented on local HEAD (main tip) — never on
          # the evergreen branch head (design FIX-NOW 1): the branch head
          # exists only server-side and is NOT a local object on the fresh
          # runner checkout, so `git commit-tree -p <branch-head>` dies
          # `fatal: <sha> is not a valid object`. The scratch commit is
          # only a blob-upload vehicle; its parents are irrelevant — the
          # server-side API commit below carries the real parents. The
          # scratch ref must be a TAG, not a branch: the scratch commit is
          # unsigned (Apps have no local signing key) and gh-ruleset-all
          # enforces required_signatures on ALL branches (2026-08-14) —
          # branch pushes of it were rejected (alarm issue #173, run
          # 32004444535). Tags are outside the branch rulesets' scope, and
          # the only push-triggered workflows (ios-testflight,
          # sep-webauthn-fixtures) filter to branches: [main], so the tag
          # triggers nothing. The `+` force refspec makes a re-run of the
          # same workflow run id (re-runs reuse GITHUB_RUN_ID) replace any
          # leftover tag instead of erroring; non_fast_forward does not
          # apply to tags.
          SCRATCH="ci/ghostty-bump-upload-${GITHUB_RUN_ID}"
          TMP_COMMIT="$(git commit-tree "$TREE" -p "$MAIN_TIP" -m "scratch upload ${GITHUB_RUN_ID}")"
          git push -q origin "+${TMP_COMMIT}:refs/tags/${SCRATCH}"
          NEW_COMMIT="$(gh api -X POST "repos/${REPO}/git/commits" --input - <<JSON | jq -r .sha
          {"message": "chore: ghostty upstream bump to ${SHA7}", "tree": "${TREE}", "parents": ["${PARENT}"]}
          JSON
          )"
          # Sanity: the API-created commit MUST be verified, else the PR
          # would be mergeability-BLOCKED again. Abort on failure (exit 1):
          # on the create path no marker exists yet, so the pre-PR alarm
          # still fires; on the update path the marker was already written
          # at discovery, so the run just reds with no alarm — correct (the
          # evergreen PR + canary issue own the outcome).
          VERIFIED="$(gh api "repos/${REPO}/commits/${NEW_COMMIT}" --jq '.commit.verification.verified')"
          if [[ "$VERIFIED" != "true" ]]; then
            echo "::error::API-created commit ${NEW_COMMIT} is NOT verified (verification=${VERIFIED}) — required_signatures would block the PR. Aborting."
            gh api -X DELETE "repos/${REPO}/git/refs/tags/${SCRATCH}" >/dev/null 2>&1 || true
            exit 1
          fi
          # Canary issue: a single visible "bump hasn't landed" lead that
          # tracks the LATEST in-flight sha and auto-closes when the bump PR
          # merges. Closing channel: the PR title carries "(closes #N)" →
          # with squash_merge_commit_title=PR_TITLE the title becomes the
          # squash commit subject → GitHub commit-message keyword close on
          # auto-merge (subject-only doctrine; the PR body stays
          # keyword-free). The canary is REUSED while open (title edited to
          # the current sha) so at most ONE canary issue exists at a time;
          # a weekly "now tracking" comment keeps the trail. Non-fatal: on
          # any failure we warn and continue WITHOUT the canary. Issue calls
          # must use GITHUB_TOKEN (the app token has Contents+Pull-requests
          # only, no Issues permission). The NUMBER is RESOLVED here (needed
          # for the PR title) but CREATION + title edit + comments are
          # deferred until AFTER the ref write succeeds (design FIX-NOW 3) —
          # a pre-ref failure can never leave a canary claiming to track a
          # sha that has no bump.
          CANARY_TITLE="ghostty bump in-flight: ${SHA7}"
          CANARY_ISSUE="$(GH_TOKEN="$GITHUB_TOKEN" gh issue list --repo "$REPO" --state open --search 'in:title "ghostty bump in-flight:"' --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -n "$CANARY_ISSUE" ]]; then
            echo "Reusing canary issue #${CANARY_ISSUE}"
          fi
          if [[ -z "$CANARY_ISSUE" ]]; then
            echo "No open canary issue yet — creation deferred to after the ref write."
          fi

          # Ref write: fast-forward the evergreen branch (non_fast_forward
          # permits FF updates under gh-ruleset-all; required_signatures is
          # satisfied because the new commit is API-verified and the whole
          # range stays verified — no unsigned commits ever exist, so the old
          # delete+recreate dance is obsolete). The PR title is only edited
          # AFTER this succeeds so a title never claims a sha the branch
          # doesn't point at.
          if [[ -n "$BRANCH_SHA" ]]; then
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" -f sha="$NEW_COMMIT" >/dev/null \
              || { echo "::error::Could not fast-forward bump branch ${BRANCH} to ${NEW_COMMIT}."; gh api -X DELETE "repos/${REPO}/git/refs/tags/${SCRATCH}" >/dev/null 2>&1 || true; exit 1; }
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="$NEW_COMMIT" >/dev/null
          fi
          # Scratch tag cleanup is best-effort; a leftover tag is harmless.
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${SCRATCH}" >/dev/null 2>&1 || true
          echo "Bump branch ${BRANCH} @ ${NEW_COMMIT} (verified, signed by GitHub)"

          # Canary mutations, gated on ref success (FIX-NOW 3): CREATION
          # (first bump) also happens here — only once the branch actually
          # points at the new sha — then the "now tracking" title edit +
          # trail comment. Pre-ref failures therefore never leave canary
          # state behind. Non-fatal throughout.
          if [[ -z "$CANARY_ISSUE" ]]; then
            CANARY_URL="$(GH_TOKEN="$GITHUB_TOKEN" gh issue create --repo "$REPO" --title "$CANARY_TITLE" --body "$CANARY_BODY" 2>/dev/null || true)"
            CANARY_ISSUE="$(sed -E 's#.*/issues/([0-9]+).*#\1#' <<<"$CANARY_URL")"
            [[ -n "$CANARY_ISSUE" ]] && echo "Created canary issue #${CANARY_ISSUE} (${CANARY_TITLE})"
          fi
          if [[ -n "$CANARY_ISSUE" ]]; then
            GH_TOKEN="$GITHUB_TOKEN" gh issue edit "$CANARY_ISSUE" --repo "$REPO" --title "$CANARY_TITLE" >/dev/null 2>&1 || true
            GH_TOKEN="$GITHUB_TOKEN" gh issue comment "$CANARY_ISSUE" --repo "$REPO" --body "Now tracking ${SHA7} — probe run: ${RUN_URL}" >/dev/null 2>&1 || true
            echo "Canary issue #${CANARY_ISSUE} now tracking ${SHA7}"
          else
            echo "::warning::Could not create canary issue (${CANARY_TITLE}) — continuing without it."
          fi

          # "Never merge an older ghostty core" holds by construction: there
          # is exactly ONE evergreen bump branch+PR, always tracking the
          # latest build — no other PR can exist to close.

          PR_TITLE="chore: ghostty upstream bump to ${SHA7}"
          [[ -n "$CANARY_ISSUE" ]] && PR_TITLE="${PR_TITLE} (closes #${CANARY_ISSUE})"

          # Update path: the evergreen PR already exists (discovered above).
          # The PR discovery + probe-passed marker happened BEFORE the ref
          # write, so any failure in this branch warns/reds the run but is
          # NOT a pre-PR alarm — the open PR + canary issue own the outcome.
          # Shared with the create-fallback below (a transient discovery miss
          # must never fall through to a failed create that would file a
          # false pre-PR alarm).
          update_existing_pr() {
            local n="$1"
            echo "Updating evergreen bump PR #${n} to ${SHA7}"
            # Title keyword is the ONLY canary-close channel — failures here
            # must be LOUD, not swallowed (retry once for transient blips).
            local edited=0
            for _ in 1 2; do
              if gh pr edit "$n" --repo "$REPO" --title "$PR_TITLE" --body "$PR_BODY"; then
                edited=1
                break
              fi
              sleep 5
            done
            if (( edited == 0 )); then
              echo "::warning::Could not edit bump PR #${n} title/body — the closing keyword may be missing on merge; investigate."
            fi
            # Issue comments need Issues write → GITHUB_TOKEN override (the
            # step's app token has Contents+Pull-requests only).
            if [[ -n "$CANARY_ISSUE" ]]; then
              GH_TOKEN="$GITHUB_TOKEN" gh issue comment "$CANARY_ISSUE" --repo "$REPO" --body "Bump PR: https://github.com/${REPO}/pull/${n} (updated to ${SHA7})" >/dev/null 2>&1 || true
            fi
            echo "bump_pr_number=${n}" >> "$GITHUB_OUTPUT"
            # (Re-)enable auto-merge with retries: after the fast-forward
            # GitHub can take a moment to re-evaluate mergeability. Failures
            # are never a probe alarm.
            for _ in 1 2 3; do
              if gh pr merge "$n" --repo "$REPO" --auto --squash 2>/dev/null; then
                echo "Auto-merge (re)enabled on #${n}"
                break
              fi
              sleep 10
            done
            # Marker: the evergreen PR owns the outcome from here on (a no-op
            # on the discovery path where it was already written).
            echo "probe-passed" > "$RUNNER_TEMP/ghostty-probe-ok"
          }

          if [[ -n "$PR_NUMBER" ]]; then
            update_existing_pr "$PR_NUMBER"
            exit 0
          fi

          # Create path: first-ever bump — the evergreen branch + PR are born
          # here (no PR existed at discovery time).
          PR_URL="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" 2>/dev/null || true)"
          if [[ -z "$PR_URL" ]]; then
            # Transient discovery miss? Re-discover before alerting — a live
            # evergreen PR plus a failed create must never file a pre-PR
            # alarm.
            RECOVERED="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            if [[ -n "$RECOVERED" ]]; then
              echo "PR #${RECOVERED} existed after all — switching to update path."
              update_existing_pr "$RECOVERED"
              exit 0
            fi
            echo "::error::gh pr create failed and no evergreen PR was found — pre-PR alarm will fire."
            exit 1
          fi
          echo "Created bump PR: $PR_URL"
          PR_NUMBER="$(sed -E 's#.*/pull/([0-9]+).*#\1#' <<<"$PR_URL")"
          # Link the canary to the PR so it is traceable before auto-close.
          # Issue comments need Issues write → GITHUB_TOKEN override.
          if [[ -n "$CANARY_ISSUE" ]]; then
            GH_TOKEN="$GITHUB_TOKEN" gh issue comment "$CANARY_ISSUE" --repo "$REPO" --body "Bump PR: $PR_URL" >/dev/null 2>&1 || true
          fi
          echo "bump_pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          # Marker for the alarm step: ONLY now that the bump PR exists
          # (create path). Any failure after this point is NOT a probe alarm
          # — the open PR + canary issue own the outcome. A failure BEFORE
          # this point — e.g. gh pr create itself — still files the alarm.
          echo "probe-passed" > "$RUNNER_TEMP/ghostty-probe-ok"

          # Enable auto-merge (squash) with retries. gh-ruleset-main
          # requires the PR CI checks (build/unit-tests/ui-tests-shard-0..3),
          # so auto-merge only fires when the full PR CI passes on the new
          # binaries. If auto-merge cannot be enabled (PR not mergeable
          # yet), the evergreen PR stays open; the open canary is the signal
          # — never a probe alarm.
          AUTO_MERGED=0
          for _ in 1 2 3; do
            if gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash 2>/dev/null; then
              echo "Auto-merge enabled on bump PR #${PR_NUMBER}"
              AUTO_MERGED=1
              break
            fi
            sleep 10
          done
          if (( AUTO_MERGED == 0 )); then
            echo "::warning::Could not enable auto-merge on #${PR_NUMBER} (PR may already be merged or not yet mergeable). The evergreen PR stays open; the open canary is the signal — never a probe alarm."
          fi

      - name: Upload probe test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-probe-results
          path: |
            ${{ runner.temp }}/probe-test.log
            ${{ runner.temp }}/ProbeResults.xcresult
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Alarm issue on probe failure (not on bump-PR failures)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NOOP: ${{ steps.noop-gate.outputs.noop }}
          ALARM_BODY: |
            ## Ghostty upstream probe alarm

            - **Failing step**: `${STEP}`
            - **Resolved upstream SHA**: `${SHA}` (`${SHA7}`)
            - **Workflow run**: ${RUN_URL}

            The weekly probe could not rebuild or validate ghostty at the resolved upstream main SHA.

            ### Likely causes
            - `scripts/patches/ghostty/custom-io.patch` (or an inline patch in `scripts/build.sh`) no longer applies to `${SHA}` — upstream drift.
            - zig 0.16.0 build flag drift.
            - The full unit suite (incl. the behavioral probe tests) failed against the new binaries.
            - The GitHub App token step failed (GHOSTTY_BUMP_CLIENT_ID variable / GHOSTTY_BUMP_PRIVATE_KEY secret missing or expired; app not installed on the repo).

            ### What to do
            1. Follow the rebase runbook: `scripts/patches/ghostty/README.md`.
            2. Rebase `custom-io.patch` onto `${SHA}` (`git apply --3way`; the known conflict spots are documented in the runbook).
            3. Update `scripts/patches/ghostty/BASE`, then re-dispatch the probe (workflow_dispatch, force_rebuild=true, create_bump_pr=false) to validate before the real bump.

            ### Risk window
            The **shipped app is untouched**: the vendored build and installed app keep running on the last good core until a bump PR passes CI and merges. No user action required.
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STEP="$(cat "$RUNNER_TEMP/ghostty-probe-step" 2>/dev/null || echo unknown)"
          SHA="${RESOLVED_SHA:-unknown}"
          SHA7="${SHA:0:7}"

          # ALARM_BODY env scalar carries ${...} placeholders; bash never
          # re-expands them, so substitute explicitly.
          ALARM_BODY="${ALARM_BODY//\$\{STEP\}/$STEP}"
          ALARM_BODY="${ALARM_BODY//\$\{SHA\}/$SHA}"
          ALARM_BODY="${ALARM_BODY//\$\{SHA7\}/$SHA7}"
          ALARM_BODY="${ALARM_BODY//\$\{RUN_URL\}/$RUN_URL}"

          if [[ "${NOOP:-}" == "true" ]]; then
            echo "No-op run — nothing to alarm about."
            exit 0
          fi
          if [[ -f "$RUNNER_TEMP/ghostty-probe-ok" ]]; then
            echo "::error::Failure happened at/after bump-PR creation (step: ${STEP}) — NOT a probe alarm by design (the evergreen PR + canary issue own the outcome). Run: ${RUN_URL}"
            exit 1
          fi

          TITLE="ghostty probe ALARM: ${STEP} at ${SHA7}"
          # Dedupe: an OPEN issue with the same title already exists → comment
          # the run URL instead of creating a duplicate.
          EXISTING="$(gh issue list --repo "$REPO" --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Repeat occurrence — probe run: ${RUN_URL}" >/dev/null
            echo "Updated existing alarm issue #${EXISTING} (${TITLE})"
          else
            gh label create ghostty-patch --repo "$REPO" --description "Ghostty upstream probe alarm" --color b60205 >/dev/null 2>&1 || true
            if gh label view ghostty-patch --repo "$REPO" >/dev/null 2>&1; then
              gh issue create --repo "$REPO" --title "$TITLE" --label ghostty-patch --body "$ALARM_BODY"
            else
              echo "::warning::ghostty-patch label unavailable — creating issue without label."
              gh issue create --repo "$REPO" --title "$TITLE" --body "$ALARM_BODY"
            fi
          fi

