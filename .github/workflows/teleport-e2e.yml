# SPDX-License-Identifier: MIT
#
# Teleport E2E — real Teleport server + real SSH stack integration tests
# (issue #83: milestone M1 = SSH path, M2 = TOTP server capability).
#
# What this verifies that PR CI cannot:
#   - a REAL Teleport cluster (auth + proxy + node, TLS Routing on :443)
#     running on the same macOS runner as the tests
#   - the app's real SSH path end-to-end: SSHTLSTransport (TLS + ALPN
#     teleport-proxy-ssh), the `proxy:<node>:0` subsystem, outer + inner
#     libssh2 handshakes, and exec through the target node — using a
#     server-minted cert (tctl auth sign), the same cert shape the app's
#     Phase-1 bootstrap produces
#   - the TOTP provisioning + login chain on an `otp` cluster and the
#     WebAuthn chains on a `webauthn` cluster (server-smoke matrix job):
#     registerchallenge → QR decode (opencv-python-headless) → password PUT
#     with second_factor_token → sessions/web login; plus the software-key
#     registration, password+WebAuthn login, headless approval, and
#     passwordless login (scripts/ci/teleport-webauthn.py + fido2)
#
#   - the #269 proxy-recording leg: a cluster booted with
#     `session_recording: proxy` makes the proxy take Teleport's
#     dialAndForward path, which requires the client to forward an SSH agent;
#     `TELEPORT_SESSION_RECORDING=proxy` selects it (matrix.include, so the
#     default `off` legs keep the direct-dial path).
#
# Why dispatch/schedule and not PR CI:
#   - PR CI peaks at 5 concurrent macOS jobs (unit-tests + the 4 UI
#     shards; the build job runs first alone) with a ~20m wall-clock budget
#     (AGENTS.md). A per-PR teleport job would queue and add wall-clock to
#     every PR.
#   - The tests themselves ARE part of VVTermTests (env-gated: they `skip`
#     when VVTERM_TELEPORT_CERT is absent), so they cost ~0s in PR CI and
#     only execute here, where the env fixtures are present.
#   - schedule keeps the real-server path exercised against main without
#     manual action; workflow_dispatch allows ad-hoc runs on any branch.
#
# Topology constraint: GitHub Actions jobs on different runners cannot
# reach each other, and the iOS simulator shares the host loopback — so
# Teleport MUST run on the same macOS runner as the tests (it cannot be
# hosted on an Ubuntu runner). Teleport publishes darwin-arm64 binaries
# (pinned v16.4.0 — v17 does not publish darwin). GH macOS runners have
# passwordless sudo, which the server script uses to bind :443.
#
# Server lifecycle: scripts/ci/teleport-server.sh
#   install   — download + extract teleport/tsh/tctl (cached by version)
#   start     — write all-in-one config, launch `teleport start` in the
#               background (sudo for the <1024 web port)
#   bootstrap — create ci-user, complete the invite over the webapi
#               (non-interactive password set), mint the SSH cert with
#               `tctl auth sign --format=openssh`, export the cluster TLS
#               CA, run a tsh ssh smoke test through the TLS-routing proxy
#               → writes $RUNNER_TEMP/vvterm-teleport/vvterm-teleport.env
#
# The test step sources that env file (PEM fixtures + server coordinates)
# into the xcodebuild process; env vars propagate to the simulator test
# process (precedent: VVTERM_UNREACHABLE_TEST_HOST in the PR CI
# unit-tests job).
#
# See: https://github.com/cad0p/vvterm/issues/83

name: Teleport E2E

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 02:00 UTC — exercise the real-server path against main.
    - cron: '0 2 * * 0'

permissions:
  contents: read

concurrency:
  group: teleport-e2e
  cancel-in-progress: true

jobs:
  # Server-only smoke matrix: boots a cluster and completes the full
  # bootstrap for each MFA mode (M1: off, M2: otp, M3: webauthn) WITHOUT
  # building the app (~4-6 min/job vs ~15 min for the xcodebuild path). The
  # otp leg exercises the TOTP provisioning chain (registerchallenge → QR
  # decode → password PUT with second_factor_token → sessions/web login);
  # the webauthn leg exercises software-key registration → password+WebAuthn
  # login → headless approval → passwordless login — the same webapi
  # machinery the app's login flows use. Runs on a high web port (no sudo
  # needed — nothing binds :443 here).
  server-smoke:
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        second-factor: ['off', 'otp', 'webauthn']
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Teleport binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vvterm-teleport/bin
          key: teleport-v16.4.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport binaries
        run: bash scripts/ci/teleport-server.sh install

      - name: Install Python deps (QR decoder + fido2 WebAuthn signer)
        # opencv-python-headless is required only for the otp leg (Teleport
        # returns the TOTP secret as a QR); fido2 (Yubico's pure-Python
        # WebAuthn lib) powers the software credential used by the webauthn
        # leg. Homebrew python is first on arm64 runner PATHs, so pip3
        # targets the same interpreter the script's `python3` resolves to.
        # --break-system-packages: Homebrew python is PEP 668
        # externally-managed (observed on the xcode-27 runners).
        run: |
          set -euo pipefail
          for mod in cv2 fido2; do
            if ! python3 -c "import $mod" 2>/dev/null; then
              python3 -m pip install --user --break-system-packages --quiet "$([ $mod = cv2 ] && echo opencv-python-headless || echo fido2)" \
                || pip3 install --user --break-system-packages --quiet "$([ $mod = cv2 ] && echo opencv-python-headless || echo fido2)"
            fi
          done
          python3 -c 'import cv2; import importlib.metadata as m; print("cv2", cv2.__version__, "| fido2", m.version("fido2"))'

      - name: Start Teleport cluster (second_factor=${{ matrix.second-factor }})
        run: |
          set -euo pipefail
          TELEPORT_WEB_PORT=8443 TELEPORT_HOST=127.0.0.1 TELEPORT_NODE=ci-node \
          TELEPORT_CLUSTER=ci-cluster TELEPORT_USER=ci-user TELEPORT_LOGIN=ci-login \
          TELEPORT_SECOND_FACTOR=${{ matrix.second-factor }} \
          bash scripts/ci/teleport-server.sh start

      - name: Bootstrap (webapi invite + MFA provisioning + cert + smokes)
        run: |
          set -euo pipefail
          TELEPORT_WEB_PORT=8443 TELEPORT_HOST=127.0.0.1 TELEPORT_NODE=ci-node \
          TELEPORT_CLUSTER=ci-cluster TELEPORT_USER=ci-user TELEPORT_LOGIN=ci-login \
          TELEPORT_SECOND_FACTOR=${{ matrix.second-factor }} \
          bash scripts/ci/teleport-server.sh bootstrap

      - name: Confirm server health
        run: bash scripts/ci/teleport-server.sh status

      - name: Upload teleport logs (always)
        if: always()
        # continue-on-error: a transient artifact-upload flake must not fail
        # an otherwise-green leg (observed: server-smoke (off) failed only
        # on the upload step).
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: teleport-server-smoke-${{ matrix.second-factor }}-logs
          path: |
            ${{ runner.temp }}/vvterm-teleport/teleport.log
            ${{ runner.temp }}/vvterm-teleport/teleport.yaml
            ${{ runner.temp }}/vvterm-teleport/vvterm-teleport.env
          if-no-files-found: ignore

      - name: Stop Teleport (always)
        if: always()
        run: TELEPORT_WEB_PORT=8443 bash scripts/ci/teleport-server.sh stop || true

  teleport-e2e:
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Explicit include (NOT a cross-product): `session-recording` is the
        # #269 lever. `proxy` makes Teleport record at the proxy, so the
        # proxy takes its dialAndForward path and requires the client to
        # forward an SSH agent; `off` keeps the historical direct-dial path.
        #
        # Job budget (L3-A8): three legs here + three server-smoke legs = up
        # to 6 concurrent macOS jobs on a dispatch against the 5-slot
        # account cap, so one job briefly queues. This workflow is
        # dispatch/schedule-only, so the PR ≤20m budget is untouched, and the
        # smoke legs are short.
        include:
          - second-factor: off
            session-recording: off
          - second-factor: webauthn
            session-recording: off
          - second-factor: off
            session-recording: proxy
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # Job-level env reaches every step; the start/bootstrap/probe steps
      # read it to gate tsh's -A and the proxy-recording config lever.
      TELEPORT_SESSION_RECORDING: ${{ matrix.session-recording }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Teleport binaries
        # The tarball is ~100MB; the script skips the download when
        # $BIN_DIR/teleport exists, so cache the extracted binaries keyed
        # on the pinned version + runner arch.
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vvterm-teleport/bin
          key: teleport-v16.4.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport binaries
        run: bash scripts/ci/teleport-server.sh install

      - name: Install Python deps (fido2 WebAuthn signer)
        # Required only for the webauthn leg (the harness provisions the
        # server-side MFA credential + runs the headless/passwordless
        # smokes with the Python software authenticator).
        # --break-system-packages: Homebrew python is PEP 668
        # externally-managed (observed on the xcode-27 runners).
        if: matrix.second-factor == 'webauthn'
        run: |
          set -euo pipefail
          if ! python3 -c 'import fido2' 2>/dev/null; then
            python3 -m pip install --user --break-system-packages --quiet fido2 \
              || pip3 install --user --break-system-packages --quiet fido2
          fi
          python3 -c 'import importlib.metadata as m; print("fido2", m.version("fido2"))'

      - name: Start Teleport cluster (TLS routing on :443, mfa=${{ matrix.second-factor }}, recording=${{ matrix.session-recording }})
        run: |
          set -euo pipefail
          # sudo -n (passwordless on GH runners) is handled inside the
          # script when the web port needs root. All knobs are pinned
          # explicitly — the script's TELEPORT_* knobs can collide with
          # ambient teleport env on dev machines, so never inherit them.
          # off — the M1 app SSH path. webauthn — the M3 smokes + the M4
          # app ceremony (Phase-2 registration + Phase-3 passwordless).
          # recording=proxy — the #269 record-at-proxy agent-forwarding leg.
          TELEPORT_WEB_PORT=443 TELEPORT_HOST=127.0.0.1 TELEPORT_NODE=ci-node \
          TELEPORT_CLUSTER=ci-cluster TELEPORT_USER=ci-user TELEPORT_LOGIN=ci-login \
          TELEPORT_SECOND_FACTOR=${{ matrix.second-factor }} \
          TELEPORT_SESSION_RECORDING=${{ matrix.session-recording }} \
          TELEPORT_PASSWORD=VmTestPassw0rd! \
          bash scripts/ci/teleport-server.sh start

      - name: Bootstrap user + cert fixtures (webapi invite, MFA provisioning, smokes)
        run: |
          set -euo pipefail
          TELEPORT_WEB_PORT=443 TELEPORT_HOST=127.0.0.1 TELEPORT_NODE=ci-node \
          TELEPORT_CLUSTER=ci-cluster TELEPORT_USER=ci-user TELEPORT_LOGIN=ci-login \
          TELEPORT_SECOND_FACTOR=${{ matrix.second-factor }} \
          TELEPORT_SESSION_RECORDING=${{ matrix.session-recording }} \
          TELEPORT_PASSWORD=VmTestPassw0rd! \
          bash scripts/ci/teleport-server.sh bootstrap

      - name: Confirm server health
        run: bash scripts/ci/teleport-server.sh status

      - name: Assert the Teleport user and host login differ (#262)
        # The E2E cluster must exercise the mismatch: the app sends the
        # certificate principal as the SSH username, and a cluster where
        # TELEPORT_USER == TELEPORT_LOGIN cannot catch a regression that sends
        # the Teleport user instead. Fail loudly rather than silently losing
        # the lever.
        run: |
          set -euo pipefail
          env_file="${VVTERM_TELEPORT_ENV_FILE:?teleport-server.sh bootstrap did not export VVTERM_TELEPORT_ENV_FILE}"
          env_user="$(sed -n 's/^VVTERM_TELEPORT_USER=//p' "$env_file" | head -1)"
          env_login="$(sed -n 's/^VVTERM_TELEPORT_LOGIN=//p' "$env_file" | head -1)"
          if [ -z "$env_user" ] || [ -z "$env_login" ]; then
            echo "error: VVTERM_TELEPORT_USER/VVTERM_TELEPORT_LOGIN missing from $env_file" >&2
            exit 1
          fi
          if [ "$env_user" = "$env_login" ]; then
            echo "error: the #262 E2E lever requires TELEPORT_USER != TELEPORT_LOGIN (both '$env_user')" >&2
            exit 1
          fi
          echo "lever ok: user=$env_user login=$env_login"

      - name: Restore e2e DerivedData cache (explicit)
        # The irgaly/xcode-cache restore has missed on every e2e run (both
        # its own namespace and the PR CI fallback: "DerivedData cache not
        # found" in 0.057s even with matching entries), forcing a full
        # ~9 min rebuild each dispatch. Restore explicitly with a simple
        # space-free key; the save step below persists even when the job
        # fails (irgaly skips saving on failed jobs, so the e2e namespace
        # never accumulated entries).
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/DerivedData
          key: e2e-deriveddata-${{ github.sha }}
          restore-keys: |
            e2e-deriveddata-

      - name: Prepare Xcode build (mtimes, caches, Metal toolchain)
        uses: ./.github/actions/prepare-xcode-build
        with:
          deriveddata-key-prefix: xcode27-deriveddata
          # PR CI fallback only — the e2e namespace is handled by the
          # explicit restore/save steps above.
          deriveddata-restore-keys: xcode27-deriveddata-VVTerm PR CI-

      - name: Probe server health via tsh (test-time)
        # The bootstrap smoke runs minutes before the app tests; the off-leg
        # outer-handshake stalls happen in that gap. A tsh exec probe at test
        # time attributes the next failure decisively: probe FAILS = server
        # can't complete SSH at test time (server-side), probe passes = the
        # app side stalled (app-side).
        #
        # Known red fixed here (L3-A5, run 36302712010): the probe reused
        # `write_env_file`'s quoted values via a sed read that did not strip
        # the quotes, so tsh presented the SSH principal `"ci-login"`
        # (auth log: `principal "\"ci-login\"" not in the set of valid
        # principals`). `cmd_probe` now strips the surrounding quotes.
        run: |
          set -euo pipefail
          TELEPORT_WEB_PORT=443 TELEPORT_HOST=127.0.0.1 TELEPORT_NODE=ci-node \
          TELEPORT_CLUSTER=ci-cluster TELEPORT_USER=ci-user TELEPORT_LOGIN=ci-login \
          TELEPORT_SECOND_FACTOR=${{ matrix.second-factor }} \
          TELEPORT_SESSION_RECORDING=${{ matrix.session-recording }} \
          bash scripts/ci/teleport-server.sh probe

      - name: Pre-resolve SPM dependencies (retry)
        # The test step's xcodebuild resolution can fail transiently on
        # shared runners ("Couldn't update repository submodules" — a
        # dependency fetch flake). Resolve once up front with retries so
        # the actual test run never hits a cold network fetch.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                -scheme VVTermUnitTests \
                -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                >/dev/null 2>&1; then
              echo "SPM resolved (attempt $attempt)"
              exit 0
            fi
            echo "SPM resolution failed (attempt $attempt) — retrying"
            sleep 15
          done
          echo "SPM resolution failed after 3 attempts" >&2
          exit 1

      - name: Trust the cluster web certificate in the simulator
        # The app's webapi leg verifies the server with system trust. The CI
        # cluster serves a self-signed web certificate whose SANs cover
        # 127.0.0.1, so add it to the simulator's root store before the
        # Phase-2/3 ceremony — the test then exercises the production trust
        # path (no app-side test seam). The certificate is exported by
        # `teleport-server.sh bootstrap` (fixtures/web-cert.pem).
        if: matrix.second-factor == 'webauthn'
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/vvterm-teleport/fixtures/web-cert.pem"
          if [ ! -s "$CERT" ]; then
            echo "::error::web certificate fixture missing — bootstrap did not export it"
            exit 1
          fi
          xcrun simctl boot "iPhone 17" 2>/dev/null || true
          xcrun simctl bootstatus "iPhone 17" -b
          xcrun simctl keychain "iPhone 17" add-root-cert "$CERT"

      - name: Provision loopback sshd (issue #291 upload legs)
        # SSHUploadIntegrationTests' three legs need a real sshd. This is the
        # same fixture script the PR CI UI shards use (xcode-27 + passwordless
        # sudo) and it is idempotent, so each of the three matrix legs
        # provisions its own runner. The rig writes
        # VVTERM_REPRO_SSH_PORT=22229 for the bytemeter proxy used by
        # repro-zmx.yml; sshd itself listens on 22232, so override the port
        # for the test steps (same override as PR CI).
        run: |
          set -euo pipefail
          bash scripts/ci/repro-sshd-setup.sh
          echo "VVTERM_REPRO_SSH_PORT=22232" >> "$RUNNER_TEMP/vvterm-repro/vvterm-repro.env"

      - name: Run Teleport integration tests
        # Source the env file (PEM fixtures + server coordinates) into the
        # xcodebuild process. VVTERM_TELEPORT_* propagate to the test
        # process (same mechanism as VVTERM_UNREACHABLE_TEST_HOST in PR CI).
        #
        # `xcodebuild test` (not test-without-building): mirrors the PR CI
        # unit-tests job, including the Xcode 27 workaround — the regular
        # `test` command avoids the SwiftProtobuf duplicate-symbol crash
        # that test-without-building hits on Xcode 27.
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/vvterm-teleport/vvterm-teleport.env"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/vvterm-repro/vvterm-repro.env"
          set +a
          # Plain env vars do NOT reach the simulator test process — xcodebuild
          # forwards only TEST_RUNNER_-prefixed vars to the test runner
          # (prefix stripped; the PR CI UI shards use the xctestrun plist
          # route instead, which needs build-for-testing). Re-export every
          # fixture var with the prefix so the .enabled(if:) gates evaluate
          # true in the runner.
          for var in $(compgen -v | grep -E '^VVTERM_(TELEPORT|REPRO_SSH)_' || true); do
            export "TEST_RUNNER_${var}=${!var}"
          done
          echo "fixtures: host=$VVTERM_TELEPORT_HOST port=$VVTERM_TELEPORT_PORT node=$VVTERM_TELEPORT_NODE cluster=$VVTERM_TELEPORT_CLUSTER_NAME cert=$(printf '%s' "$VVTERM_TELEPORT_CERT" | head -c 30)…"
          echo "upload fixture: user=$VVTERM_REPRO_SSH_USERNAME port=$VVTERM_REPRO_SSH_PORT"

          # CODE_SIGNING_ALLOWED=NO (PR CI) leaves the sim app UNSIGNED —
          # no entitlements — and the iOS sim sandbox parks Network.framework
          # connections of unentitled apps in .waiting(.waitingForNetwork)
          # forever (the Teleport TLS path is NWConnection-based; raw POSIX
          # sockets like the connector tests are not gated). Ad-hoc sign so
          # com.apple.security.network.client from VVTerm.entitlements is
          # embedded (sim needs no provisioning profile).
          #
          # Hard step timeout: the integration tests can wedge the app's
          # main thread in a blocking C call that no Swift timeout can
          # preempt — without this the whole job hangs to its timeout-minutes.
          #
          # 20m, not 10m: this is a WEDGE guard, not a build budget. On a
          # cold `e2e-deriveddata-<sha>` cache (every new sha) both matrix
          # legs build from scratch concurrently, and under runner
          # contention the compile alone has exceeded 10m — observed
          # 2026-09-22 (run 35728161320): the webauthn leg was killed
          # mid-compile with no test ever started, while the off leg built
          # in ~8m. The sampler loop below covers the same 20m window.
          # With job control (set -m) the pipeline runs in its own process
          # group, so kill -9 -$! reaps xcodebuild AND tee.
          set -m
          ( xcodebuild test \
              -scheme VVTermUnitTests \
              -configuration Debug \
              -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -resultBundlePath "$RUNNER_TEMP/upload-main.xcresult" \
              -only-testing:VVTermTests/TeleportServerIntegrationTests \
              -only-testing:VVTermTests/SSHUploadIntegrationTests \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 120 \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
              IgnoreFileSystemDeviceInodeChanges=YES \
              | tee "$RUNNER_TEMP/test.log" ) &
          XPID=$!
          # Sampler: while xcodebuild runs, capture the app's thread stacks
          # every 30s so a wedge (blocked C call, starved pool, wedged
          # os_log) can be diagnosed post-mortem from the artifact.
          (
            mkdir -p "$RUNNER_TEMP/samples"
            for i in $(seq 1 40); do
              PID=$(pgrep -x VVTerm | head -1 || true)
              if [ -n "${PID:-}" ]; then
                sample "$PID" 2 -file "$RUNNER_TEMP/samples/sample-$i.txt" >/dev/null 2>&1 || true
              fi
              sleep 30
            done
          ) &
          SPID=$!
          ( sleep 1200 && echo "::error::xcodebuild test exceeded 20m — killed (wedged test runner?)" && kill -9 -"$XPID" 2>/dev/null || true ) &
          WPID=$!
          set +e
          wait "$XPID"
          RC=$?
          set -e
          kill "$WPID" 2>/dev/null || true
          kill "$SPID" 2>/dev/null || true
          # B1 guard (fail-closed): a false `.enabled(if:)` gate (fixture env
          # missing) prints `➜ Suite SSHUploadIntegrationTests skipped.` and
          # leaves xcodebuild at 0, so a bare suite-name grep reports a
          # vacuous green. Require positive executed evidence instead —
          # authoritative from this run's .xcresult bundle, log-shape as the
          # measured fallback — and fail the step otherwise.
          verify_upload_suite_executed() {
            local LOG="$1"
            local BUNDLE="$2"
            local UPLOAD_SUITE="SSHUploadIntegrationTests"
            # 1. The skip marker is exactly the vacuous-green shape.
            if grep -q "Suite ${UPLOAD_SUITE} skipped" "$LOG"; then
              echo "::error::${UPLOAD_SUITE} was skipped — fixture env missing or the .enabled(if:) gate false?"
              exit 1
            fi
            # 2. Positive executed evidence: prefer this run's .xcresult
            #    bundle (authoritative, version-independent) — count the
            #    suite's passed test-case nodes.
            local PASSED=0
            if [ -d "$BUNDLE" ]; then
              PASSED="$(xcrun xcresulttool get test-results tests --path "$BUNDLE" --format json 2>/dev/null \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); w=lambda ns:[x for n in (ns or []) for x in [n]+w(n.get("children"))]; print(sum(1 for n in w(d.get("testNodes")) if n.get("name")=="SSHUploadIntegrationTests" for c in (n.get("children") or []) if c.get("result")=="Passed"))' \
                  2>/dev/null || true)"
              case "${PASSED:-}" in ''|*[!0-9]*) PASSED=0 ;; esac
            fi
            if [ "$PASSED" -ge 3 ]; then
              echo "${UPLOAD_SUITE} executed: ${PASSED} passed test cases (xcresult: ${BUNDLE})"
              return 0
            fi
            # 3. Measured log-shape fallback: require every leg's per-test
            #    pass line — a skipped, crashed, or zero-test run cannot
            #    produce those three lines.
            for LEG in "testExecPreferredUploadRoundTrips()" \
                       "testAutomaticUploadRoundTrips()" \
                       "testExecPreferredUploadToAMissingParentFailsCleanlyAndLeavesTheClientUsable()"; do
              if ! grep -q "✔ Test ${LEG} passed" "$LOG"; then
                echo "::error::${UPLOAD_SUITE} did not execute: no pass line for ${LEG} in ${LOG} (fixture env missing or gate false?)"
                exit 1
              fi
            done
            echo "${UPLOAD_SUITE} executed (log-shape fallback): all 3 legs passed"
          }
          if [ "$RC" -eq 0 ]; then
            verify_upload_suite_executed "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/upload-main.xcresult"
          fi
          exit "$RC"

      - name: Run upload failing-path leg under MallocScribble (issue #291)
        # Leg 3 must be able to fail for the defect it claims to cover:
        # without allocator hardening the second `libssh2_channel_free` is
        # silent heap corruption, and "still usable" would pass on an unfixed
        # build. MallocScribble poisons the freed channel block, so the
        # unfixed tree faults deterministically in the second free; ASan
        # interposes too but needs a full sanitized rebuild in every matrix
        # leg. Runs the whole SSHUploadIntegrationTests suite so legs 1-2 are
        # exercised hardened as well.
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/vvterm-teleport/vvterm-teleport.env"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/vvterm-repro/vvterm-repro.env"
          set +a
          for var in $(compgen -v | grep -E '^VVTERM_(TELEPORT|REPRO_SSH)_' || true); do
            export "TEST_RUNNER_${var}=${!var}"
          done
          export TEST_RUNNER_MallocScribble=1
          xcodebuild test \
            -scheme VVTermUnitTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/upload-hardening.xcresult" \
            -only-testing:VVTermTests/SSHUploadIntegrationTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            IgnoreFileSystemDeviceInodeChanges=YES \
            | tee "$RUNNER_TEMP/upload-hardening.log"
          # Same fail-closed B1 guard as the main test step (identical text):
          # a skipped suite prints the skip marker, and a zero-test/crashed
          # run cannot produce the three per-leg pass lines.
          verify_upload_suite_executed() {
            local LOG="$1"
            local BUNDLE="$2"
            local UPLOAD_SUITE="SSHUploadIntegrationTests"
            # 1. The skip marker is exactly the vacuous-green shape.
            if grep -q "Suite ${UPLOAD_SUITE} skipped" "$LOG"; then
              echo "::error::${UPLOAD_SUITE} was skipped — fixture env missing or the .enabled(if:) gate false?"
              exit 1
            fi
            # 2. Positive executed evidence: prefer this run's .xcresult
            #    bundle (authoritative, version-independent) — count the
            #    suite's passed test-case nodes.
            local PASSED=0
            if [ -d "$BUNDLE" ]; then
              PASSED="$(xcrun xcresulttool get test-results tests --path "$BUNDLE" --format json 2>/dev/null \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); w=lambda ns:[x for n in (ns or []) for x in [n]+w(n.get("children"))]; print(sum(1 for n in w(d.get("testNodes")) if n.get("name")=="SSHUploadIntegrationTests" for c in (n.get("children") or []) if c.get("result")=="Passed"))' \
                  2>/dev/null || true)"
              case "${PASSED:-}" in ''|*[!0-9]*) PASSED=0 ;; esac
            fi
            if [ "$PASSED" -ge 3 ]; then
              echo "${UPLOAD_SUITE} executed: ${PASSED} passed test cases (xcresult: ${BUNDLE})"
              return 0
            fi
            # 3. Measured log-shape fallback: require every leg's per-test
            #    pass line — a skipped, crashed, or zero-test run cannot
            #    produce those three lines.
            for LEG in "testExecPreferredUploadRoundTrips()" \
                       "testAutomaticUploadRoundTrips()" \
                       "testExecPreferredUploadToAMissingParentFailsCleanlyAndLeavesTheClientUsable()"; do
              if ! grep -q "✔ Test ${LEG} passed" "$LOG"; then
                echo "::error::${UPLOAD_SUITE} did not execute: no pass line for ${LEG} in ${LOG} (fixture env missing or gate false?)"
                exit 1
              fi
            done
            echo "${UPLOAD_SUITE} executed (log-shape fallback): all 3 legs passed"
          }
          verify_upload_suite_executed "$RUNNER_TEMP/upload-hardening.log" "$RUNNER_TEMP/upload-hardening.xcresult"

      - name: Save e2e DerivedData cache (even on failure)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/DerivedData
          key: e2e-deriveddata-${{ github.sha }}
          # save-always: persist the build products even though the e2e
          # jobs fail while the M1 bug is open — the next dispatch then
          # recompiles only the changed files.
          save-always: true

      - name: Capture inner handshake diag file
        if: always()
        run: |
          DIAG=$(ls -t /tmp/vvterm-diag-*.txt 2>/dev/null | head -1 || true)
          if [ -n "$DIAG" ]; then
            cp "$DIAG" "$RUNNER_TEMP/vvterm-diag.txt"
            echo "diag file: $DIAG"
            cat "$DIAG"
          else
            echo "no diag file found"
          fi

      - name: Capture simulator logs (diagnostics)
        # os_log from the app under test — NWConnection state, TLS transport
        # logs, sandbox denials. Needed to diagnose runner-side hangs.
        if: always()
        run: |
          set +e
          UDID=$(xcrun simctl list devices booted -j 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print([dev["udid"] for devs in d["devices"].values() for dev in devs if dev["state"]=="Booted"][0])')
          xcrun simctl spawn "$UDID" log show --last 45m \
            --predicate 'processImagePath CONTAINS "VVTerm"' \
            > "$RUNNER_TEMP/sim-vvterm.log" 2>&1 || true
          echo "captured $(wc -l < "$RUNNER_TEMP/sim-vvterm.log") lines"

      - name: Check fixture sshd log presence
        # `if-no-files-found: ignore` is silent when only one of several
        # artifact paths is missing (measured: the upload-hardening.log path
        # was silently absent in a real failure artifact), so make the
        # upload legs' server-side log loud before the uploads. The fixture
        # writes it at $RUNNER_TEMP/vvterm-repro/sshd.log
        # (scripts/ci/repro-sshd-setup.sh:117).
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/vvterm-repro/sshd.log" \
            || echo "::warning::$RUNNER_TEMP/vvterm-repro/sshd.log missing or empty — upload-leg stall attribution will be unavailable"

      - name: Upload teleport logs (always)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: teleport-e2e-${{ matrix.second-factor }}-${{ matrix.session-recording }}-logs
          path: |
            ${{ runner.temp }}/vvterm-teleport/teleport.log
            ${{ runner.temp }}/vvterm-teleport/teleport.yaml
            ${{ runner.temp }}/vvterm-teleport/vvterm-teleport.env
            ${{ runner.temp }}/sim-vvterm.log
            ${{ runner.temp }}/vvterm-repro/sshd.log
            ${{ runner.temp }}/vvterm-diag.txt
          if-no-files-found: ignore

      - name: Upload test results on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: teleport-e2e-${{ matrix.second-factor }}-${{ matrix.session-recording }}-test-results
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/upload-hardening.log
            ${{ runner.temp }}/sim-vvterm.log
            ${{ runner.temp }}/vvterm-repro/sshd.log
            ${{ runner.temp }}/samples
          if-no-files-found: ignore

      - name: Stop Teleport (always)
        if: always()
        run: TELEPORT_WEB_PORT=443 bash scripts/ci/teleport-server.sh stop || true
