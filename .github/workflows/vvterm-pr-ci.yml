# VVTerm PR CI — build + unit/UI tests on iOS Simulator (parallel jobs).
#
# Runs on every PR to main; also dispatchable (see the event-gating note
# below). Jobs:
#   1. build       — compiles the VVTerm app for iOS Simulator (no signing),
#                    then uploads the compiled products as an artifact so the
#                    fan-out ui-tests shards skip recompilation.
#   2. unit-tests  — runs the prebuilt VVTermTests bundle from the build
#                    artifact (`test-without-building`, zero compilation),
#                    and fails a vacuous green via
#                    scripts/ci/assert-unit-tests-ran.sh.
#   3. ui-tests    — matrix of 4 parallel shard jobs (shard-0..shard-3),
#                    each downloading the build artifact and running a
#                    subset of VVTermUITests via -only-testing:. fail-fast
#                    is disabled so one failing shard does not cancel the
#                    others; the 24 TeleportUITests are distributed across
#                    the 4 shards.
#   (The unsigned Release device archive for per-PR OTA distribution —
#   formerly job 4, ota-archive — moved to vvterm-pr-ota.yml. Split out so
#   ios-adhoc-pr's workflow_run trigger fires when the archive is ready
#   (~12 min after push) instead of waiting for this workflow's test
#   shards to complete. This also retires the temporary CAP EXCEPTION:
#   this workflow is back inside the 5-concurrent-macOS-job budget.)
#
# Event gating (issue #315): the per-PR jobs (wait-for-ota-publish,
# unit-tests, ui-tests) are gated to `pull_request` (or an empty-`debug_test`
# dispatch), so a workflow_dispatch
# with `debug_test` set executes exactly `build` + `debug-test` — 2 macOS
# jobs at peak 1 — instead of 7 macOS jobs against the account's
# 5-concurrent-macOS-job cap. `build` stays ungated because `debug-test`
# consumes its `vvterm-build` artifact (#313). An empty `debug_test` keeps
# the documented on-demand mode: the full per-PR matrix (the LPT sampling
# route, e.g. run 35906201179).
#
# Jobs 2 + 3 run in parallel and depend on job 1. This split gives faster
# feedback (unit tests finish first) and isolates UI test failures/hangs
# (which can be slow) from blocking unit test results.
#
# Concurrency-cap-aware shard count:
#   - GitHub Actions caps this repo at 5 concurrent macOS jobs. On a
#     `pull_request` run the build job runs first alone; then unit-tests (1)
#     + 4 ui-tests shards (4) fill the cap with zero queueing. fail-fast is
#     disabled so a failing shard does not cancel the others. (The test jobs
#     are gated to `pull_request` (or an empty-`debug_test` dispatch); see
#     Event gating above.)
#   - The 24 TeleportUITests (Phase 1/2/3 sheet matrices) run against the
#     DEBUG-only TeleportUITestHarness + mock coordinators (no real Safari/
#     Face ID/Teleport server) and are distributed across the 4 shards
#     (3/10/7/4). Each test captures an XCTAttachment(screenshot:)
#     with .keepAlways lifetime.
#
# Build-once-fanout architecture:
#   - The `build` job compiles the app once and uploads Build/Products +
#     Build/Intermediates.noindex from DerivedData; every test consumer runs
#     the prebuilt bundles with `test-without-building` (zero compilation).
#   - Each `ui-tests` shard downloads that artifact into the same
#     -derivedDataPath the build used, so `test-without-building` finds the
#     prebuilt app. Each shard then runs only its assigned tests via
#     `-only-testing:Target/Class/method,...`.
#   - The `unit-tests` job downloads the same artifact and runs
#     `test-without-building -only-testing:VVTermTests` on the prebuilt
#     bundle (zero compilation); its guard requires non-zero XCTest and
#     Swift Testing summary counts (scripts/ci/assert-unit-tests-ran.sh).
#   - Shard split is a measured assignment over the 41-run clean population
#     (issue #248): every attempt-1 `pull_request` run whose four shard logs
#     parse to exactly the 88-method universe at the last `only-testing`
#     change (#236), plus the three #277 TeleportPhaseTransitionUITests
#     (CI-calibrated from run 37252082693, shard-3) and the four #364
#     never-run methods (CI-calibrated from run 37285079610). Per-method
#     medians (n=41; the #277 and #364 methods are
#     calibrations) summed per bin: 611.0 / 612.9 / 681.7 / 615.7 s →
#     max/min 1.1158 ≤ 1.3, so NO rebalance
#     (2026-10-05). The 2026-09-23 five-run LPT split (78 methods, bins
#     527.6/517.8/527.0/527.8 s, max/min 1.02) is superseded; #227's split
#     pair stays co-located in shard-0. The 164 measured shard-jobs carry
#     326.6-796.7 s of setup/overhead (p10-p90 385-652 s; exclusive
#     percentiles, m=n+1), so the observed wall clock is 21.5-37.5 m
#     (median 27.8 m; p25-p75 25.8-30.1 m) against
#     the ≤ 20 m target this refresh does not change. The fixture is
#     `scripts/ci/shard-split-medians.json`, pinned by
#     `VVTermTests/WorkflowShardSplitPinsTests.swift`.
#
# Runner / toolchain:
#   - All jobs run on `xcode-27` (macOS 26 + Xcode 27 public-preview, arm64).
#     `xcode-27-xlarge` was tried first but is blocked by an account
#     spending-limit gate; `xcode-27` uses the same Xcode 27 image without the
#     billing gate, and the 4-shard fan-out compensates for the smaller
#     per-runner core count.
#   - The image defaults to Xcode 27, so no setup-xcode step is needed.
#   - The xcode-27 preview image does NOT ship the Metal toolchain, which
#     mlx-swift Cmlx shaders + libghostty's Metal renderer require. Each job
#     runs `xcodebuild -downloadComponent MetalToolchain` before building.
#     The download takes ~20s per job; caching it across jobs is not practical
#     because it installs into the Xcode toolchain directory (part of the
#     runner image, not a user-cacheable path). The SPM cache key already
#     captures the toolchain version via the `xcode27-spm-` prefix.
#   - SPM cache key is namespaced `xcode27-spm-` to match the new toolchain.
#   - After restoring the SPM/DerivedData cache, a step removes the stale
#     ModuleCache.noindex (PCM) directory. When the runner image updates, SDK
#     header mtimes change and restored .pcm files become stale, producing
#     `fatal error: file '...AvailabilityVersions.h' has been modified since
#     the module file '...pcm' was built`. The PCM rebuild is cheap and
#     deterministic; this keeps SourcePackages + build products cached while
#     avoiding stale-PCM build failures.
#
# What this verifies (CI-able, no device):
#   - the VVTerm app compiles for iOS Simulator
#   - VVTermTests (unit) pass — including the Teleport domain/readiness/
#     device-name/Codable tests
#   - VVTermUITests pass — including the Teleport mock-coordinator test
#     matrices (bootstrap/registration/login/readiness, Face ID outcomes)
#   - XCTAttachment screenshots are uploaded as artifacts for visual review
#
# What this does NOT verify (device-only):
#   - real Face ID prompts (simulator has no Secure Enclave)
#   - real Teleport server connectivity
#   - real Safari/ASWebAuthenticationSession ceremonies
#
# The mock coordinators + mock SEP signer cover the failure-matrix UX in
# the simulator. The device smoke test (per the 2.2 prompt's runtime
# verification checklist item 6) is the final confidence check — the
# installable per-PR build is produced by the `ota-archive` job, which
# lives in vvterm-pr-ota.yml (split out so ios-adhoc-pr's workflow_run
# trigger fires ~12 min after push instead of waiting for the test
# shards).
#
# See:
#   2026-07-23-strategy-b-session2.2-teleport-ui-design.md (CI strategy)
#   cad0p/pcad.it-infra#154 (OTA ad-hoc distribution, short-lived R2 creds)

name: VVTerm PR CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_test:
        description: 'Run a single test with full diagnostics (sysdiagnose, log archive). Leave empty for normal PR CI.'
        required: false
        default: ''
      debug_timeout:
        description: 'Maximum test execution time (seconds) for the debug run.'
        required: false
        default: '600'

permissions:
  contents: read
  actions: read   # wait-for-ota-publish polls OTA/publish runs via the Actions API

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check license headers
        # Phase 0c gate: fails if an AGPL SPDX header appears outside
        # docs/teleport-derived-files.txt, or if a listed file loses its AGPL
        # header. First step of the required build job so a license violation
        # fails before compilation; ~1s, no extra job or macOS slot.
        run: ./scripts/ci/check-license-headers.sh

      # Artifact-dependency gate (issue #316): every in-workflow artifact
      # downloader must have a `needs:` path to the job that uploads the
      # artifact it downloads; a recognized cross-run `run-id:` handoff is the
      # only exclusion. Fail-closed subset YAML parser (no yq/jq/PyYAML);
      # --selftest runs the fixture manifest first. See AGENTS.md (CI
      # Performance Budget) and docs/verification-checklist.md.
      - name: Check artifact dependencies
        run: |
          set -euo pipefail
          command -v python3 >/dev/null || { echo "::error::python3 not found — the artifact-dependency gate needs it"; exit 1; }
          python3 scripts/ci/check-artifact-dependencies.py --selftest
          python3 scripts/ci/check-artifact-dependencies.py

      # Ghostty config acceptance check (issue #247): the generated config
      # fixtures must load through the vendored libghostty with zero
      # diagnostics. The fixture pin test keeps both files byte-identical to
      # ConfigBuilder's output for the canonical inputs, so a key the core
      # rejects reds here in under a second instead of only showing up in the
      # field. No simulator, no build product, no cache (the probe compile is
      # ~0.2 s).
      - name: Check ghostty config against the vendored core
        run: ./scripts/ci/check-ghostty-config.sh scripts/ci/fixtures/ghostty-config/generated-ios.config scripts/ci/fixtures/ghostty-config/generated-macos.config

      - name: Prepare Xcode build (mtimes, caches, Metal toolchain)
        uses: ./.github/actions/prepare-xcode-build
        with:
          deriveddata-key-prefix: xcode27-deriveddata-ct
          deriveddata-restore-keys: xcode27-deriveddata-ct-${{ github.workflow }}-

      - name: Build for iOS Simulator (build-for-testing)
        run: |
          set -euo pipefail

          # build-for-testing (not build) so the artifact includes the test
          # bundles (VVTermTests.xctest + VVTermUITests.xctest) and the
          # .xctestrun manifest. This lets unit-tests use
          # `test-without-building` (zero compilation) and lets ui-tests
          # shards reuse the prebuilt app + test bundles.
          #
          # iPhone 17,arch=arm64 — the libssh2 static lib in Vendor/libssh2/ios-simulator
          # is arm64-only. iPhone 17 exists as a concrete simulator on the iOS 27.0
          # runtime shipped with Xcode 27; arch=arm64 selects the arm64 slice.
          #
          # Ad-hoc sign (CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-) so the
          # sim app embeds com.apple.security.network.client from
          # VVTerm.entitlements. An UNSIGNED sim app has no entitlements and
          # the iOS sim sandbox parks Network.framework connections of
          # unentitled apps in .waiting(.waitingForNetwork) forever — this
          # wedges the network monitor (NWPathMonitor), which gates the
          # terminal's initial connect, so the loopback-SSH fixture tests
          # (zen full-screen, reconnect, keyboard) could never connect. Same
          # reasoning as repro-zmx.yml / teleport-e2e.yml.
          xcodebuild build-for-testing \
            -scheme VVTerm \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            | tee "$RUNNER_TEMP/build.log"

      - name: Isolated-deinit census (#294 standing gate)
        # A new MainActor-isolated class with a compiler-synthesized isolated
        # deinit (`…CfZ`, `__isolated_deallocating_deinit`) fails this step. The
        # #294 sweep marked every existing instance; this converts that one-time
        # acceptance into a standing gate. iOS-Simulator-only: no CI job builds
        # the app for macOS, so the macOS slice relies on the source pins
        # (VVTermTests/*IsolatedDeinitPinsTests.swift) plus the local
        # two-platform oracle run in the #294 PR.
        run: |
          set -euo pipefail
          ./scripts/ci/check-isolated-deinit-census.sh "$RUNNER_TEMP/DerivedData"

      - name: Archive build products
        # Tar Build/Products + Build/Intermediates.noindex. actions/upload-
        # artifact does NOT preserve symlinks inside .app bundles (Frameworks
        # symlinks, etc.), which breaks `test-without-building` ("Cannot launch
        # simulated executable: no file found at .../VVTerm.app"). Tar
        # preserves symlinks + permissions.
        #
        # Intermediates.noindex is still included because trimming it from the
        # artifact is a recorded follow-up (issue #420): every consumer
        # (ui-tests, unit-tests, debug-test) now runs `test-without-building`
        # off the prebuilt products, so no consumer compiles and the
        # intermediate objects are dead weight in transit.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/DerivedData/Build"
          tar -czf "$RUNNER_TEMP/vvterm-build.tar.gz" Products Intermediates.noindex

      - name: Upload build products
        uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
          path: ${{ runner.temp }}/vvterm-build.tar.gz
          retention-days: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

  wait-for-ota-publish:
    # OTA publish gate (unit-tests only). ios-adhoc-pr's sign-and-publish job
    # is created by workflow_run when the OTA archive completes (~9-13m after
    # push), while the 5 test jobs are created at push time — GitHub's FIFO
    # runner queue therefore always placed the publish behind the whole test
    # phase (measured 4-15m queue). Unit-tests (shortest job, off the wall-clock
    # critical path) waits for sign-and-publish to grab the slot the OTA
    # archive freed, so the installable OTA build + comment land ~1m after the
    # archive instead of after the test phase.
    #
    # Graceful degradation: a missing/failed/timed-out OTA or publish run
    # releases unit-tests immediately — tests never hang on the OTA pipeline.
    # A dispatch carries no PR head (`HEAD_SHA` is empty), and `gh run list
    # --commit ""` ignores the empty filter, so the script exits before its
    # first lookup there — measured on the #313 acceptance dispatch (run
    # 36776953839), which resolved an unrelated PR's OTA + publish runs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Per-PR job (issue #315): a debug dispatch (`debug_test` set) must cost only
    # build + debug-test, not the whole per-PR matrix — 7 macOS jobs against the
    # 5-concurrent-macOS-job cap. The second clause preserves the documented
    # empty-input dispatch, which runs the normal per-PR matrix on demand.
    if: github.event_name == 'pull_request' || github.event.inputs.debug_test == ''
    steps:
      - name: Wait for the OTA publish to start
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # On a dispatch `github.event.pull_request.head.sha` is empty, and
          # `gh run list --commit ""` ignores the empty filter (it returns
          # repo-wide PR-event runs) — measured on the #313 acceptance
          # dispatch (run 36776953839, gate log lines 105-108), which bound to
          # an unrelated PR's OTA + publish and released in 10 s only because
          # that foreign publish had already started 38 minutes earlier. Skip
          # outright instead of waiting on a foreign pipeline. No-op on the PR
          # path, where HEAD_SHA is always set.
          if [[ -z "$HEAD_SHA" ]]; then
            echo "::notice::No pull-request head (HEAD_SHA empty) — publish gate skipped."
            exit 0
          fi

          # 1. This push's OTA archive run (vvterm-pr-ota.yml, pull_request event).
          ota_run="$(gh run list --repo "$REPO" --workflow vvterm-pr-ota.yml \
            --event pull_request --commit "$HEAD_SHA" \
            --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -z "$ota_run" ]]; then
            echo "::notice::No VVTerm PR OTA run for $HEAD_SHA — publish gate skipped."
            exit 0
          fi
          echo "OTA archive run: $ota_run"

          # 2. Wait for the archive to reach a terminal state.
          for _ in $(seq 1 240); do
            status="$(gh api "repos/$REPO/actions/runs/$ota_run" --jq '.status' 2>/dev/null || true)"
            [[ "$status" == "completed" ]] && break
            sleep 10
          done
          status="$(gh api "repos/$REPO/actions/runs/$ota_run" --jq '.status' 2>/dev/null || true)"
          if [[ "$status" != "completed" ]]; then
            echo "::warning::OTA archive run $ota_run did not complete within 40m — releasing unit-tests."
            exit 0
          fi
          ota_end="$(gh api "repos/$REPO/actions/runs/$ota_run" --jq '.updated_at' || true)"
          if [[ -z "$ota_end" ]]; then
            echo "::warning::Could not read the OTA archive completion time — releasing unit-tests."
            exit 0
          fi
          echo "OTA archive completed at $ota_end"

          # 3. Find the ios-adhoc-pr run this completion spawned. workflow_run
          #    runs execute on main and carry no PR link (head_sha = main tip,
          #    pull_requests = []), so match by creation window instead.
          publish_run=""
          for _ in $(seq 1 30); do
            publish_run="$(gh run list --repo "$REPO" --workflow ios-adhoc-pr.yml \
              --event workflow_run --limit 100 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$ota_end\")] | sort_by(.createdAt) | .[0].databaseId // empty" || true)"
            [[ -n "$publish_run" ]] && break
            sleep 10
          done
          if [[ -z "$publish_run" ]]; then
            echo "::notice::No ios-adhoc-pr run appeared within 5m of OTA completion — releasing unit-tests."
            exit 0
          fi
          echo "Publish run: $publish_run"

          # 4. Release unit-tests once sign-and-publish has STARTED (it holds
          #    the slot the OTA archive freed; with unit-tests gated it is first
          #    in the runner queue). If the run concludes without starting
          #    (cancelled/failed OTA), release immediately.
          for _ in $(seq 1 90); do
            started="$(gh api "repos/$REPO/actions/runs/$publish_run/jobs" \
              --jq '.jobs[] | select(.name == "sign-and-publish") | .started_at // empty' 2>/dev/null || true)"
            if [[ -n "$started" ]]; then
              echo "sign-and-publish started at $started — releasing unit-tests."
              exit 0
            fi
            conclusion="$(gh api "repos/$REPO/actions/runs/$publish_run" --jq '.conclusion // empty' 2>/dev/null || true)"
            if [[ -n "$conclusion" ]]; then
              echo "::notice::ios-adhoc-pr concluded '${conclusion}' before publishing — releasing unit-tests."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Timed out waiting for sign-and-publish to start — releasing unit-tests."

  unit-tests:
    runs-on: xcode-27
    # Kill cap for a wedged runner, not expected runtime: this job no longer
    # compiles (`test-without-building` off the artifact). Floor = base job
    # wall − the 285.7s compile window: 915s fast base ≈ 10m29s, 976s slow
    # base ≈ 11m30s. On top: artifact download/extract + Metal toolchain
    # ≈ 47s (23+6+18), bounded simulator pre-boot 80s, then the suite. The
    # graded run (run 37802047854) measured 613s (10m13s) wall / 378s test
    # step — 16s under the fast-base floor, so that floor is conservative.
    # Keep 30m:
    # timeout-minutes: 20 was killing the job at the 20m mark exactly when the
    # runner was slow (observed 2026-08-14: every run >20m was cancelled, every
    # run <20m passed — perfect correlation, three consecutive failures on
    # PR #167).
    timeout-minutes: 30
    needs: [build, wait-for-ota-publish]
    # Per-PR job (issue #315): a debug dispatch (`debug_test` set) must cost only
    # build + debug-test, not the whole per-PR matrix — 7 macOS jobs against the
    # 5-concurrent-macOS-job cap. The second clause preserves the documented
    # empty-input dispatch, which runs the normal per-PR matrix on demand.
    if: github.event_name == 'pull_request' || github.event.inputs.debug_test == ''
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build products
        # Same prebuilt-bundle model as the ui-tests shards and debug-test:
        # download the tarball the build job uploaded and extract it into the
        # same -derivedDataPath the build used. Tar preserves the symlinks
        # inside .app bundles that actions/download-artifact would flatten.
        uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          path: ${{ runner.temp }}

      - name: Extract build products
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/DerivedData/Build"
          tar -xzf "$RUNNER_TEMP/vvterm-build.tar.gz" -C "$RUNNER_TEMP/DerivedData/Build"

      - name: Download Metal toolchain
        # The xcode-27 public-preview image does not ship the Metal toolchain.
        # Required by mlx-swift Cmlx shaders + libghostty Metal renderer.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Pre-boot the simulator
        # Mirror scripts/ci/run-ui-tests.sh: boot the destination simulator and
        # bounded-poll until it reports Booted, so the test session never starts
        # against a still-initializing boot (the #43 wedge family). Bounded poll —
        # do NOT use `bootstatus -b` (it can block forever on a wedged
        # CoreSimulator).
        run: |
          set -euo pipefail
          xcrun simctl boot "iPhone 17" >/dev/null 2>&1 || true
          BOOTED=0
          for _ in $(seq 1 60); do
            if xcrun simctl list devices booted 2>/dev/null | grep -q "iPhone 17"; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          if [ "$BOOTED" -ne 1 ]; then
            echo "::warning::iPhone 17 did not report Booted within 120s; continuing (xcodebuild will retry its own boot)."
          fi

      - name: Run unit tests (VVTermTests)
        # The composite prepare-xcode-build action is deliberately NOT used:
        # there is no build, so its source-mtime restore, DerivedData/SPM
        # cache, and stale-PCM clearing are all inert (issue #416).
        run: |
          set -euo pipefail

          # `test-without-building` off the artifact's .xctestrun manifest: the
          # shard model, with ZERO compilation. The Xcode-27 duplicate-symbol
          # crash that blocked this form (the test bundle and app host both
          # statically link SwiftProtobuf) is measured gone — dispatch
          # 37787530259's debug-test ran test-without-building off the
          # extracted artifact and passed (recorded on #42, comment 6061888842).
          #
          # Flag delta from the former build-and-test invocation:
          # CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- and
          # IgnoreFileSystemDeviceInodeChanges=YES were BUILD settings — inert
          # under `test-without-building` because no build runs. The precedent
          # jobs (ui-tests, debug-test) pass CODE_SIGNING_ALLOWED=NO with the
          # prebuilt artifact; pass it explicitly here too.
          #
          # -test-timeouts-enabled + 180s execution allowance: a hanging test
          # is KILLED and recorded as a failure BY NAME ("Exceeded execution
          # time allowance") instead of running to the 30m job timeout with no
          # per-test attribution. Same policy as the UI shards: treat any such
          # failure as a hang to fix or quarantine, not as a slow test.
          # Placement matters: `-parallel-testing-enabled` consumes a following
          # `-option` token as its value, so the timeout flags must precede it.
          #
          # `-collect-test-diagnostics never`: a diagnostics timeout occurs even
          # on a fully green run (#251) — the suites finish, then collection
          # waits 600 s for a simulator response that never arrives. Full
          # diagnostics stay available through the `debug-test` dispatch input.
          #
          # `-only-testing:VVTermTests` (no slash) selects exactly the
          # VVTermTests bundle's XCTest and Swift Testing tests. The next step
          # guards against a filter that resolves to an empty test set while
          # xcodebuild still exits 0.
          rm -rf "$RUNNER_TEMP/TestResults.xcresult"
          XCRUN=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name '*.xctestrun' | sort | head -1)
          echo "Using xctestrun manifest: $XCRUN"
          xcodebuild test-without-building -collect-test-diagnostics never \
            -xctestrun "$XCRUN" \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -only-testing:VVTermTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test.log"

      - name: Assert tests actually ran
        # Count-based vacuous-green guard (issue #416): a filter/target
        # mismatch can make xcodebuild exit 0 having executed zero tests.
        # Requires BOTH the XCTest and the Swift Testing summary with non-zero
        # counts; fails closed if either is absent or unparseable.
        run: bash scripts/ci/assert-unit-tests-ran.sh "$RUNNER_TEMP/test.log"

      - name: Upload test results
        # always(): keep TestResults.xcresult + test.log from green runs too,
        # matching the UI-shard idiom.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore

  ui-tests:
    # Explicit stable name: without it the check-run name is rendered from
    # ALL matrix values (name, needs-fixture, and the full only-testing
    # list, truncated at ~79 chars), so it changes on every shard
    # rebalance. The stable name keeps each shard's check-run identifiable
    # in the PR's check list; the shards are not required checks (AGENTS.md).
    name: ui-tests-${{ matrix.shard.name }}
    runs-on: xcode-27
    # Kill cap for wedged shards, not expected runtime: setup ~2m + one
    # ~13m shard run ≈ 15m expected. 45m leaves slack for a session-level
    # wedge that would otherwise hang; the per-test 300s allowance
    # (-test-timeouts-enabled YES, see the Run UI tests step) catches
    # single hanging tests.
    timeout-minutes: 45
    needs: build
    # Per-PR job (issue #315): a debug dispatch (`debug_test` set) must cost only
    # build + debug-test, not the whole per-PR matrix — 7 macOS jobs against the
    # 5-concurrent-macOS-job cap. The second clause preserves the documented
    # empty-input dispatch, which runs the normal per-PR matrix on demand.
    if: github.event_name == 'pull_request' || github.event.inputs.debug_test == ''
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    strategy:
      fail-fast: false
      matrix:
        shard:
          # 4 UI shards + unit-tests = 5 jobs, fitting GitHub's
          # 5-concurrent-macOS-job cap with ZERO queueing (per PR #41).
          # fail-fast is disabled so one failing shard does not cancel others.
          #
          # Shard split is a measured assignment over the 41-run clean
          # population (issue #248): every attempt-1 `pull_request` run whose
          # four `ui-tests-shard-*` jobs all succeeded and whose four shard
          # logs parse to exactly the 88-method universe at the last
          # `only-testing` change (#236), plus the three #277
          # TeleportPhaseTransitionUITests (CI-calibrated from run 37252082693,
          # shard-3) and the four #364 never-run methods (CI-calibrated from
          # run 37285079610). Per-method medians (n=41; the #277
          # and #364 methods are calibrations) summed per bin: shard-0 611.0 s
          # (23 methods) / shard-1 612.9 s (24) / shard-2 681.7 s (24) /
          # shard-3 615.7 s (24) → max/min 1.1158 ≤ 1.3 → NO rebalance
          # (2026-10-05). The 2026-09-23
          # five-run LPT split (78 methods, bins 527.6/517.8/527.0/527.8 s,
          # max/min 1.02) is superseded. The normative trigger metric is the
          # per-bin SUM OF PER-METHOD MEDIANS over the qualifying population;
          # single-run and job-wall ratios are diagnostic only. LPT over the
          # same 88-method population would reach 1.0012 but moves 67/88
          # methods, and the observed per-run distribution (median 1.459,
          # 33/41 runs > 1.3) is dominated by run-level host variance —
          # recorded, not adopted; the acceptance's structural branch decides.
          # Refresh procedure: re-enumerate the population, re-extract the
          # `Test Case '-[...]' passed (N seconds)` lines, LPT-repack only if
          # max/min > ~1.3, then update `scripts/ci/shard-split-medians.json`,
          # the pinned 1 dp literals in
          # `VVTermTests/WorkflowShardSplitPinsTests.swift`, and this comment
          # in the same PR. The empty-`debug_test` dispatch (issue #315) is
          # the preserved on-demand mode and the sampling route.
          #
          # #227 split the push/pop test into list-position + session halves,
          # both kept in shard-0 so they share one app launch (and one static
          # `sharedApp`). 13 loopback-SSH-fixture-gated tests (4/3/3/3 across
          # the bins) mean every bin is non-empty, so all four set
          # needs-fixture: true. Which declared tests are deliberately not
          # listed, and why, is the declared-vs-scheduled allowlist contract:
          # assertions 7-8 in
          # `VVTermTests/WorkflowShardSplitPinsTests.swift` enforce that every
          # declared test is scheduled or carries a reasoned exemption row in
          # `scripts/ci/ui-test-allowlist.json`. Do not restate counts here;
          # the pin and the ledger are the source of truth.
          # Each entry's `only-testing` is a comma-separated list of
          # Target/Class/method — no spaces.
          #
          # The 24 TeleportUITests (mock-driven; measured 15-26s each, not the
          # ~5-10s an earlier split assumed) are distributed across the 4 shards
          # (3/10/7/4) rather than a 5th, preserving the 5-job cap. The 300s
          # per-test allowance has thin headroom: the largest 41-run sample is
          # 274.228s (ServerNavigationUITests.
          # testActiveTerminalPushPopPreservesListPosition, 91.4% of 300s),
          # then 264.594/256.121/244.008/220.380s; fix-or-quarantine stays on
          # #349/#264/#257.
          #
          # The 3 TeleportPhaseTransitionUITests are scheduled in shard-3
          # (2026-10-05, #277): the readiness-pill query was migrated from
          # `staticTexts` (the `PillBadge` `.ignore` container surfaces the
          # element as `Other`) and the harness's mock now parks in
          # `.awaitingApproval` until the test taps the release control, so
          # neither phase-1 test depends on a ~100 ms transient. Medians from
          # run 37252082693's shard-3 job (2026-10-05, attempt 1, head
          # d94ba433; the local 3-run seed was superseded): 16.404 / 17.071 /
          # 15.095 s (shard-3 sum then 613.9 s, max/min then 1.1123).
          #
          # The four #364 never-run methods (2026-10-05) are calibrated from
          # run 37285079610 (head 5a63da95, attempt 1, shard-0 job 111683892596 /
          # shard-3 job 111683892669): the same-screen, software-toolbar and
          # zen-launcher methods in shard-0 (17.837 / 21.948 / 15.763 s) and
          # the docked-accessory method in shard-3 (17.535 s). The dispatch
          # seeds (runs 37269132486 + 37272070374) are recorded under
          # `_provenance.calibration.superseded` in `scripts/ci/shard-split-medians.json`.
          - name: shard-0
            needs-fixture: true
            only-testing: "VVTermUITests/ServerNavigationUITests/testActiveTerminalPushPopPreservesListPosition,VVTermUITests/ServerNavigationUITests/testActiveTerminalPushPopPreservesSession,VVTermUITests/TerminalKeyboardUITests/testIMECompositionStopsPrintableHardwareKeyRepeat,VVTermUITests/NoticePresentationUITests/testConnectionFailureCloseExposesNavigationWithoutRetrying,VVTermUITests/NoticePresentationUITests/testDisconnectedSheetSupportsSwipeDismissalAndKeepsReconnect,VVTermUITests/TerminalLinkTapUITests/testDoubleTapStillSelectsWord,VVTermUITests/TerminalLinkTapUITests/testOSC8LinkTapPresentsConfirmationAlert,VVTermUITests/TerminalKeyboardUITests/testHardwareKeyboardAttachmentHidesAccessoryFromExistingSoftwareSession,VVTermUITests/TerminalKeyboardUITests/testBackgroundLifecycleStopsPrintableHardwareKeyRepeat,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_needsLogin_tapShowsLoginSheet,VVTermUITests/TerminalKeyboardUITests/testTouchingTerminalRequestsPaneFocus,VVTermUITests/TerminalZenModeUITests/testFullScreenZenConnectionBannerSitsBelowNotch,VVTermUITests/NoticePresentationUITests/testConnectionFailureUsesBottomSheetWithLargePrimaryAction,VVTermUITests/TerminalZenModeUITests/testDefaultToZenEntersZenAutomaticallyAndTerminalCoversScreen,VVTermUITests/TeleportUITests/testLogin_happyPath12h_showsSuccessCopyWith12hValidity,VVTermUITests/TeleportUITests/testBootstrap_suspended_showsReconnectingThenSucceedsOnRetry,VVTermUITests/TeleportReadinessUITests/testReadiness_needsRegistration_tapShowsBootstrapSheetNotRegistration,VVTermUITests/NoticePresentationUITests/testFirstUseHostKeyShowsTrustAffordance,VVTermUITests/TeleportReadinessUITests/testReadiness_ready_tapConnectsDirectly,VVTermUITests/TeleportUITests/testBootstrap_happyPath_showsSuccessCopy,VVTermUITests/TerminalKeyboardUITests/testSameScreenForeignKeyboardDoesNotReclaimTerminalAccessory,VVTermUITests/TerminalKeyboardUITests/testSoftwareToolbarAndCustomShortcutCombinationsUseAppRouting,VVTermUITests/TerminalZenModeUITests/testRealTerminalLauncherOpensZenPanel"
          - name: shard-1
            needs-fixture: true
            only-testing: "VVTermUITests/TerminalReconnectUITests/testProductionSSHBackgroundPreservesSessionKeyboardAndTyping,VVTermUITests/StatsCardsLayoutUITests/testDetailedCardsRemainContainedAcrossWideNarrowAndWideTransitions,VVTermUITests/TerminalKeyboardUITests/testRepeatedTerminalReconstructionKeepsRenderingAndInputResponsive,VVTermUITests/NoticePresentationUITests/testDiagnosticBannerExpandsCopiesScrollsAndDismisses,VVTermUITests/TerminalKeyboardUITests/testSplitPaneShortcutsRouteWithoutReachingTerminalInput,VVTermUITests/TerminalReconnectUITests/testColdRelaunchRestoresTabsSplitsSelectionAndReconnects,VVTermUITests/TerminalKeyboardUITests/testKeyboardIsScopedToTerminalSurface,VVTermUITests/TerminalKeyboardUITests/testPreservedTerminalGridMovesCursorAboveKeyboard,VVTermUITests/TerminalKeyboardUITests/testDirectTouchDoesNotClickOutsideMouseCapture,VVTermUITests/TeleportUITests/testRegistration_emptyDeviceName_disablesContinueButton,VVTermUITests/TerminalZenModeUITests/testZenLauncherCircleIsFullyTappable,VVTermUITests/TerminalZenModeUITests/testFullScreenZenAutoShiftsInitialPromptBelowNotch,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_needsRegistration_tapShowsBootstrapSheetNotRegistration,VVTermUITests/TeleportReadinessUITests/testReadiness_needsBootstrap_tapShowsBootstrapSheet,VVTermUITests/TeleportUITests/testRegistration_alreadyExists_showsInlineErrorCopy,VVTermUITests/TeleportUITests/testLogin_serverUnreachable_showsNetworkLostCopy,VVTermUITests/TeleportUITests/testBootstrap_networkLost_showsNetworkConnectionLostCopy,VVTermUITests/TeleportUITests/testRegistration_invalidChars_showsPrefilledSanitizedName,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_ready_tapConnectsDirectly,VVTermUITests/TeleportUITests/testHostLogin_multiplePrincipals_pickerSelectsAndContinues,VVTermUITests/TeleportUITests/testHostLogin_singlePrincipal_isShownAndContinues,VVTermUITests/TeleportUITests/testHostLogin_storedLogin_noReLoginPicker,VVTermUITests/TeleportUITests/testHostLogin_emptyPrincipals_showsSetupError,VVTermUITests/TeleportUITests/testHostLogin_pickerCancel_storesNothing"
          - name: shard-2
            needs-fixture: true
            only-testing: "VVTermUITests/TerminalReconnectUITests/testProductionCodexFindKeyboardMenuRestoresPTYTyping,VVTermUITests/StatsCardsLayoutUITests/testLockedDockerCardRemainsContainedAfterRepeatedRotation,VVTermUITests/StatsStorageUITests/testBrowsingSwipeEditVisibilityAndHealthStates,VVTermUITests/TerminalKeyboardUITests/testCommandPlusAndMinusZoomWithoutReachingTerminalInput,VVTermUITests/TerminalReconnectUITests/testProductionSSHBackgroundPreservesDarkAccessoryAppearance,VVTermUITests/NoticePresentationUITests/testInactiveSplitPaneCannotPresentConnectionBanner,VVTermUITests/TerminalZenModeUITests/testMenuEntryHidesChromeAndFloatingControlRestoresIt,VVTermUITests/TerminalKeyboardUITests/testHardwareKeyboardDetachStopsPrintableHardwareKeyRepeat,VVTermUITests/TerminalKeyboardUITests/testIMEProxyMarkedTextDeleteAndCommitPath,VVTermUITests/TerminalZenModeUITests/testZenPanelShareDiagnosticsButtonTriggersHandler,VVTermUITests/TerminalZenModeUITests/testFullScreenZenOverscrollShiftsContentPastTopEdgeAndResets,VVTermUITests/TerminalKeyboardUITests/testHardwareKeyboardFocusSuppressesAccessoryBar,VVTermUITests/TeleportReadinessUITests/testReadiness_needsLogin_tapShowsLoginSheet,VVTermUITests/TeleportUITests/testRegistration_happyPath_showsFormAndContinueSucceeds,VVTermUITests/TeleportUITests/testLogin_faceIDCancelled_showsFaceIDCancelledCopy,VVTermUITests/TeleportUITests/testLogin_serverError_showsTheServerMessageVerbatim,VVTermUITests/TeleportReadinessUITests/testReadiness_crossDevice_iCloudSync_showsNeedsBootstrap,VVTermUITests/TeleportUITests/testLogin_certExpiredOnTap_showsSuccessCopyWithNewTTL,VVTermUITests/TeleportUITests/testLogin_happyPath1h_showsSuccessCopyWith1hValidity,VVTermUITests/TeleportUITests/testBootstrap_safariUnavailable_showsManualLinkCopy,VVTermUITests/TeleportUITests/testBootstrap_userCancelled_showsSetupCancelledCopy,VVTermUITests/TeleportFormUITests/testAddMode_faceIDTeleport_showsTeleportFieldCopy,VVTermUITests/TeleportFormUITests/testEditMode_teleportServer_showsTeleportCaptions,VVTermUITests/TeleportReadinessIOSUITests/testBootstrap_swipeDismissDuringRetry_cancelsTheFlow"
          - name: shard-3
            needs-fixture: true
            only-testing: "VVTermUITests/StatsCardsLayoutUITests/testCompactCardsRemainContainedAcrossWideNarrowAndWideTransitions,VVTermUITests/ServerNavigationUITests/testBackgroundReturnPreservesSessionKeyboardAndBackResponsiveness,VVTermUITests/TerminalReconnectUITests/testProductionCodexModesKeepKeyboardAndPTYTyping,VVTermUITests/NoticePresentationUITests/testConcurrentOperationsStackAboveBottomToolbar,VVTermUITests/TerminalKeyboardUITests/testDockedFloatingDockedGeometryKeepsSurfaceAndViewportValid,VVTermUITests/TerminalKeyboardUITests/testRepeatedFocusTapsKeepDefaultKeyboardAndLayoutStable,VVTermUITests/NoticePresentationUITests/testInitialConnectionBannerYieldsToTmuxSelectionSheet,VVTermUITests/TerminalKeyboardUITests/testPaneCloseAlertRestoresTerminalFocusAfterCancel,VVTermUITests/NoticePresentationUITests/testHostKeyFailureRetainsCloseAndTrustActions,VVTermUITests/TerminalZenModeUITests/testFullScreenZenKeyboardOpenPreservesGridAndKeepsContentVisible,VVTermUITests/TerminalScreenAwakeUITests/testTerminalSettingControlsIdleTimerAndRestoresAfterBackground,VVTermUITests/NoticePresentationUITests/testRetryFromDismissedBannerCanPresentANewFailure,VVTermUITests/NoticePresentationUITests/testInitialConnectionUsesNonBlockingTopBanner,VVTermUITests/TeleportUITests/testRegistration_cancelBetweenSafariTrips_showsFormAfterCancel,VVTermUITests/TeleportUITests/testLogin_faceIDUnavailable_showsFaceIDUnavailableCopy,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_crossDevice_iCloudSync_showsNeedsBootstrap,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_needsBootstrap_tapShowsBootstrapSheet,VVTermUITests/NoticePresentationUITests/testFilesOperationNoticeRemainsVisibleOnPushedPreview,VVTermUITests/TeleportUITests/testBootstrap_serverError_showsServerMessageVerbatim,VVTermUITests/TeleportUITests/testBootstrap_timeout_showsApprovalTimedOutCopy,VVTermUITests/TeleportPhaseTransitionUITests/testPhase1BootstrapSuccess_transitionsToRegistrationSheet,VVTermUITests/TeleportPhaseTransitionUITests/testPhase1BootstrapSuccess_doesNotReRunBootstrap,VVTermUITests/TeleportPhaseTransitionUITests/testPhase2RegistrationSuccess_transitionsToLoginSheet,VVTermUITests/TerminalKeyboardUITests/testDockedAccessoryUsesOwningTerminalDarkAppearance"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore source mtimes
        # Git does not store file mtimes; `actions/checkout` writes files
        # with the clone timestamp. Restore each file's mtime to its
        # last-commit time for consistency across runs.
        uses: chetan/git-restore-mtime-action@v2

      - name: Download build products
        # Download the tarball from the build job and extract it into the
        # same -derivedDataPath the build used. Tar preserves the symlinks
        # inside .app bundles that actions/download-artifact would flatten.
        uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          path: ${{ runner.temp }}

      - name: Extract build products
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/DerivedData/Build"
          tar -xzf "$RUNNER_TEMP/vvterm-build.tar.gz" -C "$RUNNER_TEMP/DerivedData/Build"

      - name: Download Metal toolchain
        # The xcode-27 public-preview image does not ship the Metal toolchain.
        # Required by mlx-swift Cmlx shaders + libghostty Metal renderer.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install xcparse
        # Install xcparse to extract XCTAttachment screenshots from the
        # xcresult bundle. `xcrun xcresulttool export attachments` produces
        # no PNGs when tests run with -parallel-testing-enabled (parallel
        # testing creates separate simulator clones whose attachments don't
        # aggregate into the main xcresult). xcparse also handles the Xcode 11+
        # nested xcresult format more robustly than xcresulttool.
        run: brew install chargepoint/xcparse/xcparse

      - name: Provision loopback SSH fixture (fixture shards only)
        # Boots a pubkey-only sshd on 127.0.0.1:22232 and writes
        # $RUNNER_TEMP/vvterm-repro/vvterm-repro.env with the fixture vars.
        # The simulator shares the runner loopback, so the app's terminal
        # can SSH into it like the dev-seeded local fixture. Only the shards
        # whose tests drive real connections (zen full-screen, reconnect,
        # server navigation) pay this ~10s cost.
        if: matrix.shard.needs-fixture
        run: bash scripts/ci/repro-sshd-setup.sh

      - name: Run UI tests (shard ${{ matrix.shard.name }})
        shell: bash
        run: |
          bash scripts/ci/run-ui-tests.sh \
            "${{ matrix.shard.name }}" \
            "${{ matrix.shard.needs-fixture }}" \
            "${{ matrix.shard.only-testing }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.shard.name }}
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore

      - name: Extract + upload screenshots
        # UserAttachmentLifetime + SystemAttachmentLifetime are set to
        # 'keepAlways' in the xctestrun (see Run UI tests step), so
        # XCTAttachment screenshots survive into the xcresult bundle even
        # when tests pass. Parallel testing writes a single merged xcresult
        # at -resultBundlePath (no merge step needed). Extract the PNGs with
        # `xcparse screenshots` so they're viewable as artifacts. Also search
        # for loose files as a fallback.
        if: always()
        run: |
          set +e
          export_dir="$RUNNER_TEMP/screenshots"
          mkdir -p "$export_dir"
          # Extract XCTAttachment screenshots from the xcresult bundle.
          if [ -d "$RUNNER_TEMP/TestResults.xcresult" ]; then
            xcparse screenshots \
              "$RUNNER_TEMP/TestResults.xcresult" \
              "$export_dir" 2>/dev/null
            echo "xcparse exit: $?"
          fi
          echo "=== Extracted files ==="
          find "$export_dir" -type f 2>/dev/null | head -30 || true
          echo "=== Searching simulator containers ==="
          find ~/Library/Developer/CoreSimulator/Devices -name 'setUp-marker.txt' 2>/dev/null | head -10 || true
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-screenshots-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  # Debug job: run a single test with full diagnostics (sysdiagnose, log
  # archive) for investigating flakes. Trigger via workflow_dispatch with
  # the `debug_test` input set to the test identifier (e.g.
  # `VVTermUITests/StatsCardsLayoutUITests/testDetailedCards...`).
  #
  # This job runs OUTSIDE the normal PR CI path (only on workflow_dispatch
  # with debug_test set). Since #315 the per-PR jobs (wait-for-ota-publish,
  # unit-tests, ui-tests) are gated to `pull_request` (or an empty-`debug_test`
  # dispatch), so a debug dispatch
  # executes exactly `build` + `debug-test` — 2 macOS jobs at peak 1 — and
  # skips the per-PR matrix. It uses `-collect-test-diagnostics on-failure` to
  # capture the full simulator diagnostics that the normal CI path skips
  # (which saves ~10m per failed shard). Use this when a flake needs
  # deeper investigation than the xcresult + test.log provide.
  #
  # `on-failure` and `never` are the ONLY values xcodebuild accepts for that
  # option: anything else fails the step in ~1s with "option
  # -collect-test-diagnostics requires one of two values: on-failure or
  # never", before a single test runs. This job shipped with `always` — not a
  # value — from its introduction (#33) until the #313 acceptance run reached
  # the step for the first time and exposed it (issue #319). `on-failure` is
  # this job's semantics (it is dispatched to investigate a failure); the
  # normal CI path passes `never` deliberately (#251).
  #
  # It downloads the `vvterm-build` artifact that the `build` job uploads
  # from THIS run, so it depends on that job (issue #313: without the
  # dependency a dispatch starts both jobs together and the download raced
  # the upload — run 36727783272's download failed at 14:16:45Z, ~9 minutes
  # before the upload even started).
  debug-test:
    runs-on: xcode-27
    timeout-minutes: 45
    # `always()` keeps this job (and its guard step) running when `build`
    # fails, so the failure is legible instead of a silent skip;
    # `!cancelled()` stops a superseded run from starting a 45-minute
    # diagnostic.
    needs: build
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.debug_test != ''
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      # First step, so a missing artifact is reported by name instead of
      # surfacing as a bare download failure (#313).
      - name: Require the build artifact (#313)
        if: needs.build.result != 'success'
        run: |
          echo "::error::debug-test requires the vvterm-build artifact from the build job, but build concluded '${{ needs.build.result }}'. Nothing was downloaded and no test ran (issue #313)."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Xcode build (mtimes, caches, Metal toolchain)
        uses: ./.github/actions/prepare-xcode-build
        with:
          deriveddata-key-prefix: xcode27-deriveddata-ct
          deriveddata-restore-keys: xcode27-deriveddata-ct-${{ github.workflow }}-

      - name: Download build products
        uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          path: ${{ runner.temp }}

      - name: Extract build products
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/DerivedData/Build"
          tar -xzf "$RUNNER_TEMP/vvterm-build.tar.gz" -C "$RUNNER_TEMP/DerivedData/Build"

      - name: Install xcparse
        run: brew install chargepoint/xcparse/xcparse

      - name: Run single test with full diagnostics
        run: |
          set -euo pipefail
          XCRUN=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name '*.xctestrun' | head -1)
          echo "Using xctestrun manifest: $XCRUN"

          export SCREENSHOT_DIR="$RUNNER_TEMP/screenshots"
          mkdir -p "$SCREENSHOT_DIR"
          python3 - "$XCRUN" "$SCREENSHOT_DIR" <<'PY'
          import plistlib, sys
          path, screenshot_dir = sys.argv[1], sys.argv[2]
          with open(path, "rb") as f:
              data = plistlib.load(f)
          for cfg in data.get("TestConfigurations", []):
              for target in cfg.get("TestTargets", []):
                  env = target.setdefault("EnvironmentVariables", {})
                  env["SCREENSHOT_DIR"] = screenshot_dir
                  target["UserAttachmentLifetime"] = "keepAlways"
                  target["SystemAttachmentLifetime"] = "keepAlways"
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          PY

          # Explicit values and option-before-option ordering: a bare
          # `-parallel-testing-enabled` can absorb the following option token
          # (the same defect fixed in the shard invocation), silently
          # disabling the diagnostics/timeout flags this job exists for.
          # Parallel testing is OFF here too: this job exists to capture full
          # per-test diagnostics in the log, and parallel mode routes them into
          # the xcresult instead.
          #
          # `-collect-test-diagnostics on-failure`: `on-failure` and `never`
          # are the only accepted values — `always` is not one, and shipped
          # here until issue #319. Do not add a `#` comment inside the
          # backslash-continued invocation below: the continuation joins the
          # lines before comment processing, so it would comment out every
          # flag after it.
          xcodebuild test-without-building \
            -xctestrun "$XCRUN" \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -only-testing:"${{ github.event.inputs.debug_test }}" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics on-failure \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance ${{ github.event.inputs.debug_timeout }} \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test.log"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore

      - name: Extract + upload screenshots
        if: always()
        run: |
          set +e
          export_dir="$RUNNER_TEMP/screenshots"
          mkdir -p "$export_dir"
          if [ -d "$RUNNER_TEMP/TestResults.xcresult" ]; then
            xcparse screenshots \
              "$RUNNER_TEMP/TestResults.xcresult" \
              "$export_dir" 2>/dev/null
          fi
          find "$export_dir" -type f 2>/dev/null | head -30 || true
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-test-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

