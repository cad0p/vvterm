# VVTerm PR CI — build + unit/UI tests on iOS Simulator (parallel jobs).
#
# Runs on every PR to main. Jobs:
#   1. build       — compiles the VVTerm app for iOS Simulator (no signing),
#                    then uploads the compiled products as an artifact so the
#                    fan-out ui-tests shards skip recompilation.
#   2. unit-tests  — runs VVTermTests (fast, pure logic). Downloads the
#                    build artifact so it reuses the prebuilt app + SPM deps
#                    and only compiles the VVTermTests target.
#   3. ui-tests    — matrix of 4 parallel shard jobs (shard-0..shard-3),
#                    each downloading the build artifact and running a
#                    subset of VVTermUITests via -only-testing:. fail-fast
#                    is disabled so one failing shard does not cancel the
#                    others; the 18 TeleportUITests are distributed across
#                    the 4 shards.
#   (The unsigned Release device archive for per-PR OTA distribution —
#   formerly job 4, ota-archive — moved to vvterm-pr-ota.yml. Split out so
#   ios-adhoc-pr's workflow_run trigger fires when the archive is ready
#   (~12 min after push) instead of waiting for this workflow's test
#   shards to complete. This also retires the temporary CAP EXCEPTION:
#   this workflow is back inside the 5-concurrent-macOS-job budget.)
#
# Jobs 2 + 3 run in parallel and depend on job 1. This split gives faster
# feedback (unit tests finish first) and isolates UI test failures/hangs
# (which can be slow) from blocking unit test results.
#
# Concurrency-cap-aware shard count:
#   - GitHub Actions caps this repo at 5 concurrent macOS jobs. The build
#     job runs first alone; then unit-tests (1) + 4 ui-tests shards (4)
#     fill the cap with zero queueing. fail-fast is disabled so a failing
#     shard does not cancel the others.
#   - The 18 TeleportUITests (Phase 1/2/3 sheet matrices) run against the
#     DEBUG-only TeleportUITestHarness + mock coordinators (no real Safari/
#     Face ID/Teleport server) and are distributed across the 4 shards
#     (~4-5 per shard). Each test captures an XCTAttachment(screenshot:)
#     with .keepAlways lifetime.
#
# Build-once-fanout architecture:
#   - The `build` job compiles the app once and uploads Build/Products +
#     Build/Intermediates.noindex from DerivedData (ui-tests uses
#     test-without-building; unit-tests reuses the compiled SPM
#     intermediates instead of rebuilding swift-nio/MLX from scratch).
#   - Each `ui-tests` shard downloads that artifact into the same
#     -derivedDataPath the build used, so `xcodebuild test` finds the prebuilt
#     app and skips compilation. Each shard then runs only its assigned tests
#     via `-only-testing:Target/Class/method,...`.
#   - The `unit-tests` job downloads the same artifact, so it reuses the
#     prebuilt app + Cmlx/mlx-swift deps and only compiles the VVTermTests
#     target (fast), then runs the 577 tests (~7s).
#   - Shard split is LPT bin-packing of measured per-method runtimes from
#     the five successful 2026-09-23 runs. At measurement time 78 executing
#     methods were distributed 19/19/20/20; bin sums 527.6/517.8/527.0/527.8 s
#     (max/min 1.02). #227 has since split the push/pop test into a
#     list-position half and a session half, both in shard-0 (79 executing
#     methods, 20/19/20/20) so the two halves share one app launch; the bin
#     sums above predate that split and are refreshed by the next ≥3-clean-run
#     re-measurement. 525 s of test time + ~322 s of setup ≈ 14m/shard, so
#     the wall clock is build + slowest shard ≈ 17m median.
#
# Runner / toolchain:
#   - All jobs run on `xcode-27` (macOS 26 + Xcode 27 public-preview, arm64).
#     `xcode-27-xlarge` was tried first but is blocked by an account
#     spending-limit gate; `xcode-27` uses the same Xcode 27 image without the
#     billing gate, and the 4-shard fan-out compensates for the smaller
#     per-runner core count.
#   - The image defaults to Xcode 27, so no setup-xcode step is needed.
#   - The xcode-27 preview image does NOT ship the Metal toolchain, which
#     mlx-swift Cmlx shaders + libghostty's Metal renderer require. Each job
#     runs `xcodebuild -downloadComponent MetalToolchain` before building.
#     The download takes ~20s per job; caching it across jobs is not practical
#     because it installs into the Xcode toolchain directory (part of the
#     runner image, not a user-cacheable path). The SPM cache key already
#     captures the toolchain version via the `xcode27-spm-` prefix.
#   - SPM cache key is namespaced `xcode27-spm-` to match the new toolchain.
#   - After restoring the SPM/DerivedData cache, a step removes the stale
#     ModuleCache.noindex (PCM) directory. When the runner image updates, SDK
#     header mtimes change and restored .pcm files become stale, producing
#     `fatal error: file '...AvailabilityVersions.h' has been modified since
#     the module file '...pcm' was built`. The PCM rebuild is cheap and
#     deterministic; this keeps SourcePackages + build products cached while
#     avoiding stale-PCM build failures.
#
# What this verifies (CI-able, no device):
#   - the VVTerm app compiles for iOS Simulator
#   - VVTermTests (unit) pass — including the Teleport domain/readiness/
#     device-name/Codable tests
#   - VVTermUITests pass — including the Teleport mock-coordinator test
#     matrices (bootstrap/registration/login/readiness, Face ID outcomes)
#   - XCTAttachment screenshots are uploaded as artifacts for visual review
#
# What this does NOT verify (device-only):
#   - real Face ID prompts (simulator has no Secure Enclave)
#   - real Teleport server connectivity
#   - real Safari/ASWebAuthenticationSession ceremonies
#
# The mock coordinators + mock SEP signer cover the failure-matrix UX in
# the simulator. The device smoke test (per the 2.2 prompt's runtime
# verification checklist item 6) is the final confidence check — the
# installable per-PR build is produced by the `ota-archive` job, which
# lives in vvterm-pr-ota.yml (split out so ios-adhoc-pr's workflow_run
# trigger fires ~12 min after push instead of waiting for the test
# shards).
#
# See:
#   2026-07-23-strategy-b-session2.2-teleport-ui-design.md (CI strategy)
#   cad0p/pcad.it-infra#154 (OTA ad-hoc distribution, short-lived R2 creds)

name: VVTerm PR CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_test:
        description: 'Run a single test with full diagnostics (sysdiagnose, log archive). Leave empty for normal PR CI.'
        required: false
        default: ''
      debug_timeout:
        description: 'Maximum test execution time (seconds) for the debug run.'
        required: false
        default: '600'

permissions:
  contents: read
  actions: read   # wait-for-ota-publish polls OTA/publish runs via the Actions API

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check license headers
        # Phase 0c gate: fails if an AGPL SPDX header appears outside
        # docs/teleport-derived-files.txt, or if a listed file loses its AGPL
        # header. First step of the required build job so a license violation
        # fails before compilation; ~1s, no extra job or macOS slot.
        run: ./scripts/ci/check-license-headers.sh

      - name: Prepare Xcode build (mtimes, caches, Metal toolchain)
        uses: ./.github/actions/prepare-xcode-build
        with:
          deriveddata-key-prefix: xcode27-deriveddata-ct
          deriveddata-restore-keys: xcode27-deriveddata-ct-${{ github.workflow }}-

      - name: Build for iOS Simulator (build-for-testing)
        run: |
          set -euo pipefail

          # build-for-testing (not build) so the artifact includes the test
          # bundles (VVTermTests.xctest + VVTermUITests.xctest) and the
          # .xctestrun manifest. This lets unit-tests use
          # `test-without-building` (zero compilation) and lets ui-tests
          # shards reuse the prebuilt app + test bundles.
          #
          # iPhone 17,arch=arm64 — the libssh2 static lib in Vendor/libssh2/ios-simulator
          # is arm64-only. iPhone 17 exists as a concrete simulator on the iOS 27.0
          # runtime shipped with Xcode 27; arch=arm64 selects the arm64 slice.
          #
          # Ad-hoc sign (CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-) so the
          # sim app embeds com.apple.security.network.client from
          # VVTerm.entitlements. An UNSIGNED sim app has no entitlements and
          # the iOS sim sandbox parks Network.framework connections of
          # unentitled apps in .waiting(.waitingForNetwork) forever — this
          # wedges the network monitor (NWPathMonitor), which gates the
          # terminal's initial connect, so the loopback-SSH fixture tests
          # (zen full-screen, reconnect, keyboard) could never connect. Same
          # reasoning as repro-zmx.yml / teleport-e2e.yml.
          xcodebuild build-for-testing \
            -scheme VVTerm \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            | tee "$RUNNER_TEMP/build.log"

      - name: Archive build products
        # Tar Build/Products + Build/Intermediates.noindex. actions/upload-
        # artifact does NOT preserve symlinks inside .app bundles (Frameworks
        # symlinks, etc.), which breaks `test-without-building` ("Cannot launch
        # simulated executable: no file found at .../VVTerm.app"). Tar
        # preserves symlinks + permissions.
        #
        # Intermediates.noindex (.o files, .swiftmodule, build intermediates)
        # IS included — unit-tests needs the compiled SPM modules to skip
        # recompiling swift-nio/MLX/etc. from scratch (~6m). The SPM cache
        # (SourcePackages) alone is insufficient; the compiled artifacts live
        # in Intermediates.noindex. ui-tests ignores this (test-without-building
        # does zero compilation).
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/DerivedData/Build"
          tar -czf "$RUNNER_TEMP/vvterm-build.tar.gz" Products Intermediates.noindex

      - name: Upload build products
        uses: actions/upload-artifact@v7
        with:
          name: vvterm-build
          path: ${{ runner.temp }}/vvterm-build.tar.gz
          retention-days: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

  wait-for-ota-publish:
    # OTA publish gate (unit-tests only). ios-adhoc-pr's sign-and-publish job
    # is created by workflow_run when the OTA archive completes (~9-13m after
    # push), while the 5 test jobs are created at push time — GitHub's FIFO
    # runner queue therefore always placed the publish behind the whole test
    # phase (measured 4-15m queue). Unit-tests (shortest job, off the wall-clock
    # critical path) waits for sign-and-publish to grab the slot the OTA
    # archive freed, so the installable OTA build + comment land ~1m after the
    # archive instead of after the test phase.
    #
    # Graceful degradation: a missing/failed/timed-out OTA or publish run
    # releases unit-tests immediately — tests never hang on the OTA pipeline.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for the OTA publish to start
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # 1. This push's OTA archive run (vvterm-pr-ota.yml, pull_request event).
          ota_run="$(gh run list --repo "$REPO" --workflow vvterm-pr-ota.yml \
            --event pull_request --commit "$HEAD_SHA" \
            --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -z "$ota_run" ]]; then
            echo "::notice::No VVTerm PR OTA run for $HEAD_SHA — publish gate skipped."
            exit 0
          fi
          echo "OTA archive run: $ota_run"

          # 2. Wait for the archive to reach a terminal state.
          for _ in $(seq 1 240); do
            status="$(gh api "repos/$REPO/actions/runs/$ota_run" --jq '.status' 2>/dev/null || true)"
            [[ "$status" == "completed" ]] && break
            sleep 10
          done
          status="$(gh api "repos/$REPO/actions/runs/$ota_run" --jq '.status' 2>/dev/null || true)"
          if [[ "$status" != "completed" ]]; then
            echo "::warning::OTA archive run $ota_run did not complete within 40m — releasing unit-tests."
            exit 0
          fi
          ota_end="$(gh api "repos/$REPO/actions/runs/$ota_run" --jq '.updated_at' || true)"
          if [[ -z "$ota_end" ]]; then
            echo "::warning::Could not read the OTA archive completion time — releasing unit-tests."
            exit 0
          fi
          echo "OTA archive completed at $ota_end"

          # 3. Find the ios-adhoc-pr run this completion spawned. workflow_run
          #    runs execute on main and carry no PR link (head_sha = main tip,
          #    pull_requests = []), so match by creation window instead.
          publish_run=""
          for _ in $(seq 1 30); do
            publish_run="$(gh run list --repo "$REPO" --workflow ios-adhoc-pr.yml \
              --event workflow_run --limit 100 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$ota_end\")] | sort_by(.createdAt) | .[0].databaseId // empty" || true)"
            [[ -n "$publish_run" ]] && break
            sleep 10
          done
          if [[ -z "$publish_run" ]]; then
            echo "::notice::No ios-adhoc-pr run appeared within 5m of OTA completion — releasing unit-tests."
            exit 0
          fi
          echo "Publish run: $publish_run"

          # 4. Release unit-tests once sign-and-publish has STARTED (it holds
          #    the slot the OTA archive freed; with unit-tests gated it is first
          #    in the runner queue). If the run concludes without starting
          #    (cancelled/failed OTA), release immediately.
          for _ in $(seq 1 90); do
            started="$(gh api "repos/$REPO/actions/runs/$publish_run/jobs" \
              --jq '.jobs[] | select(.name == "sign-and-publish") | .started_at // empty' 2>/dev/null || true)"
            if [[ -n "$started" ]]; then
              echo "sign-and-publish started at $started — releasing unit-tests."
              exit 0
            fi
            conclusion="$(gh api "repos/$REPO/actions/runs/$publish_run" --jq '.conclusion // empty' 2>/dev/null || true)"
            if [[ -n "$conclusion" ]]; then
              echo "::notice::ios-adhoc-pr concluded '${conclusion}' before publishing — releasing unit-tests."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Timed out waiting for sign-and-publish to start — releasing unit-tests."

  unit-tests:
    runs-on: xcode-27
    # Keep comfortably above the measured 19-21m runtime (compile + full
    # suite + pool contention). timeout-minutes: 20 was killing the job at
    # the 20m mark exactly when the runner was slow (observed 2026-08-14:
    # every run >20m was cancelled, every run <20m passed — perfect
    # correlation, three consecutive failures on PR #167).
    timeout-minutes: 30
    needs: [build, wait-for-ota-publish]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Xcode build (mtimes, caches, Metal toolchain)
        # NOTE: This job does NOT download the build artifact (unlike
        # ui-tests). The cache alone provides Products + Intermediates.noindex
        # + SourcePackages with correct mtimes — the artifact's fresh tar
        # mtimes would make xcodebuild re-validate and recompile all SPM deps
        # (~6m waste). The cache's mtime sidecar is the source of truth.
        uses: ./.github/actions/prepare-xcode-build
        with:
          deriveddata-key-prefix: xcode27-deriveddata-ct
          deriveddata-restore-keys: xcode27-deriveddata-ct-${{ github.workflow }}-

      - name: Run unit tests (VVTermTests)
        run: |
          set -euo pipefail

          # `test -scheme VVTermUnitTests` (NOT test-without-building).
          # test-without-building crashes on Xcode 27 due to a duplicate-symbol
          # conflict: the test bundle and app host both statically link
          # SwiftProtobuf, and `test-without-building` loads both into the
          # same process → "Class ... is implemented in both" → crash before
          # tests connect. This is an Xcode 27-specific regression (Xcode 26
          # doesn't exhibit it). The regular `test` command builds+runs in a
          # mode that uses the app's copy, avoiding the conflict.
          #
          # The build artifact (tar + extract) IS still reused: xcodebuild finds
          # the prebuilt app + Cmlx in the extracted DerivedData and skips
          # recompiling them, compiling only the VVTermTests target (~3m).
          # The VVTermUnitTests scheme is scoped to VVTermTests only.
          # -test-timeouts-enabled + 180s execution allowance: a hanging test
          # is KILLED and recorded as a failure BY NAME ("Exceeded execution
          # time allowance") instead of running to the 30m job timeout with no
          # per-test attribution. Same policy as the UI shards: treat any such
          # failure as a hang to fix or quarantine, not as a slow test.
          # Placement matters: `-parallel-testing-enabled` consumes a following
          # `-option` token as its value, so the timeout flags must precede it.
          #
          # Ad-hoc sign, matching the build job (CODE_SIGNING_ALLOWED=YES
          # CODE_SIGN_IDENTITY=-). `xcodebuild test` BUILDS the app, so an
          # unsigned build here is NOT harmless: an unsigned sim app carries no
          # entitlements, and the test host then dies before the tests connect.
          # Observed 2026-09-24 (run 36053966722): the log showed the
          # entitlements stripped (`Removed stale file '…/VVTerm.app.xcent'`),
          # then `[CK] … your process must have a
          # com.apple.developer.icloud-services entitlement`, a 600 s
          # diagnostics timeout, and finally "Early unexpected exit … The test
          # runner crashed before establishing connection". The bare
          # `-parallel-testing-enabled` used to swallow this setting, so the job
          # silently built signed and passed; making the flag explicit exposed
          # it. Matching the build job's flags also lets the extracted
          # DerivedData be reused rather than rebuilt.
          xcodebuild test \
            -scheme VVTermUnitTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            IgnoreFileSystemDeviceInodeChanges=YES \
            | tee "$RUNNER_TEMP/test.log"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore

  ui-tests:
    # Explicit stable name: without it the check-run name is rendered from
    # ALL matrix values (name, needs-fixture, and the full only-testing
    # list, truncated at ~79 chars), so it changes on every shard
    # rebalance. The stable name keeps each shard's check-run identifiable
    # in the PR's check list; the shards are not required checks (AGENTS.md).
    name: ui-tests-${{ matrix.shard.name }}
    runs-on: xcode-27
    # Kill cap for wedged shards, not expected runtime: setup ~2m + one
    # ~13m shard run ≈ 15m expected. 45m leaves slack for a session-level
    # wedge that would otherwise hang; the per-test 300s allowance
    # (-test-timeouts-enabled YES, see the Run UI tests step) catches
    # single hanging tests.
    timeout-minutes: 45
    needs: build
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    strategy:
      fail-fast: false
      matrix:
        shard:
          # 4 UI shards + unit-tests = 5 jobs, fitting GitHub's
          # 5-concurrent-macOS-job cap with ZERO queueing (per PR #41).
          # fail-fast is disabled so one failing shard does not cancel others.
          #
          # Shard split is LPT bin-packing of measured per-method runtimes
          # from the five successful 2026-09-23 runs (35855154311,
          # 35859452415, 35892455663, 35906201179, 35915626164). At
          # measurement time 78 executing methods were distributed
          # 19/19/20/20; bin sums 527.6 / 517.8 / 527.0 / 527.8s → max/min
          # ratio 1.02, well under the 1.3 rebalance threshold. #227 split
          # the push/pop test into list-position + session halves, both kept
          # in shard-0 (79 methods, 20/19/20/20) so they share one app
          # launch; the recorded bin sums predate the split and the next
          # ≥3-clean-run re-measurement refreshes them. Each bin carries 3
          # loopback-SSH-fixture-gated tests, so all four set
          # needs-fixture: true. The 21 XCTSkip/CI-gated entries (19
          # quarantined TerminalKeyboardUITests +
          # NoticePresentationUITests.testDismissedFailureDoesNotImmediatelyReopen
          # + VVTermUITests.testExample) and the duplicated TeleportReadinessIOS
          # crossDevice entry are deliberately not listed; they add no coverage.
          # Each entry's `only-testing` is a comma-separated list of
          # Target/Class/method — no spaces.
          #
          # The 18 TeleportUITests (mock-driven; measured 15-26s each, not the
          # ~5-10s an earlier split assumed) are distributed across the 4 shards
          # (~4-5 per shard) rather than a 5th, preserving the 5-job cap.
          - name: shard-0
            needs-fixture: true
            only-testing: "VVTermUITests/ServerNavigationUITests/testActiveTerminalPushPopPreservesListPosition,VVTermUITests/ServerNavigationUITests/testActiveTerminalPushPopPreservesSession,VVTermUITests/TerminalKeyboardUITests/testIMECompositionStopsPrintableHardwareKeyRepeat,VVTermUITests/NoticePresentationUITests/testConnectionFailureCloseExposesNavigationWithoutRetrying,VVTermUITests/NoticePresentationUITests/testDisconnectedSheetSupportsSwipeDismissalAndKeepsReconnect,VVTermUITests/TerminalLinkTapUITests/testDoubleTapStillSelectsWord,VVTermUITests/TerminalLinkTapUITests/testOSC8LinkTapPresentsConfirmationAlert,VVTermUITests/TerminalKeyboardUITests/testHardwareKeyboardAttachmentHidesAccessoryFromExistingSoftwareSession,VVTermUITests/TerminalKeyboardUITests/testBackgroundLifecycleStopsPrintableHardwareKeyRepeat,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_needsLogin_tapShowsLoginSheet,VVTermUITests/TerminalKeyboardUITests/testTouchingTerminalRequestsPaneFocus,VVTermUITests/TerminalZenModeUITests/testFullScreenZenConnectionBannerSitsBelowNotch,VVTermUITests/NoticePresentationUITests/testConnectionFailureUsesBottomSheetWithLargePrimaryAction,VVTermUITests/TerminalZenModeUITests/testDefaultToZenEntersZenAutomaticallyAndTerminalCoversScreen,VVTermUITests/TeleportUITests/testLogin_happyPath12h_showsSuccessCopyWith12hValidity,VVTermUITests/TeleportUITests/testBootstrap_suspended_showsReconnectingThenSucceedsOnRetry,VVTermUITests/TeleportReadinessUITests/testReadiness_needsRegistration_tapShowsBootstrapSheetNotRegistration,VVTermUITests/NoticePresentationUITests/testFirstUseHostKeyShowsTrustAffordance,VVTermUITests/TeleportReadinessUITests/testReadiness_ready_tapConnectsDirectly,VVTermUITests/TeleportUITests/testBootstrap_happyPath_showsSuccessCopy"
          - name: shard-1
            needs-fixture: true
            only-testing: "VVTermUITests/TerminalReconnectUITests/testProductionSSHBackgroundPreservesSessionKeyboardAndTyping,VVTermUITests/StatsCardsLayoutUITests/testDetailedCardsRemainContainedAcrossWideNarrowAndWideTransitions,VVTermUITests/TerminalKeyboardUITests/testRepeatedTerminalReconstructionKeepsRenderingAndInputResponsive,VVTermUITests/NoticePresentationUITests/testDiagnosticBannerExpandsCopiesScrollsAndDismisses,VVTermUITests/TerminalKeyboardUITests/testSplitPaneShortcutsRouteWithoutReachingTerminalInput,VVTermUITests/TerminalReconnectUITests/testColdRelaunchRestoresTabsSplitsSelectionAndReconnects,VVTermUITests/TerminalKeyboardUITests/testKeyboardIsScopedToTerminalSurface,VVTermUITests/TerminalKeyboardUITests/testPreservedTerminalGridMovesCursorAboveKeyboard,VVTermUITests/TerminalKeyboardUITests/testDirectTouchDoesNotClickOutsideMouseCapture,VVTermUITests/TeleportUITests/testRegistration_emptyDeviceName_disablesContinueButton,VVTermUITests/TerminalZenModeUITests/testZenLauncherCircleIsFullyTappable,VVTermUITests/TerminalZenModeUITests/testFullScreenZenAutoShiftsInitialPromptBelowNotch,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_needsRegistration_tapShowsBootstrapSheetNotRegistration,VVTermUITests/TeleportReadinessUITests/testReadiness_needsBootstrap_tapShowsBootstrapSheet,VVTermUITests/TeleportUITests/testRegistration_alreadyExists_showsInlineErrorCopy,VVTermUITests/TeleportUITests/testLogin_serverUnreachable_showsNetworkLostCopy,VVTermUITests/TeleportUITests/testBootstrap_networkLost_showsNetworkConnectionLostCopy,VVTermUITests/TeleportUITests/testRegistration_invalidChars_showsPrefilledSanitizedName,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_ready_tapConnectsDirectly"
          - name: shard-2
            needs-fixture: true
            only-testing: "VVTermUITests/TerminalReconnectUITests/testProductionCodexFindKeyboardMenuRestoresPTYTyping,VVTermUITests/StatsCardsLayoutUITests/testLockedDockerCardRemainsContainedAfterRepeatedRotation,VVTermUITests/StatsStorageUITests/testBrowsingSwipeEditVisibilityAndHealthStates,VVTermUITests/TerminalKeyboardUITests/testCommandPlusAndMinusZoomWithoutReachingTerminalInput,VVTermUITests/TerminalReconnectUITests/testProductionSSHBackgroundPreservesDarkAccessoryAppearance,VVTermUITests/NoticePresentationUITests/testInactiveSplitPaneCannotPresentConnectionBanner,VVTermUITests/TerminalZenModeUITests/testMenuEntryHidesChromeAndFloatingControlRestoresIt,VVTermUITests/TerminalKeyboardUITests/testHardwareKeyboardDetachStopsPrintableHardwareKeyRepeat,VVTermUITests/TerminalKeyboardUITests/testIMEProxyMarkedTextDeleteAndCommitPath,VVTermUITests/TerminalZenModeUITests/testZenPanelShareDiagnosticsButtonTriggersHandler,VVTermUITests/TerminalZenModeUITests/testFullScreenZenOverscrollShiftsContentPastTopEdgeAndResets,VVTermUITests/TerminalKeyboardUITests/testHardwareKeyboardFocusSuppressesAccessoryBar,VVTermUITests/TeleportReadinessUITests/testReadiness_needsLogin_tapShowsLoginSheet,VVTermUITests/TeleportUITests/testRegistration_happyPath_showsFormAndContinueSucceeds,VVTermUITests/TeleportUITests/testLogin_faceIDCancelled_showsFaceIDCancelledCopy,VVTermUITests/TeleportReadinessUITests/testReadiness_crossDevice_iCloudSync_showsNeedsBootstrap,VVTermUITests/TeleportUITests/testLogin_certExpiredOnTap_showsSuccessCopyWithNewTTL,VVTermUITests/TeleportUITests/testLogin_happyPath1h_showsSuccessCopyWith1hValidity,VVTermUITests/TeleportUITests/testBootstrap_safariUnavailable_showsManualLinkCopy,VVTermUITests/TeleportUITests/testBootstrap_userCancelled_showsSetupCancelledCopy"
          - name: shard-3
            needs-fixture: true
            only-testing: "VVTermUITests/StatsCardsLayoutUITests/testCompactCardsRemainContainedAcrossWideNarrowAndWideTransitions,VVTermUITests/ServerNavigationUITests/testBackgroundReturnPreservesSessionKeyboardAndBackResponsiveness,VVTermUITests/TerminalReconnectUITests/testProductionCodexModesKeepKeyboardAndPTYTyping,VVTermUITests/NoticePresentationUITests/testConcurrentOperationsStackAboveBottomToolbar,VVTermUITests/TerminalKeyboardUITests/testDockedFloatingDockedGeometryKeepsSurfaceAndViewportValid,VVTermUITests/TerminalKeyboardUITests/testRepeatedFocusTapsKeepDefaultKeyboardAndLayoutStable,VVTermUITests/NoticePresentationUITests/testInitialConnectionBannerYieldsToTmuxSelectionSheet,VVTermUITests/TerminalKeyboardUITests/testPaneCloseAlertRestoresTerminalFocusAfterCancel,VVTermUITests/NoticePresentationUITests/testHostKeyFailureRetainsCloseAndTrustActions,VVTermUITests/TerminalZenModeUITests/testFullScreenZenKeyboardOpenPreservesGridAndKeepsContentVisible,VVTermUITests/TerminalScreenAwakeUITests/testTerminalSettingControlsIdleTimerAndRestoresAfterBackground,VVTermUITests/NoticePresentationUITests/testRetryFromDismissedBannerCanPresentANewFailure,VVTermUITests/NoticePresentationUITests/testInitialConnectionUsesNonBlockingTopBanner,VVTermUITests/TeleportUITests/testRegistration_cancelBetweenSafariTrips_showsFormAfterCancel,VVTermUITests/TeleportUITests/testLogin_faceIDUnavailable_showsFaceIDUnavailableCopy,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_crossDevice_iCloudSync_showsNeedsBootstrap,VVTermUITests/TeleportReadinessIOSUITests/testReadinessIOS_needsBootstrap_tapShowsBootstrapSheet,VVTermUITests/NoticePresentationUITests/testFilesOperationNoticeRemainsVisibleOnPushedPreview,VVTermUITests/TeleportUITests/testBootstrap_serverError_showsServerMessageVerbatim,VVTermUITests/TeleportUITests/testBootstrap_timeout_showsApprovalTimedOutCopy"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore source mtimes
        # Git does not store file mtimes; `actions/checkout` writes files
        # with the clone timestamp. Restore each file's mtime to its
        # last-commit time for consistency across runs.
        uses: chetan/git-restore-mtime-action@v2

      - name: Download build products
        # Download the tarball from the build job and extract it into the
        # same -derivedDataPath the build used. Tar preserves the symlinks
        # inside .app bundles that actions/download-artifact would flatten.
        uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          path: ${{ runner.temp }}

      - name: Extract build products
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/DerivedData/Build"
          tar -xzf "$RUNNER_TEMP/vvterm-build.tar.gz" -C "$RUNNER_TEMP/DerivedData/Build"

      - name: Download Metal toolchain
        # The xcode-27 public-preview image does not ship the Metal toolchain.
        # Required by mlx-swift Cmlx shaders + libghostty Metal renderer.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install xcparse
        # Install xcparse to extract XCTAttachment screenshots from the
        # xcresult bundle. `xcrun xcresulttool export attachments` produces
        # no PNGs when tests run with -parallel-testing-enabled (parallel
        # testing creates separate simulator clones whose attachments don't
        # aggregate into the main xcresult). xcparse also handles the Xcode 11+
        # nested xcresult format more robustly than xcresulttool.
        run: brew install chargepoint/xcparse/xcparse

      - name: Provision loopback SSH fixture (fixture shards only)
        # Boots a pubkey-only sshd on 127.0.0.1:22232 and writes
        # $RUNNER_TEMP/vvterm-repro/vvterm-repro.env with the fixture vars.
        # The simulator shares the runner loopback, so the app's terminal
        # can SSH into it like the dev-seeded local fixture. Only the shards
        # whose tests drive real connections (zen full-screen, reconnect,
        # server navigation) pay this ~10s cost.
        if: matrix.shard.needs-fixture
        run: bash scripts/ci/repro-sshd-setup.sh

      - name: Run UI tests (shard ${{ matrix.shard.name }})
        shell: bash
        run: |
          set +e  # GitHub Actions defaults to `bash -e`; disable so non-zero exits don't abort.
          set -uo pipefail

          # test-without-building with -xctestrun: run the prebuilt
          # VVTermUITests.xctest from the build artifact with ZERO compilation.
          # Previously `test -scheme VVTerm` recompiled because xcodebuild
          # re-validates the dependency graph even when the artifact is present.
          # -only-testing: restricts execution to this shard's tests.
          XCRUN=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name '*.xctestrun' | head -1)
          echo "Using xctestrun manifest: $XCRUN"

          # Inject SCREENSHOT_DIR into the xctestrun plist's
          # EnvironmentVariables dictionary. The TEST_RUNNER_ env-var prefix
          # only works with `xcodebuild test` (which re-resolves the scheme),
          # NOT with `test-without-building -xctestrun` (which uses the
          # pre-baked plist from build-for-testing). The xctestrun v2 format
          # nests env vars at:
          #   TestConfigurations[0].TestTargets[*].EnvironmentVariables
          # Use python (plistlib) to inject into every test target's dict.
          #
          # Also set UserAttachmentLifetime + SystemAttachmentLifetime to
          # 'keepAlways' — the build-for-testing scheme defaults them to
          # 'deleteOnSuccess', which drops XCTAttachment screenshots when
          # tests pass (so the xcresult ends up empty).
          export SCREENSHOT_DIR="$RUNNER_TEMP/screenshots"
          mkdir -p "$SCREENSHOT_DIR"

          # Fixture shards: source the sshd rig's env (username, private key)
          # and point the harness at the sshd port directly (22232). The rig
          # script writes VVTERM_REPRO_SSH_PORT=22229 for the bytemeter proxy
          # used by repro-zmx.yml; PR CI has no bytemeter, so the app must
          # talk to sshd itself.
          if [ "${{ matrix.shard.needs-fixture }}" == "true" ]; then
            # shellcheck disable=SC1091
            # `set -a` auto-exports every var the rig env file defines (plain
            # `source` would leave them as shell-only vars, invisible to the
            # python plist injection below).
            set -a
            source "$RUNNER_TEMP/vvterm-repro/vvterm-repro.env"
            set +a
            export VVTERM_REPRO_SSH_PORT=22232
            echo "fixture: user=$VVTERM_REPRO_SSH_USERNAME port=$VVTERM_REPRO_SSH_PORT"
          fi
          python3 - "$XCRUN" "$SCREENSHOT_DIR" <<'PY'
          import plistlib, os, sys
          path, screenshot_dir = sys.argv[1], sys.argv[2]
          with open(path, "rb") as f:
              data = plistlib.load(f)
          # The loopback-SSH fixture tests (zen full-screen, reconnect,
          # server navigation) run when VVTERM_REPRO_SSH_* reaches the test
          # runner (LoopbackSSHFixtureTestSupport gates on it); the harness
          # re-exports it into the app's launchEnvironment.
          fixture_env = {}
          for key in ("VVTERM_REPRO_SSH_USERNAME", "VVTERM_REPRO_SSH_PRIVATE_KEY", "VVTERM_REPRO_SSH_PORT", "VVTERM_REPRO_SSH_HOST_KEY_FINGERPRINT", "VVTERM_REPRO_SSH_HOST_KEY_TYPE"):
              if key in os.environ:
                  fixture_env[key] = os.environ[key]
          injected = 0
          for cfg in data.get("TestConfigurations", []):
              for target in cfg.get("TestTargets", []):
                  env = target.setdefault("EnvironmentVariables", {})
                  env["SCREENSHOT_DIR"] = screenshot_dir
                  env.update(fixture_env)
                  # The UI-test runner's env comes ONLY from this plist
                  # (TEST_RUNNER_ prefixes do not work with
                  # test-without-building -xctestrun), so the shell's CI=true
                  # never reaches the runner. Inject it explicitly so
                  # ProcessInfo checks (e.g. the #45 template-test skip in
                  # VVTermUITests/testExample) actually fire in CI.
                  env["CI"] = "1"
                  # Keep XCTAttachment screenshots even when tests pass.
                  target["UserAttachmentLifetime"] = "keepAlways"
                  target["SystemAttachmentLifetime"] = "keepAlways"
                  injected += 1
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          print(f"Injected SCREENSHOT_DIR + keepAlways + fixture({list(fixture_env)}) into {injected} test target(s)")
          PY
          echo "xctestrun plist after injection:"
          python3 -c "import plistlib; d=plistlib.load(open('$XCRUN','rb')); [print(f'  target {i}: SCREENSHOT_DIR={t.get(\"EnvironmentVariables\",{}).get(\"SCREENSHOT_DIR\",\"<MISSING>\")}') for cfg in d.get('TestConfigurations',[]) for i,t in enumerate(cfg.get('TestTargets',[]))]"

          # Build the -only-testing args. The matrix `only-testing` value is
          # a comma-separated list, but xcodebuild requires ONE identifier per
          # -only-testing flag (repeatable). A single comma-separated string
          # silently resolves to an empty test set on Xcode 27 beta —
          # xcodebuild runs 0 tests and exits success. Transform the string
          # into repeated -only-testing: flags.
          ONLY_TESTING_ARGS=""
          IFS=',' read -ra TEST_IDS <<< "${{ matrix.shard.only-testing }}"
          for id in "${TEST_IDS[@]}"; do
            ONLY_TESTING_ARGS="$ONLY_TESTING_ARGS -only-testing:$id"
          done
          echo "Shard test args:$ONLY_TESTING_ARGS"

          # -test-timeouts-enabled + 300s execution allowance: a hanging test
          # is KILLED and recorded as a failure BY NAME ("Exceeded execution
          # time allowance") instead of wedging the shard until XCTest's own
          # launch/activity timeouts fire — hangs become identifiable,
          # skippable tests instead of silent wall-clock burn. 300s is set
          # from the slowest real test: testActiveTerminalPushPopPreservesList
          # PositionAndSession ran 185.8-245.1s across the five measured
          # 2026-09-23 runs (next longest ~98s), so 300s leaves headroom for a
          # loaded runner without letting a hang burn the cap. A degraded
          # runner can still push that test past 300s and kill it (observed
          # 2026-09-24 run 35939209454: killed at exactly 300.000s) — that is
          # the allowance doing its job: a named failure, and a verdict to fix
          # or quarantine, never to retry (AGENTS.md). #227 has split the test
          # so a tighter allowance can be re-derived after the next
          # ≥3-clean-run re-measurement.
          #
          # Parallel testing is explicitly OFF. The shard bins are LPT-packed
          # from SERIAL per-test sums (~527s/bin ≈ 14.1m/shard), and
          # `-parallel-testing-enabled YES` (the first #230 revision) instead
          # ran 2 simulator clones per shard — 8 concurrent clones across the
          # 4 shards — which correlates with the wedge wave and the 38-39m
          # walls of run 35939209454. Pre-#230 main was effectively serial (0
          # `Clone` lines, 42 classic-format test lines, XCTAssert in stdout
          # in run 35915626164); parallel was never intended. There are no
          # shard retries: a failed shard fails the run, and a host-state
          # flake must be fixed or quarantined into a non-blocking job.
          #
          # Placement is load-bearing. A bare `-parallel-testing-enabled`
          # consumes the FOLLOWING `-option` token as its optional YES/NO
          # value, which silently made the timeout flags inert. Probe on
          # Xcode 26.3: `xcodebuild test -scheme __nope__
          # -parallel-testing-enabled -test-timeouts-enabled YES` →
          # `error: Unknown build action 'YES'` (the timeout flag was eaten);
          # the bare form without YES parses but drops the timeouts. Keep the
          # timeout flags first and give every boolean an explicit value.
          # Pre-boot the destination simulator so the test session never
          # starts against a still-initializing boot (4 shards boot sims
          # simultaneously; a boot that is not ready when xcodebuild starts
          # is a recurring source of "Failed to initialize for UI testing:
          # Timed out waiting for AX loaded notification" and hard
          # app-launch timeouts, #43 family). Bounded poll — do NOT use
          # `bootstatus -b` here (it can block forever on a wedged
          # CoreSimulator).
          xcrun simctl boot "iPhone 17" >/dev/null 2>&1 || true
          BOOTED=0
          for _ in $(seq 1 60); do
            if xcrun simctl list devices booted 2>/dev/null | grep -q "iPhone 17"; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          if [ "$BOOTED" -ne 1 ]; then
            echo "::warning::iPhone 17 did not report Booted within 120s; continuing (xcodebuild will retry its own boot)."
          fi
          rm -rf "$RUNNER_TEMP/TestResults.xcresult"
          xcodebuild test-without-building -collect-test-diagnostics never \
            -xctestrun "$XCRUN" \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            $ONLY_TESTING_ARGS \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test.log"
          XC_EXIT=${PIPESTATUS[0]}
          # Preserve xcodebuild's exit code for the step status, but don't
          # abort before the upload steps (which run on always()).
          #
          # -collect-test-diagnostics never: skip the 600s simulator diagnostic
          # collection that fires after a test failure. The diagnostic collection
          # (sysdiagnose, log archive) takes 600s (10m) per failed test and is
          # the main source of CI wall-clock waste from flakes. The xcresult
          # bundle already contains the test failure details. Use the debug-test
          # job (workflow_dispatch) to capture full diagnostics when needed.
          exit $XC_EXIT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.shard.name }}
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore

      - name: Extract + upload screenshots
        # UserAttachmentLifetime + SystemAttachmentLifetime are set to
        # 'keepAlways' in the xctestrun (see Run UI tests step), so
        # XCTAttachment screenshots survive into the xcresult bundle even
        # when tests pass. Parallel testing writes a single merged xcresult
        # at -resultBundlePath (no merge step needed). Extract the PNGs with
        # `xcparse screenshots` so they're viewable as artifacts. Also search
        # for loose files as a fallback.
        if: always()
        run: |
          set +e
          export_dir="$RUNNER_TEMP/screenshots"
          mkdir -p "$export_dir"
          # Extract XCTAttachment screenshots from the xcresult bundle.
          if [ -d "$RUNNER_TEMP/TestResults.xcresult" ]; then
            xcparse screenshots \
              "$RUNNER_TEMP/TestResults.xcresult" \
              "$export_dir" 2>/dev/null
            echo "xcparse exit: $?"
          fi
          echo "=== Extracted files ==="
          find "$export_dir" -type f 2>/dev/null | head -30 || true
          echo "=== Searching simulator containers ==="
          find ~/Library/Developer/CoreSimulator/Devices -name 'setUp-marker.txt' 2>/dev/null | head -10 || true
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-screenshots-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  # Debug job: run a single test with full diagnostics (sysdiagnose, log
  # archive) for investigating flakes. Trigger via workflow_dispatch with
  # the `debug_test` input set to the test identifier (e.g.
  # `VVTermUITests/StatsCardsLayoutUITests/testDetailedCards...`).
  #
  # This job runs OUTSIDE the normal PR CI path (only on workflow_dispatch
  # with debug_test set). It uses `-collect-test-diagnostics always` to
  # capture the full simulator diagnostics that the normal CI path skips
  # (which saves ~10m per failed shard). Use this when a flake needs
  # deeper investigation than the xcresult + test.log provide.
  debug-test:
    runs-on: xcode-27
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_test != ''
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Xcode build (mtimes, caches, Metal toolchain)
        uses: ./.github/actions/prepare-xcode-build
        with:
          deriveddata-key-prefix: xcode27-deriveddata-ct
          deriveddata-restore-keys: xcode27-deriveddata-ct-${{ github.workflow }}-

      - name: Download build products
        uses: actions/download-artifact@v8
        with:
          name: vvterm-build
          path: ${{ runner.temp }}

      - name: Extract build products
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/DerivedData/Build"
          tar -xzf "$RUNNER_TEMP/vvterm-build.tar.gz" -C "$RUNNER_TEMP/DerivedData/Build"

      - name: Install xcparse
        run: brew install chargepoint/xcparse/xcparse

      - name: Run single test with full diagnostics
        run: |
          set -euo pipefail
          XCRUN=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name '*.xctestrun' | head -1)
          echo "Using xctestrun manifest: $XCRUN"

          export SCREENSHOT_DIR="$RUNNER_TEMP/screenshots"
          mkdir -p "$SCREENSHOT_DIR"
          python3 - "$XCRUN" "$SCREENSHOT_DIR" <<'PY'
          import plistlib, sys
          path, screenshot_dir = sys.argv[1], sys.argv[2]
          with open(path, "rb") as f:
              data = plistlib.load(f)
          for cfg in data.get("TestConfigurations", []):
              for target in cfg.get("TestTargets", []):
                  env = target.setdefault("EnvironmentVariables", {})
                  env["SCREENSHOT_DIR"] = screenshot_dir
                  target["UserAttachmentLifetime"] = "keepAlways"
                  target["SystemAttachmentLifetime"] = "keepAlways"
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          PY

          # Explicit values and option-before-option ordering: a bare
          # `-parallel-testing-enabled` can absorb the following option token
          # (the same defect fixed in the shard invocation), silently
          # disabling the diagnostics/timeout flags this job exists for.
          # Parallel testing is OFF here too: this job exists to capture full
          # per-test diagnostics in the log, and parallel mode routes them into
          # the xcresult instead.
          xcodebuild test-without-building \
            -xctestrun "$XCRUN" \
            -destination "platform=iOS Simulator,name=iPhone 17,arch=arm64" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -only-testing:"${{ github.event.inputs.debug_test }}" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics always \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance ${{ github.event.inputs.debug_timeout }} \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test.log"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore

      - name: Extract + upload screenshots
        if: always()
        run: |
          set +e
          export_dir="$RUNNER_TEMP/screenshots"
          mkdir -p "$export_dir"
          if [ -d "$RUNNER_TEMP/TestResults.xcresult" ]; then
            xcparse screenshots \
              "$RUNNER_TEMP/TestResults.xcresult" \
              "$export_dir" 2>/dev/null
          fi
          find "$export_dir" -type f 2>/dev/null | head -30 || true
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-test-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

