//
//  iotest_mfa.proto
//  VVTerm
//
//  Minimal gRPC surface for the in-app Teleport MFA client. It carries the
//  messages the app sends and decodes for the Phase-1 headless bootstrap,
//  the existing-device browser MFA ceremony, and passwordless registration.
//
//  Message names, field numbers, wire types, and oneof membership are the
//  client/server contract and must match the Teleport auth service. Field
//  names stay lower_snake_case so the generated Swift reads naturally
//  (requestID, rawID, clientDataJson, ...).
//
//  Regenerate with scripts/regen-iotest-mfa.sh (pinned protoc-gen-swift).
//

syntax = "proto3";

package proto;

// MARK: - Shared enums

// DeviceType identifies the MFA device kind. Value 2 belonged to the retired
// U2F flow and stays reserved so it can never be reused.
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_TOTP = 1;
  reserved 2;
  DEVICE_TYPE_WEBAUTHN = 3;
}

// DeviceUsage selects what a WebAuthn device is registered for.
enum DeviceUsage {
  DEVICE_USAGE_UNSPECIFIED = 0;
  DEVICE_USAGE_MFA = 1;
  DEVICE_USAGE_PASSWORDLESS = 2;
}

// ChallengeScope authorizes what a solved MFA challenge may be used for.
enum ChallengeScope {
  CHALLENGE_SCOPE_UNSPECIFIED = 0;
  CHALLENGE_SCOPE_LOGIN = 1;
  CHALLENGE_SCOPE_PASSWORDLESS_LOGIN = 2;
  CHALLENGE_SCOPE_HEADLESS_LOGIN = 3;
  CHALLENGE_SCOPE_MANAGE_DEVICES = 4;
  CHALLENGE_SCOPE_ACCOUNT_RECOVERY = 5;
  CHALLENGE_SCOPE_USER_SESSION = 6;
  CHALLENGE_SCOPE_ADMIN_ACTION = 7;
  CHALLENGE_SCOPE_CHANGE_PASSWORD = 8;
}

// MARK: - Challenge requests

// ContextUser asks for a challenge for the authenticated user.
message ContextUser {}

// Passwordless asks for a challenge that does not require an existing
// credential.
message Passwordless {}

// ChallengeExtensions carries the scope the issued challenge is authorized
// for.
message ChallengeExtensions {
  ChallengeScope scope = 1;
}

// CreateAuthenticateChallengeRequest starts an authentication ceremony.
message CreateAuthenticateChallengeRequest {
  oneof request {
    string recovery_start_token_id = 2;
    ContextUser context_user = 3;
    Passwordless passwordless = 4;
  }
  ChallengeExtensions challenge_extensions = 6;
  string sso_client_redirect_url = 7;
  string proxy_address = 8;
  string browser_mfa_tsh_redirect_url = 9;
  string browser_mfa_request_id = 10;
}

// CreateRegisterChallengeRequest starts a registration ceremony. The existing
// MFA response is present when the user already has a device.
message CreateRegisterChallengeRequest {
  string token_id = 1;
  DeviceType device_type = 2;
  DeviceUsage device_usage = 3;
  MFAAuthenticateResponse existing_mfa_response = 4;
}

// AddMFADeviceSyncRequest finishes a registration with the signed response.
message AddMFADeviceSyncRequest {
  string token_id = 1;
  string new_device_name = 2;
  MFARegisterResponse new_mfa_response = 3;
  DeviceUsage device_usage = 4;
  ContextUser context_user = 5;
}

// AddMFADeviceSyncResponse is returned on a successful registration. The
// server's device field (1) is a serialized MFADevice; this client only
// needs the call to succeed, so it decodes the field opaquely.
message AddMFADeviceSyncResponse {
  bytes device = 1;
}

// MARK: - Challenge responses

// MFAAuthenticateChallenge carries the authentication challenges the user
// can solve. The server sets exactly one.
message MFAAuthenticateChallenge {
  reserved 1;
  TOTPChallenge totp = 2;
  CredentialAssertion webauthn_challenge = 3;
  int32 mfa_required = 4;
  BrowserMFAChallenge browser_mfa_challenge = 6;
}

// MFAAuthenticateResponse carries the solved authentication challenge.
message MFAAuthenticateResponse {
  oneof response {
    TOTPResponse totp = 2;
    CredentialAssertionResponse webauthn = 3;
    BrowserMFAResponse browser = 5;
  }
}

// MFARegisterChallenge carries exactly one registration challenge.
message MFARegisterChallenge {
  oneof request {
    CredentialCreation webauthn = 3;
  }
}

// MFARegisterResponse carries the solved registration challenge.
message MFARegisterResponse {
  oneof response {
    CredentialCreationResponse webauthn = 3;
  }
}

// BrowserMFAChallenge asks the client to solve the challenge in a browser.
message BrowserMFAChallenge {
  string request_id = 1;
}

// BrowserMFAResponse returns the browser ceremony's WebAuthn assertion.
message BrowserMFAResponse {
  string request_id = 1;
  CredentialAssertionResponse webauthn_response = 2;
}

// TOTPChallenge signals that a TOTP code is expected.
message TOTPChallenge {}

// TOTPResponse carries the TOTP code the user entered.
message TOTPResponse {
  string code = 1;
}

// MARK: - WebAuthn messages

// CredentialDescriptor identifies one credential allowed for a ceremony.
message CredentialDescriptor {
  string type = 1;
  bytes id = 2;
  repeated string transports = 3;
}

// PublicKeyCredentialRequestOptions is the assertion challenge the
// authenticator signs.
message PublicKeyCredentialRequestOptions {
  bytes challenge = 1;
  int64 timeout_ms = 2;
  string rp_id = 3;
  repeated CredentialDescriptor allow_credentials = 4;
  string user_verification = 6;
}

// CredentialAssertion wraps the assertion request options.
message CredentialAssertion {
  PublicKeyCredentialRequestOptions public_key = 1;
}

// RelyingPartyEntity names the relying party.
message RelyingPartyEntity {
  string id = 1;
  string name = 2;
  reserved 3;
}

// UserEntity identifies the user a credential belongs to.
message UserEntity {
  string id = 1;
  string name = 2;
  string display_name = 3;
  reserved 4;
}

// PublicKeyCredentialCreationOptions is the registration challenge the
// authenticator signs.
message PublicKeyCredentialCreationOptions {
  bytes challenge = 1;
  RelyingPartyEntity rp = 2;
  UserEntity user = 3;
  int64 timeout_ms = 5;
  repeated CredentialDescriptor exclude_credentials = 6;
  string attestation = 7;
}

// CredentialCreation wraps the creation request options.
message CredentialCreation {
  PublicKeyCredentialCreationOptions public_key = 1;
}

// AuthenticatorAssertionResponse is the raw assertion output.
message AuthenticatorAssertionResponse {
  bytes client_data_json = 1;
  bytes authenticator_data = 2;
  bytes signature = 3;
  bytes user_handle = 4;
}

// AuthenticatorAttestationResponse is the raw attestation output.
message AuthenticatorAttestationResponse {
  bytes client_data_json = 1;
  bytes attestation_object = 2;
}

// CredentialAssertionResponse is the assertion a client returns for login.
message CredentialAssertionResponse {
  string type = 1;
  bytes raw_id = 2;
  AuthenticatorAssertionResponse response = 3;
  string id = 5;
}

// CredentialCreationResponse is the attestation a client returns for
// registration.
message CredentialCreationResponse {
  string type = 1;
  bytes raw_id = 2;
  AuthenticatorAttestationResponse response = 3;
  string id = 5;
}
